<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160" style="background:#0a0f1d; font-family:'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Background Grid -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="3840" height="2160" fill="#0a0f1d"/>
  <rect width="3840" height="2160" fill="url(#grid)"/>

  <!-- Outer Blueprint Border -->
  <rect x="30" y="30" width="3780" height="2100" rx="16" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.8"/>
  <rect x="42" y="42" width="3756" height="2076" rx="10" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top Header Banner -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="3720" height="120" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#cardGlow)"/>
    <rect x="0" y="0" width="12" height="120" rx="6" fill="url(#headerGrad)"/>
    
    <!-- Title & Subtitle -->
    <text x="40" y="52" fill="url(#headerGrad)" font-size="38" font-weight="900" letter-spacing="1.5">DIODE CLIPPING CIRCUITS &amp; VOLTAGE TRANSFER CHARACTERISTICS (VTC) ENGINE</text>
    <text x="40" y="94" fill="#94a3b8" font-size="22" font-weight="500">8 Canonical Configurations, Systematic Transition 4-Step Analysis, Combinational Slicers &amp; VTC Curves</text>
    
    <!-- Badges -->
    <rect x="3100" y="32" width="260" height="56" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="3230" y="68" fill="#38bdf8" font-size="20" font-weight="800" text-anchor="middle">GATE 2027 TITAN SUITE</text>
    <rect x="3400" y="32" width="280" height="56" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="3540" y="68" fill="#fbbf24" font-size="20" font-weight="800" text-anchor="middle">FIGURE 5 • 4K VECTOR</text>
  </g>

  <!-- Content Canvas -->
  <g transform="translate(60, 200)">
    
<!-- Column 1: Clipper Principles &amp; Systematic Analysis Algorithm -->
<g transform="translate(0, 0)">
  <rect x="0" y="0" width="1200" height="660" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#cardGlow)"/>
  <rect x="0" y="0" width="10" height="660" rx="5" fill="#38bdf8"/>
  <text x="30" y="45" fill="#38bdf8" font-size="26" font-weight="800">1. Clipper Classification &amp; 4-Step Systematic Engine</text>
  <text x="30" y="85" fill="#e2e8f0" font-size="19">• Definition: Waveform shapers that remove (clip) portions of input signal above or below a reference level.</text>
  <text x="30" y="125" fill="#94a3b8" font-size="18">Primary Classification: Series Clippers (diode in series with signal) vs Shunt Clippers (diode in parallel with output).</text>

  <rect x="40" y="150" width="1120" height="420" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="60" y="185" fill="#fbbf24" font-size="22" font-weight="800">THE 4-STEP CLIPPER ANALYSIS ALGORITHM</text>
  
  <text x="60" y="225" fill="#38bdf8" font-size="20" font-weight="700">Step 1: Determine Transition (Break) Voltage V_trans</text>
  <text x="80" y="260" fill="#e2e8f0" font-size="18">• Diode transitions between ON and OFF when diode current I_D = 0 and diode voltage V_D = 0 (ideal) or V_γ.</text>
  <text x="80" y="290" fill="#34d399" font-size="19" font-weight="700">  Set V_A = V_K  ⇒  Solve for input voltage v_i = V_trans.</text>

  <text x="60" y="335" fill="#38bdf8" font-size="20" font-weight="700">Step 2: Determine Diode State for v_i &gt; V_trans</text>
  <text x="80" y="370" fill="#e2e8f0" font-size="18">• Choose a test input voltage greater than V_trans (e.g. +100 V). Determine if diode is forward-biased.</text>
  <text x="80" y="400" fill="#e2e8f0" font-size="18">• Replace diode with short circuit (or V_γ) and calculate v_o.</text>

  <text x="60" y="445" fill="#38bdf8" font-size="20" font-weight="700">Step 3: Determine Diode State for v_i &lt; V_trans</text>
  <text x="80" y="480" fill="#e2e8f0" font-size="18">• Choose a test input voltage less than V_trans (e.g. -100 V). Replace diode with open circuit and calculate v_o.</text>

  <text x="60" y="525" fill="#38bdf8" font-size="20" font-weight="700">Step 4: Construct Voltage Transfer Characteristic (VTC) &amp; Waveform</text>
  <text x="80" y="555" fill="#e2e8f0" font-size="18">• Plot v_o versus v_i. Slope is either 1 (when output tracks input) or 0 (when output is clipped to DC reference).</text>

  <text x="30" y="615" fill="#f43f5e" font-size="18" font-weight="700">★ Slope Invariance: For ideal resistive clippers, VTC slopes are strictly 0 (clipped) or 1 (pass-through)!</text>
</g>

<!-- Column 2: 4 Canonical Shunt Clippers -->
<g transform="translate(1240, 0)">
  <rect x="0" y="0" width="1220" height="660" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#cardGlow)"/>
  <rect x="0" y="0" width="10" height="660" rx="5" fill="#34d399"/>
  <text x="30" y="45" fill="#34d399" font-size="26" font-weight="800">2. The 4 Canonical Shunt Clipper Topologies</text>

  <!-- Clipper A -->
  <g transform="translate(40, 70)">
    <rect x="0" y="0" width="550" height="260" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="30" fill="#38bdf8" font-size="19" font-weight="800">A. Positive Shunt Clipper (Unbiased)</text>
    <text x="20" y="60" fill="#e2e8f0" font-size="16">• Diode cathode grounded; anode at output.</text>
    <text x="20" y="90" fill="#34d399" font-size="17" font-weight="700">Transition: V_trans = 0 V</text>
    <text x="20" y="120" fill="#e2e8f0" font-size="16">• For v_i &gt; 0: Diode ON ⇒ v_o = 0 V (Clipped!)</text>
    <text x="20" y="150" fill="#e2e8f0" font-size="16">• For v_i &lt; 0: Diode OFF ⇒ v_o = v_i (Passed!)</text>
    <text x="20" y="185" fill="#fbbf24" font-size="16" font-weight="700">Output: Only negative half-cycle passes.</text>
    <text x="20" y="215" fill="#94a3b8" font-size="15">VTC: Slope = 0 for v_i &gt; 0; Slope = 1 for v_i &lt; 0.</text>
  </g>

  <!-- Clipper B -->
  <g transform="translate(620, 70)">
    <rect x="0" y="0" width="550" height="260" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="30" fill="#34d399" font-size="19" font-weight="800">B. Negative Shunt Clipper (Unbiased)</text>
    <text x="20" y="60" fill="#e2e8f0" font-size="16">• Diode anode grounded; cathode at output.</text>
    <text x="20" y="90" fill="#34d399" font-size="17" font-weight="700">Transition: V_trans = 0 V</text>
    <text x="20" y="120" fill="#e2e8f0" font-size="16">• For v_i &gt; 0: Diode OFF ⇒ v_o = v_i (Passed!)</text>
    <text x="20" y="150" fill="#e2e8f0" font-size="16">• For v_i &lt; 0: Diode ON ⇒ v_o = 0 V (Clipped!)</text>
    <text x="20" y="185" fill="#fbbf24" font-size="16" font-weight="700">Output: Only positive half-cycle passes.</text>
    <text x="20" y="215" fill="#94a3b8" font-size="15">VTC: Slope = 1 for v_i &gt; 0; Slope = 0 for v_i &lt; 0.</text>
  </g>

  <!-- Clipper C -->
  <g transform="translate(40, 350)">
    <rect x="0" y="0" width="550" height="280" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="30" fill="#fbbf24" font-size="19" font-weight="800">C. Positive Shunt Clipper with (+) Bias V_R</text>
    <text x="20" y="60" fill="#e2e8f0" font-size="16">• Diode cathode connected to +V_R battery.</text>
    <text x="20" y="90" fill="#38bdf8" font-size="17" font-weight="700">Transition: V_trans = +V_R</text>
    <text x="20" y="120" fill="#e2e8f0" font-size="16">• For v_i &gt; V_R: Diode ON ⇒ v_o = V_R (Clipped!)</text>
    <text x="20" y="150" fill="#e2e8f0" font-size="16">• For v_i &lt; V_R: Diode OFF ⇒ v_o = v_i (Passed!)</text>
    <text x="20" y="185" fill="#34d399" font-size="16" font-weight="700">Output: Signal clipped at +V_R level.</text>
    <text x="20" y="215" fill="#94a3b8" font-size="15">If diode practical (V_γ = 0.7V): clips at (V_R + 0.7V).</text>
  </g>

  <!-- Clipper D -->
  <g transform="translate(620, 350)">
    <rect x="0" y="0" width="550" height="280" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="30" fill="#c084fc" font-size="19" font-weight="800">D. Negative Shunt Clipper with (-) Bias -V_R</text>
    <text x="20" y="60" fill="#e2e8f0" font-size="16">• Diode anode connected to -V_R battery.</text>
    <text x="20" y="90" fill="#38bdf8" font-size="17" font-weight="700">Transition: V_trans = -V_R</text>
    <text x="20" y="120" fill="#e2e8f0" font-size="16">• For v_i &gt; -V_R: Diode OFF ⇒ v_o = v_i (Passed!)</text>
    <text x="20" y="150" fill="#e2e8f0" font-size="16">• For v_i &lt; -V_R: Diode ON ⇒ v_o = -V_R (Clipped!)</text>
    <text x="20" y="185" fill="#34d399" font-size="16" font-weight="700">Output: Signal clipped at -V_R level.</text>
    <text x="20" y="215" fill="#94a3b8" font-size="15">If diode practical: clips at (-V_R - 0.7V).</text>
  </g>
</g>

<!-- Column 3: Two-Level Combinational Clippers &amp; Slicers -->
<g transform="translate(2500, 0)">
  <rect x="0" y="0" width="1220" height="660" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#cardGlow)"/>
  <rect x="0" y="0" width="10" height="660" rx="5" fill="#fbbf24"/>
  <text x="30" y="45" fill="#fbbf24" font-size="26" font-weight="800">3. Two-Level Combinational Clippers (Slicers)</text>
  <text x="30" y="85" fill="#e2e8f0" font-size="19">• Topology: Two anti-parallel diode branches with opposing bias sources (+V_R1 and -V_R2).</text>
  <text x="30" y="125" fill="#38bdf8" font-size="22" font-weight="800">Double Transition Boundaries: V_trans1 = +V_R1   and   V_trans2 = -V_R2</text>

  <g transform="translate(40, 160)">
    <rect x="0" y="0" width="1140" height="240" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="30" y="40" fill="#34d399" font-size="20" font-weight="800">THREE DISTINCT OPERATING REGIMES:</text>
    <text x="50" y="80" fill="#f43f5e" font-size="19" font-weight="700">1. Upper Clipping: When v_i ≥ +V_R1</text>
    <text x="70" y="110" fill="#e2e8f0" font-size="18">D₁ turns ON, D₂ is OFF ⇒ Output is clamped firmly at: v_o = +V_R1</text>
    
    <text x="50" y="150" fill="#34d399" font-size="19" font-weight="700">2. Linear Transmission Window: When -V_R2 &lt; v_i &lt; +V_R1</text>
    <text x="70" y="180" fill="#e2e8f0" font-size="18">BOTH D₁ and D₂ are OFF! No current drawn ⇒ Output tracks input: v_o = v_i  (Slope = 1)</text>

    <text x="50" y="220" fill="#38bdf8" font-size="19" font-weight="700">3. Lower Clipping: When v_i ≤ -V_R2</text>
    <text x="70" y="250" fill="#e2e8f0" font-size="18">D₂ turns ON, D₁ is OFF ⇒ Output is clamped firmly at: v_o = -V_R2</text>
  </g>

  <text x="40" y="445" fill="#c084fc" font-size="22" font-weight="800">B. Back-to-Back Zener Diode Clipper (Square-Wave Shaper):</text>
  <text x="40" y="485" fill="#e2e8f0" font-size="18">• Two identical Zener diodes Z₁, Z₂ placed in series opposing across load.</text>
  <text x="40" y="520" fill="#34d399" font-size="19" font-weight="700">  On positive half: Z₁ is reverse breakdown (V_Z), Z₂ is forward-biased (0.7V) ⇒ v_o = +(V_Z + 0.7V).</text>
  <text x="40" y="555" fill="#34d399" font-size="19" font-weight="700">  On negative half: Z₂ is reverse breakdown (V_Z), Z₁ is forward-biased (0.7V) ⇒ v_o = -(V_Z + 0.7V).</text>
  <text x="40" y="595" fill="#fbbf24" font-size="18">Converts ANY arbitrary high-voltage sine wave or triangular wave into a pristine symmetrical SQUARE WAVE!</text>
</g>

<!-- Bottom Full Row: Comprehensive VTC Curves &amp; Transfer Slope Mechanics -->
<g transform="translate(0, 690)">
  <rect x="0" y="0" width="3720" height="670" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#cardGlow)"/>
  <rect x="0" y="0" width="10" height="670" rx="5" fill="#c084fc"/>
  <text x="30" y="45" fill="#c084fc" font-size="28" font-weight="800">4. Master Voltage Transfer Characteristics (VTC) Curves &amp; Non-Ideal Slopes</text>

  <!-- 4 VTC Graphs plotted side-by-side -->
  <!-- VTC 1: Positive Clipper -->
  <g transform="translate(80, 90)">
    <rect x="0" y="0" width="800" height="340" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="35" fill="#38bdf8" font-size="20" font-weight="800">VTC: Positive Shunt Clipper (+V_R)</text>
    <line x1="50" y1="200" x2="400" y2="200" stroke="#64748b" stroke-width="2"/>
    <line x1="200" y1="310" x2="200" y2="50" stroke="#64748b" stroke-width="2"/>
    <text x="410" y="205" fill="#94a3b8" font-size="16">v_i</text>
    <text x="200" y="40" fill="#94a3b8" font-size="16">v_o</text>
    <!-- Curve: linear for vi < VR, flat at VR for vi > VR -->
    <line x1="60" y1="340" x2="280" y2="120" stroke="#34d399" stroke-width="3"/>
    <line x1="280" y1="120" x2="400" y2="120" stroke="#f43f5e" stroke-width="3.5"/>
    <circle cx="280" cy="120" r="6" fill="#fbbf24"/>
    <text x="290" y="110" fill="#fbbf24" font-size="16">V_trans = V_R</text>
    <text x="130" y="250" fill="#34d399" font-size="16">Slope = 1</text>
    <text x="320" y="150" fill="#f43f5e" font-size="16">Slope = 0</text>
  </g>

  <!-- VTC 2: Negative Clipper -->
  <g transform="translate(980, 90)">
    <rect x="0" y="0" width="800" height="340" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="35" fill="#34d399" font-size="20" font-weight="800">VTC: Negative Shunt Clipper (-V_R)</text>
    <line x1="50" y1="200" x2="400" y2="200" stroke="#64748b" stroke-width="2"/>
    <line x1="200" y1="310" x2="200" y2="50" stroke="#64748b" stroke-width="2"/>
    <text x="410" y="205" fill="#94a3b8" font-size="16">v_i</text>
    <text x="200" y="40" fill="#94a3b8" font-size="16">v_o</text>
    <line x1="50" y1="260" x2="140" y2="260" stroke="#f43f5e" stroke-width="3.5"/>
    <line x1="140" y1="260" x2="360" y2="40" stroke="#34d399" stroke-width="3"/>
    <circle cx="140" cy="260" r="6" fill="#fbbf24"/>
    <text x="80" y="290" fill="#fbbf24" font-size="16">V_trans = -V_R</text>
    <text x="60" y="245" fill="#f43f5e" font-size="16">Slope = 0</text>
    <text x="270" y="130" fill="#34d399" font-size="16">Slope = 1</text>
  </g>

  <!-- VTC 3: Two-Level Clipper -->
  <g transform="translate(1880, 90)">
    <rect x="0" y="0" width="850" height="340" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="35" fill="#fbbf24" font-size="20" font-weight="800">VTC: Two-Level Combinational Slicer</text>
    <line x1="50" y1="200" x2="420" y2="200" stroke="#64748b" stroke-width="2"/>
    <line x1="220" y1="310" x2="220" y2="50" stroke="#64748b" stroke-width="2"/>
    <text x="430" y="205" fill="#94a3b8" font-size="16">v_i</text>
    <text x="220" y="40" fill="#94a3b8" font-size="16">v_o</text>
    <line x1="50" y1="260" x2="160" y2="260" stroke="#f43f5e" stroke-width="3.5"/>
    <line x1="160" y1="260" x2="300" y2="120" stroke="#34d399" stroke-width="3"/>
    <line x1="300" y1="120" x2="420" y2="120" stroke="#f43f5e" stroke-width="3.5"/>
    <text x="320" y="110" fill="#38bdf8" font-size="16">+V_R1</text>
    <text x="80" y="290" fill="#38bdf8" font-size="16">-V_R2</text>
    <text x="230" y="170" fill="#34d399" font-size="16">Slope = 1</text>
  </g>

  <!-- VTC 4: Non-Ideal Diode Forward Resistance -->
  <g transform="translate(2810, 90)">
    <rect x="0" y="0" width="850" height="340" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="35" fill="#c084fc" font-size="20" font-weight="800">Impact of Diode Bulk Resistance (r_f)</text>
    <text x="20" y="70" fill="#e2e8f0" font-size="17">• In practical circuits, diode forward resistance r_f &gt; 0.</text>
    <text x="20" y="105" fill="#e2e8f0" font-size="17">• When diode conducts, output is NOT strictly flat!</text>
    <text x="40" y="150" fill="#fbbf24" font-size="19" font-weight="800">Clipped Slope: m = r_f / (R + r_f) &gt; 0</text>
    <text x="20" y="195" fill="#e2e8f0" font-size="17">• Voltage Divider Effect: High series R makes m → 0 (ideal sharp clipping).</text>
    <text x="20" y="235" fill="#f43f5e" font-size="17" font-weight="700">★ Exam Trap: If R is small (comparable to r_f), clipped region has notable upward slope!</text>
    <text x="20" y="280" fill="#34d399" font-size="17">• Cut-in voltage V_γ shifts break points by 0.7 V.</text>
  </g>

  <g transform="translate(80, 460)">
    <rect x="0" y="0" width="3580" height="170" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="30" y="38" fill="#38bdf8" font-size="22" font-weight="800">★ GOLDEN TEST FOR IDENTIFYING CLIPPED PORTIONS UNDER EXAM PRESSURE:</text>
    <text x="50" y="75" fill="#e2e8f0" font-size="19">1. <tspan fill="#fbbf24" font-weight="700">Diode Points TOWARDS Output Node:</tspan> Conduction occurs when v_i drops LOW ⇒ Clips the NEGATIVE portion!</text>
    <text x="50" y="110" fill="#e2e8f0" font-size="19">2. <tspan fill="#34d399" font-weight="700">Diode Points AWAY FROM Output Node:</tspan> Conduction occurs when v_i rises HIGH ⇒ Clips the POSITIVE portion!</text>
    <text x="50" y="145" fill="#e2e8f0" font-size="19">3. <tspan fill="#c084fc" font-weight="700">Battery Polarity:</tspan> Battery in series with diode shifts the transition clipping threshold: positive terminal on cathode elevates clipping level to +V_R.</text>
  </g>
</g>

  </g>

  <!-- Bottom Blueprint Metadata Footer -->
  <g transform="translate(60, 2070)">
    <line x1="0" y1="0" x2="3720" y2="0" stroke="#334155" stroke-width="1.5"/>
    <text x="10" y="32" fill="#64748b" font-size="16" font-weight="600">ANALOG ELECTRONICS MASTER BLUEPRINT ENGINE • VERIFIED ACROSS 422 LECTURE SLIDES • ZERO-OMISSION TITAN SPECIFICATION</text>
    <text x="3710" y="32" fill="#64748b" font-size="16" font-weight="600" text-anchor="end">PREPFUSION &amp; RAHUL SIR COMPREHENSIVE LECTURE SERIES ARCHITECTURE</text>
  </g>
</svg>