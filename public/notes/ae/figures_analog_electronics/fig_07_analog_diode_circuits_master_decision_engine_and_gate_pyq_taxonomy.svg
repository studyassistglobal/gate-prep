<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160" style="background:#0a0f1d; font-family:'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Background Grid -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="3840" height="2160" fill="#0a0f1d"/>
  <rect width="3840" height="2160" fill="url(#grid)"/>

  <!-- Outer Blueprint Border -->
  <rect x="30" y="30" width="3780" height="2100" rx="16" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.8"/>
  <rect x="42" y="42" width="3756" height="2076" rx="10" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top Header Banner -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="3720" height="120" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#cardGlow)"/>
    <rect x="0" y="0" width="12" height="120" rx="6" fill="url(#headerGrad)"/>
    
    <!-- Title & Subtitle -->
    <text x="40" y="52" fill="url(#headerGrad)" font-size="38" font-weight="900" letter-spacing="1.5">ANALOG DIODE CIRCUITS MASTER DECISION ENGINE &amp; GATE PYQ TAXONOMY</text>
    <text x="40" y="94" fill="#94a3b8" font-size="22" font-weight="500">Rapid 60-Second 4-Track Exam Decision Tree, 25 Fatal Exam Traps &amp; High-Yield Canonical Flash Formulas</text>
    
    <!-- Badges -->
    <rect x="3100" y="32" width="260" height="56" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="3230" y="68" fill="#38bdf8" font-size="20" font-weight="800" text-anchor="middle">GATE 2027 TITAN SUITE</text>
    <rect x="3400" y="32" width="280" height="56" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="3540" y="68" fill="#fbbf24" font-size="20" font-weight="800" text-anchor="middle">FIGURE 7 • 4K VECTOR</text>
  </g>

  <!-- Content Canvas -->
  <g transform="translate(60, 200)">
    
<!-- Column 1: Rapid 60-Second 4-Track Exam Decision Tree -->
<g transform="translate(0, 0)">
  <rect x="0" y="0" width="1820" height="1360" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#cardGlow)"/>
  <rect x="0" y="0" width="10" height="1360" rx="5" fill="#38bdf8"/>
  <text x="30" y="45" fill="#38bdf8" font-size="28" font-weight="800">1. Rapid 60-Second 4-Track Exam Decision Tree</text>

  <!-- Track A: DC Assumed States -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="1740" height="280" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="30" y="40" fill="#38bdf8" font-size="22" font-weight="800">TRACK A: DC DIODE NETWORKS &amp; ASSUMED STATES</text>
    <text x="30" y="75" fill="#e2e8f0" font-size="18">• Node inspection: Which anode is at highest potential? Which cathode is at lowest?</text>
    <text x="30" y="110" fill="#34d399" font-size="19" font-weight="700">1. Assume ON: Replace with short circuit (or 0.7 V battery). Solve for branch current I_D.</text>
    <text x="60" y="145" fill="#e2e8f0" font-size="18">✓ Valid if I_D &gt; 0   |   ✗ If I_D &lt; 0, Assumption is FALSE → diode is OFF!</text>
    <text x="30" y="185" fill="#fbbf24" font-size="19" font-weight="700">2. Assume OFF: Replace with open circuit. Solve for anode-to-cathode voltage V_D = V_A - V_K.</text>
    <text x="60" y="220" fill="#e2e8f0" font-size="18">✓ Valid if V_D &lt; 0 (ideal) or V_D &lt; 0.7 V   |   ✗ If V_D &gt; 0.7 V, Assumption is FALSE → diode is ON!</text>
    <text x="30" y="260" fill="#c084fc" font-size="17">Parallel Diodes: Lower cut-in voltage conducts first and clamps node, keeping higher cut-in diode OFF.</text>
  </g>

  <!-- Track B: Small Signal &amp; Zener -->
  <g transform="translate(40, 380)">
    <rect x="0" y="0" width="1740" height="280" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="30" y="40" fill="#34d399" font-size="22" font-weight="800">TRACK B: SMALL-SIGNAL AC &amp; ZENER VOLTAGE REGULATION</text>
    <text x="30" y="75" fill="#e2e8f0" font-size="18">• Small Signal Diode: Solve DC bias current I_DQ first. Then r_d = η V_T / I_DQ. Deactivate DC supplies for AC analysis.</text>
    <text x="30" y="115" fill="#38bdf8" font-size="19" font-weight="700">Zener Thevenin Test: Temporarily disconnect Zener. Calculate V_Th = V_in · [R_L / (R_s + R_L)].</text>
    <text x="60" y="150" fill="#34d399" font-size="18" font-weight="700">✓ If V_Th ≥ V_Z: Zener in breakdown ⇒ V_o = V_Z. I_s = (V_in - V_Z) / R_s; I_L = V_Z / R_L; I_Z = I_s - I_L.</text>
    <text x="60" y="185" fill="#f43f5e" font-size="18" font-weight="700">✗ If V_Th &lt; V_Z: Zener OFF (I_Z = 0) ⇒ Regulation FAILS! Output is unregulated: V_o = V_Th &lt; V_Z.</text>
    <text x="30" y="225" fill="#fbbf24" font-size="19" font-weight="700">Series Resistor Sizing Bounds: R_s,min = (V_in,max - V_Z)/(I_Z,max + I_L,min)   and   R_s,max = (V_in,min - V_Z)/(I_Z,min + I_L,max).</text>
    <text x="30" y="260" fill="#94a3b8" font-size="17">Zener power limit: P_Z = V_Z · I_Z ≤ P_Z,max.</text>
  </g>

  <!-- Track C: Rectifiers &amp; Filters -->
  <g transform="translate(40, 685)">
    <rect x="0" y="0" width="1740" height="280" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="30" y="40" fill="#fbbf24" font-size="22" font-weight="800">TRACK C: RECTIFIERS &amp; SMOOTHING FILTERS</text>
    <text x="30" y="75" fill="#e2e8f0" font-size="18">• Topology Identification: 1 Diode (HWR: V_dc = V_m/π, r = 1.21) vs 2 Diodes (CT: V_dc = 2V_m/π, PIV = 2V_m, r = 0.482) vs 4 Diodes (Bridge: V_dc = 2V_m/π, PIV = V_m, r = 0.482).</text>
    <text x="30" y="115" fill="#34d399" font-size="19" font-weight="700">Filter Selection &amp; Ripple Calculations:</text>
    <text x="60" y="150" fill="#e2e8f0" font-size="18">• Shunt C: r = 1 / (4√3 f R_L C)   |   V_dc = V_m - I_dc / (4 f C)   |   V_r(p-p) = I_dc / (2 f C)</text>
    <text x="60" y="185" fill="#e2e8f0" font-size="18">• Series L: r = R_L / (3√2 ω L)   (Best for heavy current loads!)</text>
    <text x="60" y="220" fill="#38bdf8" font-size="18">• Choke LC: r = √2 / (12 ω² L C)   (Load independent!)   |   Critical Inductance: L_c = R_L / (3ω)</text>
    <text x="30" y="260" fill="#c084fc" font-size="17">Bleeder Resistor: R_B ≤ 3 ω L maintains continuous conduction under no-load.</text>
  </g>

  <!-- Track D: Clippers &amp; Clampers -->
  <g transform="translate(40, 990)">
    <rect x="0" y="0" width="1740" height="320" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="30" y="40" fill="#c084fc" font-size="22" font-weight="800">TRACK D: CLIPPERS &amp; CLAMPERS</text>
    <text x="30" y="75" fill="#e2e8f0" font-size="18">• Quick Discrimination: Does circuit contain a capacitor in series with input? YES → Clamper. NO → Clipper.</text>
    <text x="30" y="115" fill="#38bdf8" font-size="19" font-weight="700">Clipper Strategy: Find break-voltage V_trans where V_A = V_K. Test v_i &gt; V_trans and v_i &lt; V_trans.</text>
    <text x="60" y="150" fill="#e2e8f0" font-size="18">Diode cathode towards ground: Clips positive. Diode anode towards ground: Clips negative.</text>
    <text x="30" y="190" fill="#34d399" font-size="19" font-weight="700">Clamper Strategy: Clamping Theorem: V_o(p-p) = V_i(p-p) (Shape and swing PRESERVED!).</text>
    <text x="60" y="225" fill="#e2e8f0" font-size="18">Locate half-cycle that forward-biases diode → Calculate V_C → Write v_o(t) = v_i(t) ± V_C.</text>
    <text x="60" y="260" fill="#fbbf24" font-size="18">Voltage Multipliers: N-stage Cockcroft-Walton ladder produces V_o = N · V_m; every diode PIV = 2 V_m.</text>
  </g>
</g>

<!-- Column 2: 25 Dangerous Exam Traps &amp; Flash Formulas -->
<g transform="translate(1860, 0)">
  <rect x="0" y="0" width="1860" height="1360" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#cardGlow)"/>
  <rect x="0" y="0" width="10" height="1360" rx="5" fill="#fbbf24"/>
  <text x="30" y="45" fill="#fbbf24" font-size="28" font-weight="800">2. Master Flash Formulas Matrix &amp; Key Traps</text>

  <!-- Table of Canonical Formulas -->
  <rect x="40" y="75" width="1780" height="55" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="70" y="110" fill="#38bdf8" font-size="20" font-weight="800">DOMAIN</text>
  <text x="400" y="110" fill="#38bdf8" font-size="20" font-weight="800">CANONICAL FORMULA</text>
  <text x="1100" y="110" fill="#38bdf8" font-size="20" font-weight="800">CONDITIONS / UNITS</text>
  <text x="1480" y="110" fill="#38bdf8" font-size="20" font-weight="800">HIGH-YIELD SIGNIFICANCE</text>

  <g transform="translate(40, 140)" font-size="18" fill="#e2e8f0">
    <text x="30" y="35" fill="#38bdf8" font-weight="700">Built-in Potential</text>
    <text x="360" y="35" fill="#34d399">V₀ = V_T · ln((N_A N_D) / n_i²)</text>
    <text x="1060" y="35">V_T = k T / q ≈ 26 mV</text>
    <text x="1440" y="35" fill="#94a3b8">0.7V for Si, 0.3V for Ge</text>
    <line x1="0" y1="50" x2="1780" y2="50" stroke="#1e293b" stroke-width="1"/>

    <text x="30" y="85" fill="#38bdf8" font-weight="700">Shockley Equation</text>
    <text x="360" y="85" fill="#34d399">I_D = I_s · [exp(V_D / η V_T) - 1]</text>
    <text x="1060" y="85">I_s doubles / 10°C in Si</text>
    <text x="1440" y="85" fill="#fbbf24">ΔV_D = 60 mV for 10× current</text>
    <line x1="0" y1="100" x2="1780" y2="100" stroke="#1e293b" stroke-width="1"/>

    <text x="30" y="135" fill="#38bdf8" font-weight="700">Dynamic AC Resistance</text>
    <text x="360" y="135" fill="#34d399">r_d = η V_T / I_DQ ≈ 26 mV / I_DQ</text>
    <text x="1060" y="135">At Q-point DC current</text>
    <text x="1440" y="135" fill="#94a3b8">Inversely proportional to I_DQ</text>
    <line x1="0" y1="150" x2="1780" y2="150" stroke="#1e293b" stroke-width="1"/>

    <text x="30" y="185" fill="#38bdf8" font-weight="700">HWR DC &amp; RMS</text>
    <text x="360" y="185" fill="#34d399">V_dc = V_m / π  |  V_rms = V_m / 2</text>
    <text x="1060" y="185">FF = 1.57, r = 1.21</text>
    <text x="1440" y="185" fill="#f43f5e">η_max = 40.6%, TUF = 0.287</text>
    <line x1="0" y1="200" x2="1780" y2="200" stroke="#1e293b" stroke-width="1"/>

    <text x="30" y="235" fill="#38bdf8" font-weight="700">FWR DC &amp; RMS</text>
    <text x="360" y="235" fill="#34d399">V_dc = 2 V_m / π  |  V_rms = V_m / √2</text>
    <text x="1060" y="235">FF = 1.11, r = 0.482</text>
    <text x="1440" y="235" fill="#34d399">η_max = 81.2%, TUF_bridge = 0.812</text>
    <line x1="0" y1="250" x2="1780" y2="250" stroke="#1e293b" stroke-width="1"/>

    <text x="30" y="285" fill="#38bdf8" font-weight="700">Center-Tap vs Bridge PIV</text>
    <text x="360" y="285" fill="#f43f5e">PIV_CT = 2 V_m   vs   PIV_bridge = V_m</text>
    <text x="1060" y="285">Peak inverse diode stress</text>
    <text x="1440" y="285" fill="#fbbf24">Bridge cuts PIV stress by 50%!</text>
    <line x1="0" y1="300" x2="1780" y2="300" stroke="#1e293b" stroke-width="1"/>

    <text x="30" y="335" fill="#38bdf8" font-weight="700">Capacitor Filter Ripple</text>
    <text x="360" y="335" fill="#34d399">r = 1 / (4√3 f R_L C) = I_dc / (4√3 f C V_dc)</text>
    <text x="1060" y="335">For FWR; HWR is 2×</text>
    <text x="1440" y="335" fill="#38bdf8">V_r(p-p) = I_dc / (2 f C)</text>
    <line x1="0" y1="350" x2="1780" y2="350" stroke="#1e293b" stroke-width="1"/>

    <text x="30" y="385" fill="#38bdf8" font-weight="700">Choke LC Filter Ripple</text>
    <text x="360" y="385" fill="#34d399">r = √2 / (12 ω² L C) ≈ 1.194 / (L C)</text>
    <text x="1060" y="385">Independent of load R_L</text>
    <text x="1440" y="385" fill="#34d399">L_c = R_L / (3ω) for continuity</text>
    <line x1="0" y1="400" x2="1780" y2="400" stroke="#1e293b" stroke-width="1"/>

    <text x="30" y="435" fill="#38bdf8" font-weight="700">Zener Line Regulation</text>
    <text x="360" y="435" fill="#34d399">V_in,min = V_Z + (I_Z,min + I_L) · R_s</text>
    <text x="1060" y="435">Fixed R_L, varying V_in</text>
    <text x="1440" y="435" fill="#fbbf24">Maintains I_Z ≥ I_Z,min</text>
    <line x1="0" y1="450" x2="1780" y2="450" stroke="#1e293b" stroke-width="1"/>

    <text x="30" y="485" fill="#38bdf8" font-weight="700">Zener Load Regulation</text>
    <text x="360" y="485" fill="#34d399">R_L,min = V_Z / [ (V_in - V_Z)/R_s - I_Z,min ]</text>
    <text x="1060" y="485">Fixed V_in, varying R_L</text>
    <text x="1440" y="485" fill="#38bdf8">Prevents Zener starvation</text>
    <line x1="0" y1="500" x2="1780" y2="500" stroke="#1e293b" stroke-width="1"/>

    <text x="30" y="535" fill="#38bdf8" font-weight="700">Clamping Theorem</text>
    <text x="360" y="535" fill="#34d399">V_o(p-p) = V_i(p-p)</text>
    <text x="1060" y="535">R_L C &gt;&gt; 10 T</text>
    <text x="1440" y="535" fill="#c084fc">Strict swing preservation</text>
  </g>

  <!-- Exam Traps Highlight Box -->
  <g transform="translate(40, 750)">
    <rect x="0" y="0" width="1780" height="420" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="30" y="40" fill="#f43f5e" font-size="22" font-weight="800">TOP 5 FATAL EXAM TRAPS IN ANALOG DIODE CIRCUITS:</text>
    
    <text x="50" y="85" fill="#fbbf24" font-size="19" font-weight="700">Trap A: Assuming Diode is ON Because Anode has Positive Potential</text>
    <text x="70" y="115" fill="#e2e8f0" font-size="17">A positive anode potential (+5V) will NOT turn diode ON if cathode is at higher positive potential (+10V)! V_D = V_A - V_K = -5V (Reverse Biased!).</text>

    <text x="50" y="160" fill="#fbbf24" font-size="19" font-weight="700">Trap B: Confusing PIV of Center-Tapped and Bridge Rectifiers</text>
    <text x="70" y="190" fill="#e2e8f0" font-size="17">Many students write PIV = V_m for Center-Tapped. IT IS 2 V_m! Only Bridge rectifier achieves PIV = V_m.</text>

    <text x="50" y="235" fill="#fbbf24" font-size="19" font-weight="700">Trap C: Inverse Load Behavior of Capacitor vs Inductor Filters</text>
    <text x="70" y="265" fill="#e2e8f0" font-size="17">Capacitor filter ripple INCREASES as load current increases; Inductor filter ripple DECREASES as load current increases!</text>

    <text x="50" y="310" fill="#fbbf24" font-size="19" font-weight="700">Trap D: Calculating Zener Output When Circuit is Out of Regulation</text>
    <text x="70" y="340" fill="#e2e8f0" font-size="17">If V_Th &lt; V_Z, output voltage is NOT V_Z! Output drops to the unregulated voltage divider value V_Th.</text>

    <text x="50" y="385" fill="#fbbf24" font-size="19" font-weight="700">Trap E: Forgetting that Clampers Preserve Peak-to-Peak Amplitude</text>
    <text x="70" y="415" fill="#e2e8f0" font-size="17">Any calculation where V_o(p-p) ≠ V_i(p-p) in an ideal clamper indicates a fatal algebraic blunder!</text>
  </g>
</g>

  </g>

  <!-- Bottom Blueprint Metadata Footer -->
  <g transform="translate(60, 2070)">
    <line x1="0" y1="0" x2="3720" y2="0" stroke="#334155" stroke-width="1.5"/>
    <text x="10" y="32" fill="#64748b" font-size="16" font-weight="600">ANALOG ELECTRONICS MASTER BLUEPRINT ENGINE • VERIFIED ACROSS 422 LECTURE SLIDES • ZERO-OMISSION TITAN SPECIFICATION</text>
    <text x="3710" y="32" fill="#64748b" font-size="16" font-weight="600" text-anchor="end">PREPFUSION &amp; RAHUL SIR COMPREHENSIVE LECTURE SERIES ARCHITECTURE</text>
  </g>
</svg>