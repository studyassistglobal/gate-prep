<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160" style="background:#0a0f1d; font-family:'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Background Grid -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="3840" height="2160" fill="#0a0f1d"/>
  <rect width="3840" height="2160" fill="url(#grid)"/>

  <!-- Outer Blueprint Border -->
  <rect x="30" y="30" width="3780" height="2100" rx="16" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.8"/>
  <rect x="42" y="42" width="3756" height="2076" rx="10" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top Header Banner -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="3720" height="120" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#cardGlow)"/>
    <rect x="0" y="0" width="12" height="120" rx="6" fill="url(#headerGrad)"/>
    
    <!-- Title & Subtitle -->
    <text x="40" y="52" fill="url(#headerGrad)" font-size="38" font-weight="900" letter-spacing="1.5">SMOOTHING FILTERS &amp; HARMONIC ATTENUATION ENGINE</text>
    <text x="40" y="94" fill="#94a3b8" font-size="22" font-weight="500">Capacitive, Inductive, Choke-Input LC &amp; CLC Pi-Filters: Mathematical Derivations &amp; Ripple Matrices</text>
    
    <!-- Badges -->
    <rect x="3100" y="32" width="260" height="56" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="3230" y="68" fill="#38bdf8" font-size="20" font-weight="800" text-anchor="middle">GATE 2027 TITAN SUITE</text>
    <rect x="3400" y="32" width="280" height="56" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="3540" y="68" fill="#fbbf24" font-size="20" font-weight="800" text-anchor="middle">FIGURE 4 • 4K VECTOR</text>
  </g>

  <!-- Content Canvas -->
  <g transform="translate(60, 200)">
    
<!-- Column 1: Shunt Capacitor Filter (C-Filter) -->
<g transform="translate(0, 0)">
  <rect x="0" y="0" width="890" height="660" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#cardGlow)"/>
  <rect x="0" y="0" width="10" height="660" rx="5" fill="#38bdf8"/>
  <text x="30" y="45" fill="#38bdf8" font-size="26" font-weight="800">1. Shunt Capacitor Filter (C-Filter)</text>
  <text x="30" y="85" fill="#e2e8f0" font-size="19">• Operation: Capacitor C in parallel with load R_L charges to peak V_m and slowly discharges via R_L.</text>
  <text x="30" y="125" fill="#34d399" font-size="20" font-weight="700">  Holding Condition: R_L · C &gt;&gt; T / 2  (Discharge time constant much larger than half-period).</text>
  
  <text x="30" y="170" fill="#fbbf24" font-size="22" font-weight="800">A. Peak-to-Peak Ripple Voltage (V_r):</text>
  <text x="50" y="210" fill="#38bdf8" font-size="24" font-weight="800">  V_r(p-p) = V_m / (2 f R_L C) = I_dc / (2 f C)   [for FWR]</text>
  <text x="50" y="245" fill="#94a3b8" font-size="17">  (For HWR: V_r(p-p) = V_m / (f R_L C) = I_dc / (f C) — DOUBLED ripple!)</text>

  <text x="30" y="290" fill="#34d399" font-size="22" font-weight="800">B. DC Output Voltage (V_dc):</text>
  <text x="50" y="330" fill="#34d399" font-size="22" font-weight="800">  V_dc = V_m - (V_r / 2) = V_m - [ I_dc / (4 f C) ]</text>

  <text x="30" y="375" fill="#c084fc" font-size="22" font-weight="800">C. Ripple Factor Formula (Approximating saw-tooth as triangular):</text>
  <text x="50" y="415" fill="#c084fc" font-size="24" font-weight="800">  r = 1 / (4 √3 · f · R_L · C)   [for FWR]</text>
  <text x="50" y="450" fill="#94a3b8" font-size="17">  r = 1 / (2 √3 · f · R_L · C)   [for HWR]</text>

  <text x="30" y="495" fill="#f43f5e" font-size="20" font-weight="700">D. Diode Conduction Angle &amp; Surge Spikes:</text>
  <text x="50" y="530" fill="#e2e8f0" font-size="18">• Diode conducts ONLY during brief recharging pulse Δt:  ω Δt = √(2 V_r / V_m) &lt;&lt; π.</text>
  <text x="50" y="565" fill="#f43f5e" font-size="19" font-weight="700">• Peak Repetitive Diode Current: I_peak = I_dc · [ 1 + π √(2 V_m / V_r) ] &gt;&gt; I_dc!</text>
  <text x="50" y="600" fill="#94a3b8" font-size="17">• Cold-start surge current I_surge = V_m / (R_s + r_f) can burn out diode unless protected.</text>
  <text x="30" y="635" fill="#fbbf24" font-size="16">★ Load Sensitivity: As load current INCREASES (R_L decreases), ripple GROWS and V_dc DROPS!</text>
</g>

<!-- Column 2: Series Inductor Filter (L-Filter) -->
<g transform="translate(930, 0)">
  <rect x="0" y="0" width="890" height="660" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#cardGlow)"/>
  <rect x="0" y="0" width="10" height="660" rx="5" fill="#34d399"/>
  <text x="30" y="45" fill="#34d399" font-size="26" font-weight="800">2. Series Inductor Filter (L-Filter)</text>
  <text x="30" y="85" fill="#e2e8f0" font-size="19">• Operation: Inductor L in series with load opposes AC ripple current by high reactance X_L = 2ω L.</text>
  <text x="30" y="125" fill="#94a3b8" font-size="18">Presents zero impedance to DC (neglecting winding resistance R_w).</text>

  <text x="30" y="170" fill="#38bdf8" font-size="22" font-weight="800">A. DC Output Voltage:</text>
  <text x="50" y="210" fill="#38bdf8" font-size="22" font-weight="800">  V_dc = (2 V_m / π) - I_dc · R_w ≈ 2 V_m / π</text>

  <text x="30" y="255" fill="#fbbf24" font-size="22" font-weight="800">B. Dominant Harmonic Attenuation (2ω):</text>
  <text x="50" y="290" fill="#e2e8f0" font-size="18">AC voltage across load from second harmonic divider:</text>
  <text x="50" y="330" fill="#34d399" font-size="22" font-weight="800">  V_2rms = [ (4 V_m) / (3 √2 π) ] · [ R_L / √(R_L² + 4ω² L²) ]</text>

  <text x="30" y="380" fill="#c084fc" font-size="22" font-weight="800">C. Ripple Factor Formula (for 2ω L &gt;&gt; R_L):</text>
  <text x="50" y="420" fill="#c084fc" font-size="24" font-weight="800">  r = R_L / (3 √2 · ω · L)   =   V_dc / (3 √2 · ω · L · I_dc)</text>

  <text x="30" y="475" fill="#fbbf24" font-size="22" font-weight="800">★ OPPOSITE BEHAVIOR TO C-FILTER:</text>
  <text x="50" y="515" fill="#34d399" font-size="20" font-weight="700">In L-Filter, ripple factor is PROPORTIONAL to R_L!</text>
  <text x="50" y="550" fill="#e2e8f0" font-size="18">• As load current I_dc INCREASES (R_L decreases), ripple factor DECREASES (filtering IMPROVES!).</text>
  <text x="50" y="590" fill="#e2e8f0" font-size="18">• Ideal for HEAVY LOAD (high current) power supplies!</text>
  <text x="50" y="625" fill="#f43f5e" font-size="17" font-weight="700">✗ At light load (R_L → ∞), L-filter fails completely (r → ∞).</text>
</g>

<!-- Column 3: Choke-Input LC Filter -->
<g transform="translate(1860, 0)">
  <rect x="0" y="0" width="890" height="660" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#cardGlow)"/>
  <rect x="0" y="0" width="10" height="660" rx="5" fill="#fbbf24"/>
  <text x="30" y="45" fill="#fbbf24" font-size="26" font-weight="800">3. Choke-Input L-C Filter (L-Section)</text>
  <text x="30" y="85" fill="#e2e8f0" font-size="19">• Topology: Series inductor L followed by shunt capacitor C (Second-order low pass filter).</text>
  <text x="30" y="125" fill="#94a3b8" font-size="18">Combines heavy-load benefits of L with light-load benefits of C.</text>

  <text x="30" y="170" fill="#38bdf8" font-size="22" font-weight="800">A. Voltage Attenuation Ratio:</text>
  <text x="50" y="205" fill="#e2e8f0" font-size="18">Reactance condition: X_C &lt;&lt; R_L and X_C &lt;&lt; X_L at 2ω:</text>
  <text x="50" y="245" fill="#38bdf8" font-size="22" font-weight="800">  V_2ac(out) ≈ V_2ac(in) · [ X_C / X_L ] = V_2ac(in) / (4 ω² L C)</text>

  <text x="30" y="295" fill="#34d399" font-size="22" font-weight="800">B. Ripple Factor Formula (LOAD INDEPENDENT!):</text>
  <text x="50" y="340" fill="#34d399" font-size="24" font-weight="800">  r = √2 / (12 · ω² · L · C)   (Independent of R_L!)</text>
  <text x="50" y="375" fill="#94a3b8" font-size="17">At 50 Hz supply (ω = 100π rad/s):  r ≈ 1.194 / (L · C)  [L in H, C in µF]</text>

  <text x="30" y="425" fill="#f43f5e" font-size="20" font-weight="700">C. Critical Inductance (L_c) for Continuous Conduction:</text>
  <text x="50" y="460" fill="#e2e8f0" font-size="18">To prevent inductor current from dropping to zero, peak AC current must not exceed DC current:</text>
  <text x="70" y="505" fill="#f43f5e" font-size="22" font-weight="800">  I_2m ≤ I_dc   ⇒   L_c = R_L / (3 ω) ≈ R_L / 942   [at 50 Hz]</text>

  <text x="30" y="555" fill="#c084fc" font-size="20" font-weight="700">D. Bleeder Resistor (R_B) Function:</text>
  <text x="50" y="590" fill="#e2e8f0" font-size="18">• Connected permanently across output to guarantee minimum current: R_B ≤ 3 ω L.</text>
  <text x="50" y="625" fill="#fbbf24" font-size="17">Ensures continuous conduction even under NO LOAD, keeping V_dc clamped at 2V_m/π (not V_m).</text>
</g>

<!-- Column 4: CLC Pi-Filter &amp; Comparison -->
<g transform="translate(2790, 0)">
  <rect x="0" y="0" width="930" height="660" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#cardGlow)"/>
  <rect x="0" y="0" width="10" height="660" rx="5" fill="#c084fc"/>
  <text x="30" y="45" fill="#c084fc" font-size="26" font-weight="800">4. CLC / π-Filter Engine</text>
  <text x="30" y="85" fill="#e2e8f0" font-size="19">• Topology: Shunt C₁ + Series L + Shunt C₂ (Third-order low pass filter).</text>
  <text x="30" y="125" fill="#94a3b8" font-size="18">C₁ provides high peak DC voltage; L-C₂ provides heavy ripple attenuation.</text>

  <text x="30" y="170" fill="#38bdf8" font-size="22" font-weight="800">A. DC Output Voltage:</text>
  <text x="50" y="210" fill="#38bdf8" font-size="22" font-weight="800">  V_dc = V_m - [ I_dc / (4 f C₁) ] - I_dc · R_w</text>

  <text x="30" y="255" fill="#34d399" font-size="22" font-weight="800">B. Ripple Factor Formula:</text>
  <text x="50" y="300" fill="#34d399" font-size="24" font-weight="800">  r = √2 / (8 · ω³ · C₁ · C₂ · L · R_L)</text>
  <text x="50" y="340" fill="#94a3b8" font-size="17">At 50 Hz: r ≈ 5700 / (C₁ · C₂ · L · R_L)  [C in µF, L in H, R_L in Ω]</text>

  <text x="30" y="390" fill="#fbbf24" font-size="20" font-weight="700">C. Key Advantages &amp; Trade-Offs:</text>
  <text x="50" y="425" fill="#34d399" font-size="18">✓ Extremely LOW ripple factor (lowest among all passive filters!).</text>
  <text x="50" y="460" fill="#38bdf8" font-size="18">✓ High DC output voltage (near peak V_m at light loads).</text>
  <text x="50" y="495" fill="#f43f5e" font-size="18">✗ Poor voltage regulation (V_dc drops sharply as load current increases).</text>
  <text x="50" y="530" fill="#f43f5e" font-size="18">✗ High diode peak current spikes due to input capacitor C₁.</text>

  <text x="30" y="585" fill="#c084fc" font-size="20" font-weight="800">★ Modern Power Supply Practice:</text>
  <text x="30" y="620" fill="#e2e8f0" font-size="18">In linear DC supplies, a large C-filter feeds an active IC regulator (e.g. 7805), suppressing residual ripple by &gt; 60 dB.</text>
</g>

<!-- Bottom Full Row: Master Filter Comparison &amp; Waveform Schematics -->
<g transform="translate(0, 690)">
  <rect x="0" y="0" width="3720" height="670" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#cardGlow)"/>
  <rect x="0" y="0" width="10" height="670" rx="5" fill="#fbbf24"/>
  <text x="30" y="45" fill="#fbbf24" font-size="28" font-weight="800">5. Master Filter Comparison Matrix &amp; Operational Dynamics</text>

  <!-- Comparison Table -->
  <rect x="40" y="70" width="3640" height="55" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="70" y="105" fill="#38bdf8" font-size="20" font-weight="800">FILTER TYPE</text>
  <text x="600" y="105" fill="#38bdf8" font-size="20" font-weight="800">RIPPLE FACTOR (r) FORMULA</text>
  <text x="1400" y="105" fill="#38bdf8" font-size="20" font-weight="800">DEPENDENCE ON LOAD (R_L)</text>
  <text x="2100" y="105" fill="#38bdf8" font-size="20" font-weight="800">DC VOLTAGE (V_dc)</text>
  <text x="2750" y="105" fill="#38bdf8" font-size="20" font-weight="800">VOLTAGE REGULATION</text>
  <text x="3300" y="105" fill="#38bdf8" font-size="20" font-weight="800">BEST SUITED FOR</text>

  <g transform="translate(40, 135)" font-size="18" fill="#e2e8f0">
    <!-- Filter 1 -->
    <text x="30" y="40" fill="#38bdf8" font-weight="800">Shunt Capacitor (C)</text>
    <text x="560" y="40" fill="#fbbf24" font-weight="700">1 / (4√3 f R_L C)</text>
    <text x="1360" y="40" fill="#f43f5e">r ∝ 1 / R_L (Increases with load current)</text>
    <text x="2060" y="40">V_m - I_dc / (4 f C) ≈ V_m</text>
    <text x="2710" y="40" fill="#f43f5e">Poor</text>
    <text x="3260" y="40" fill="#34d399">Light loads (high R_L)</text>
    <line x1="0" y1="65" x2="3640" y2="65" stroke="#1e293b" stroke-width="1"/>

    <!-- Filter 2 -->
    <text x="30" y="105" fill="#34d399" font-weight="800">Series Inductor (L)</text>
    <text x="560" y="105" fill="#fbbf24" font-weight="700">R_L / (3√2 ω L)</text>
    <text x="1360" y="105" fill="#34d399">r ∝ R_L (Decreases with load current!)</text>
    <text x="2060" y="105">2 V_m / π</text>
    <text x="2710" y="105" fill="#fbbf24">Moderate</text>
    <text x="3260" y="105" fill="#34d399">Heavy loads (low R_L)</text>
    <line x1="0" y1="130" x2="3640" y2="130" stroke="#1e293b" stroke-width="1"/>

    <!-- Filter 3 -->
    <text x="30" y="170" fill="#fbbf24" font-weight="800">Choke-Input (L-C)</text>
    <text x="560" y="170" fill="#34d399" font-weight="800">√2 / (12 ω² L C)</text>
    <text x="1360" y="170" fill="#38bdf8" font-weight="700">INDEPENDENT of R_L (constant ripple!)</text>
    <text x="2060" y="170">2 V_m / π</text>
    <text x="2710" y="170" fill="#34d399" font-weight="700">Good (constant V_dc)</text>
    <text x="3260" y="170" fill="#38bdf8">Variable loads</text>
    <line x1="0" y1="195" x2="3640" y2="195" stroke="#1e293b" stroke-width="1"/>

    <!-- Filter 4 -->
    <text x="30" y="235" fill="#c084fc" font-weight="800">π-Filter (C-L-C)</text>
    <text x="560" y="235" fill="#34d399" font-weight="800">√2 / (8 ω³ C₁ C₂ L R_L)</text>
    <text x="1360" y="235" fill="#f43f5e">r ∝ 1 / R_L (Increases with load current)</text>
    <text x="2060" y="235">V_m - I_dc / (4 f C₁)</text>
    <text x="2710" y="235" fill="#f43f5e">Poor</text>
    <text x="3260" y="235" fill="#fbbf24">Low ripple light loads</text>
    <line x1="0" y1="260" x2="3640" y2="260" stroke="#1e293b" stroke-width="1"/>
  </g>

  <!-- Explanatory Rules Block -->
  <g transform="translate(40, 420)">
    <rect x="0" y="0" width="3640" height="210" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="30" y="40" fill="#fbbf24" font-size="22" font-weight="800">★ FOUR CRITICAL GATE EXAM RULES FOR FILTER CIRCUITS:</text>
    <text x="50" y="80" fill="#e2e8f0" font-size="19">1. <tspan fill="#38bdf8" font-weight="700">Capacitor Filter Behavior:</tspan> Adding a shunt capacitor RAISES average DC output voltage closer to V_m, but degrades diode peak current rating.</text>
    <text x="50" y="115" fill="#e2e8f0" font-size="19">2. <tspan fill="#34d399" font-weight="700">Inductor Filter Behavior:</tspan> Adding a series inductor DOES NOT change average DC voltage (remains 2V_m/π), but smooths current ripples continuously.</text>
    <text x="50" y="150" fill="#e2e8f0" font-size="19">3. <tspan fill="#fbbf24" font-weight="700">Critical Inductance Threshold:</tspan> If L &lt; L_c = R_L / (3ω), the LC filter acts like a simple capacitor filter and V_dc jumps up towards V_m!</text>
    <text x="50" y="185" fill="#e2e8f0" font-size="19">4. <tspan fill="#c084fc" font-weight="700">Bleeder Resistor Purpose:</tspan> Bleeder resistor R_B maintains current above minimum critical threshold I_c = 2V_m / (3π ω L) and discharges capacitor when power is switched off.</text>
  </g>
</g>

  </g>

  <!-- Bottom Blueprint Metadata Footer -->
  <g transform="translate(60, 2070)">
    <line x1="0" y1="0" x2="3720" y2="0" stroke="#334155" stroke-width="1.5"/>
    <text x="10" y="32" fill="#64748b" font-size="16" font-weight="600">ANALOG ELECTRONICS MASTER BLUEPRINT ENGINE • VERIFIED ACROSS 422 LECTURE SLIDES • ZERO-OMISSION TITAN SPECIFICATION</text>
    <text x="3710" y="32" fill="#64748b" font-size="16" font-weight="600" text-anchor="end">PREPFUSION &amp; RAHUL SIR COMPREHENSIVE LECTURE SERIES ARCHITECTURE</text>
  </g>
</svg>