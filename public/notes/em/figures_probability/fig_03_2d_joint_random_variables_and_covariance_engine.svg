<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160" style="background:#090d16; font-family:'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#070a14"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>
    <linearGradient id="cardGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cardGradCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2338" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#081b2c" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="cardGradAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#281c06" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#1b1203" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="cardGradEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062817" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#031b0e" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="cardGradRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0814" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#1c050d" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="cardGradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#220d35" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#150722" stop-opacity="0.92"/>
    </linearGradient>
    <pattern id="gridPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="3840" height="2160" fill="url(#bgGrad)"/>
  <rect width="3840" height="2160" fill="url(#gridPattern)"/>
  <rect x="50" y="50" width="3740" height="2060" rx="24" fill="none" stroke="#1e293b" stroke-width="3"/>
  <rect x="65" y="65" width="3710" height="2030" rx="18" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="16, 8" stroke-opacity="0.4"/>

  <!-- HEADER -->
  <g transform="translate(120, 100)">
    <rect x="0" y="0" width="520" height="42" rx="21" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="260" y="27" fill="#38bdf8" font-size="20" font-weight="700" letter-spacing="2" text-anchor="middle">GATE 2027 TITANS BATCH • BLUEPRINT 03</text>
    <text x="0" y="110" fill="#f8fafc" font-size="52" font-weight="800" letter-spacing="1">2D JOINT RANDOM VARIABLES, COVARIANCE &amp; CORRELATION ENGINE</text>
    <text x="0" y="160" fill="#94a3b8" font-size="24" font-weight="400">Bivariate CDF, 2D Rectangle Rule, Joint &amp; Marginal PDFs, Conditional Densities, Covariance, Pearson Correlation &amp; Orthogonality</text>
  </g>

  <!-- COLUMN 1: BIVARIATE CDF & RECTANGLE RULE -->
  <g transform="translate(120, 310)">
    <rect x="0" y="0" width="1140" height="840" rx="20" fill="url(#cardGradDark)" stroke="#1e293b" stroke-width="2"/>
    <rect x="0" y="0" width="1140" height="75" rx="20" fill="#0f172a"/>
    <rect x="25" y="22" width="8" height="32" rx="4" fill="#38bdf8"/>
    <text x="45" y="45" fill="#38bdf8" font-size="28" font-weight="700">1. JOINT CDF &amp; 2D RECTANGLE RULE</text>

    <g transform="translate(40, 110)">
      <rect x="0" y="0" width="1050" height="210" rx="12" fill="#1e293b" fill-opacity="0.5" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="25" y="40" fill="#38bdf8" font-size="22" font-weight="700">Joint Cumulative Distribution Function</text>
      <text x="25" y="80" fill="#f8fafc" font-size="18">F_{XY}(x, y) = P(X ≤ x, Y ≤ y),   for -∞ &lt; x, y &lt; ∞</text>
      <text x="25" y="115" fill="#cbd5e1" font-size="18">• Marginals: F_X(x) = F_{XY}(x, ∞),  F_Y(y) = F_{XY}(∞, y).</text>
      <text x="25" y="150" fill="#cbd5e1" font-size="18">• Limits: F_{XY}(∞, ∞) = 1,  F_{XY}(-∞, y) = 0,  F_{XY}(x, -∞) = 0.</text>
      <text x="25" y="185" fill="#34d399" font-size="17">• Monotonically non-decreasing in BOTH x and y individually.</text>
    </g>

    <g transform="translate(40, 340)">
      <rect x="0" y="0" width="1050" height="230" rx="12" fill="#1e293b" fill-opacity="0.5" stroke="#fbbf24" stroke-width="1.2"/>
      <text x="25" y="40" fill="#fbbf24" font-size="22" font-weight="700">The 2D Rectangle Inclusion-Exclusion Formula</text>
      <text x="25" y="80" fill="#f8fafc" font-size="18">Probability that (X, Y) falls into rectangle (x₁, x₂] × (y₁, y₂]:</text>
      <text x="50" y="125" fill="#fbbf24" font-size="21" font-weight="700">P(x₁ &lt; X ≤ x₂,  y₁ &lt; Y ≤ y₂) = F_{XY}(x₂, y₂) - F_{XY}(x₁, y₂) - F_{XY}(x₂, y₁) + F_{XY}(x₁, y₁) ≥ 0</text>
      <text x="25" y="165" fill="#cbd5e1" font-size="18">• Corner Signs: Top-Right (+) minus Top-Left (-) minus Bottom-Right (-) plus Bottom-Left (+).</text>
      <text x="25" y="200" fill="#f43f5e" font-size="17">EXAM TRAP: If this linear combination evaluates &lt; 0, candidate F_{XY} is INVALID!</text>
    </g>

    <g transform="translate(40, 590)">
      <rect x="0" y="0" width="1050" height="210" rx="12" fill="#1e293b" fill-opacity="0.5" stroke="#34d399" stroke-width="1.2"/>
      <text x="25" y="40" fill="#34d399" font-size="22" font-weight="700">2D Joint Probability Density Function</text>
      <text x="25" y="80" fill="#38bdf8" font-size="20" font-weight="700">f_{XY}(x, y) = ∂²/∂x∂y F_{XY}(x, y)</text>
      <text x="25" y="120" fill="#f8fafc" font-size="18">• Normalization Volume: ∫₋∞^∞ ∫₋∞^∞ f_{XY}(x, y) dx dy = 1.</text>
      <text x="25" y="155" fill="#cbd5e1" font-size="17">• P((X,Y) ∈ R) = ∬_R f_{XY}(x, y) dx dy. Area/Volume integral.</text>
      <text x="25" y="190" fill="#94a3b8" font-size="16">• Marginal PDF of X: f_X(x) = ∫₋∞^∞ f_{XY}(x, y) dy  (integrate out y).</text>
    </g>
  </g>

  <!-- COLUMN 2: INDEPENDENCE & CONDITIONAL DENSITIES -->
  <g transform="translate(1300, 310)">
    <rect x="0" y="0" width="1140" height="840" rx="20" fill="url(#cardGradDark)" stroke="#1e293b" stroke-width="2"/>
    <rect x="0" y="0" width="1140" height="75" rx="20" fill="#0f172a"/>
    <rect x="25" y="22" width="8" height="32" rx="4" fill="#60a5fa"/>
    <text x="45" y="45" fill="#60a5fa" font-size="28" font-weight="700">2. STATISTICAL INDEPENDENCE &amp; BOUNDARY COUPLING</text>

    <g transform="translate(40, 110)">
      <rect x="0" y="0" width="1050" height="230" rx="12" fill="#1e293b" fill-opacity="0.5" stroke="#60a5fa" stroke-width="1.2"/>
      <text x="25" y="40" fill="#60a5fa" font-size="22" font-weight="700">Statistical Independence Criteria</text>
      <text x="25" y="80" fill="#f8fafc" font-size="18">X and Y are statistically independent iff:</text>
      <text x="50" y="120" fill="#38bdf8" font-size="22" font-weight="700">f_{XY}(x, y) = f_X(x) · f_Y(y)   ∀ (x, y) ∈ ℝ²</text>
      <text x="25" y="160" fill="#cbd5e1" font-size="18">Equivalently: F_{XY}(x, y) = F_X(x) · F_Y(y), or f_{X|Y}(x|y) = f_X(x).</text>
      <text x="25" y="195" fill="#34d399" font-size="17">Multiplication Law: E[g(X) h(Y)] = E[g(X)] · E[h(Y)] under independence.</text>
    </g>

    <g transform="translate(40, 360)">
      <rect x="0" y="0" width="1050" height="250" rx="12" fill="#1e293b" fill-opacity="0.5" stroke="#f43f5e" stroke-width="1.2"/>
      <text x="25" y="40" fill="#f43f5e" font-size="22" font-weight="700">THE RECTANGULAR SUPPORT THEOREM (CRITICAL EXAM TEST)</text>
      <text x="25" y="75" fill="#cbd5e1" font-size="18">Factorability requires TWO simultaneous conditions:</text>
      <text x="50" y="110" fill="#f8fafc" font-size="18">1. Algebraic factorability: f_{XY}(x, y) = g(x) · h(y).</text>
      <text x="50" y="145" fill="#f8fafc" font-size="18">2. Geometric Cartesian domain: Support MUST be a rectangle [a,b] × [c,d].</text>
      <text x="25" y="185" fill="#fbbf24" font-size="18">LETHAL TRAP: If limits are coupled (e.g. 0 &lt; y &lt; x &lt; 1, or x² + y² ≤ 1):</text>
      <text x="50" y="220" fill="#f43f5e" font-size="20" font-weight="700">X and Y are NEVER independent, even if f_{XY}(x, y) = C (constant)!</text>
    </g>

    <g transform="translate(40, 630)">
      <rect x="0" y="0" width="1050" height="170" rx="12" fill="#1e293b" fill-opacity="0.5" stroke="#c084fc" stroke-width="1.2"/>
      <text x="25" y="38" fill="#c084fc" font-size="22" font-weight="700">Conditional Probability Densities</text>
      <text x="25" y="75" fill="#f8fafc" font-size="18">f_{X|Y}(x | y) = f_{XY}(x, y) / f_Y(y)   (for f_Y(y) &gt; 0)</text>
      <text x="25" y="110" fill="#f8fafc" font-size="18">f_{Y|X}(y | x) = f_{XY}(x, y) / f_X(x)   (for f_X(x) &gt; 0)</text>
      <text x="25" y="145" fill="#38bdf8" font-size="17">Slice Interpretation: Height profile of joint surface along line Y=y, normalized by area f_Y(y).</text>
    </g>
  </g>

  <!-- COLUMN 3: COVARIANCE & CORRELATION -->
  <g transform="translate(2480, 310)">
    <rect x="0" y="0" width="1240" height="840" rx="20" fill="url(#cardGradDark)" stroke="#1e293b" stroke-width="2"/>
    <rect x="0" y="0" width="1240" height="75" rx="20" fill="#0f172a"/>
    <rect x="25" y="22" width="8" height="32" rx="4" fill="#34d399"/>
    <text x="45" y="45" fill="#34d399" font-size="28" font-weight="700">3. COVARIANCE, CORRELATION &amp; LINEAR COMBINATIONS</text>

    <g transform="translate(40, 110)">
      <rect x="0" y="0" width="1150" height="230" rx="12" fill="#1e293b" fill-opacity="0.5" stroke="#34d399" stroke-width="1.2"/>
      <text x="25" y="40" fill="#34d399" font-size="22" font-weight="700">Covariance &amp; Pearson Correlation Coefficient</text>
      <text x="25" y="80" fill="#cbd5e1" font-size="18">• Correlation (Raw Joint Moment): R_{XY} = E[XY] = ∬ xy f_{XY}(x, y) dx dy.</text>
      <text x="25" y="120" fill="#f8fafc" font-size="18">• Covariance (Central Moment): C_{XY} = σ_{XY} = E[(X - μ_X)(Y - μ_Y)] = E[XY] - μ_X μ_Y.</text>
      <text x="25" y="160" fill="#38bdf8" font-size="21" font-weight="700">ρ_{XY} = r = Cov(X, Y) / [ σ_X · σ_Y ],   Bounded: -1 ≤ ρ_{XY} ≤ +1</text>
      <text x="25" y="200" fill="#94a3b8" font-size="16">Cauchy-Schwarz Inequality bounds ρ: |E[(X-μ_X)(Y-μ_Y)]| ≤ σ_X σ_Y.</text>
    </g>

    <g transform="translate(40, 360)">
      <rect x="0" y="0" width="1150" height="230" rx="12" fill="#1e293b" fill-opacity="0.5" stroke="#fbbf24" stroke-width="1.2"/>
      <text x="25" y="40" fill="#fbbf24" font-size="22" font-weight="700">Linear Combination Master Theorems: W = aX + bY</text>
      <text x="25" y="80" fill="#f8fafc" font-size="18">• Mean: E[W] = a μ_X + b μ_Y   (Linearity always holds).</text>
      <text x="50" y="125" fill="#fbbf24" font-size="22" font-weight="700">Var(aX + bY) = a² σ_X² + b² σ_Y² + 2ab Cov(X, Y)</text>
      <text x="50" y="165" fill="#f8fafc" font-size="18">Var(aX - bY) = a² σ_X² + b² σ_Y² - 2ab Cov(X, Y)</text>
      <text x="25" y="205" fill="#34d399" font-size="17">If X, Y are Uncorrelated (Cov = 0): Var(aX ± bY) = a² σ_X² + b² σ_Y² identically!</text>
    </g>

    <g transform="translate(40, 610)">
      <rect x="0" y="0" width="1150" height="190" rx="12" fill="#1e293b" fill-opacity="0.5" stroke="#c084fc" stroke-width="1.2"/>
      <text x="25" y="38" fill="#c084fc" font-size="22" font-weight="700">Scale Invariance of Pearson Correlation</text>
      <text x="25" y="75" fill="#cbd5e1" font-size="18">If Y = aX + b (deterministic linear mapping):</text>
      <text x="50" y="115" fill="#c084fc" font-size="20" font-weight="700">r = a / |a| = sgn(a) ⟹ r = +1 (if a &gt; 0),  r = -1 (if a &lt; 0)</text>
      <text x="25" y="155" fill="#94a3b8" font-size="16">Shift b has zero effect; magnitude |a| cancels out in ratio Cov/(σ_X σ_Y).</text>
    </g>
  </g>

  <!-- BOTTOM FULL-WIDTH: THE THREE-TIER HIERARCHY -->
  <g transform="translate(120, 1180)">
    <rect x="0" y="0" width="3600" height="900" rx="20" fill="url(#cardGradDark)" stroke="#1e293b" stroke-width="2"/>
    <rect x="0" y="0" width="3600" height="75" rx="20" fill="#0f172a"/>
    <rect x="25" y="22" width="8" height="32" rx="4" fill="#38bdf8"/>
    <text x="45" y="45" fill="#38bdf8" font-size="28" font-weight="700">4. THE THREE-TIER HIERARCHY: INDEPENDENCE vs UNCORRELATEDNESS vs ORTHOGONALITY</text>

    <!-- Three Tier Panels -->
    <g transform="translate(50, 110)">
      <rect x="0" y="0" width="1120" height="730" rx="16" fill="#1e293b" fill-opacity="0.5" stroke="#34d399" stroke-width="1.5"/>
      <rect x="0" y="0" width="1120" height="55" rx="16" fill="#059669" fill-opacity="0.25"/>
      <text x="30" y="36" fill="#34d399" font-size="22" font-weight="700">TIER 1: STATISTICAL INDEPENDENCE (STRONGEST)</text>
      <text x="30" y="95" fill="#f8fafc" font-size="18">Definition: f_{XY}(x, y) = f_X(x) · f_Y(y) for all (x, y).</text>
      <text x="30" y="140" fill="#cbd5e1" font-size="17">• Meaning: Complete absence of ANY statistical relationship (linear or nonlinear).</text>
      <text x="30" y="180" fill="#38bdf8" font-size="18" font-weight="700">THEOREM: Independence IMPLIES Uncorrelatedness ALWAYS.</text>
      <text x="60" y="215" fill="#94a3b8" font-size="16">Proof: E[XY] = E[X] E[Y] ⟹ Cov(X, Y) = E[XY] - E[X]E[Y] = 0.</text>
      <text x="30" y="270" fill="#f43f5e" font-size="18" font-weight="700">CONVERSE IS FALSE IN GENERAL:</text>
      <text x="30" y="310" fill="#cbd5e1" font-size="17">Uncorrelatedness DOES NOT imply Independence!</text>
      <text x="30" y="350" fill="#fbbf24" font-size="17">Canonical Counterexample: Y = X²</text>
      <text x="60" y="385" fill="#94a3b8" font-size="16">Let X ∈ {-1, 0, 1} with equal prob 1/3. Then Y = X² ∈ {0, 1}.</text>
      <text x="60" y="415" fill="#94a3b8" font-size="16">E[X] = 0, E[XY] = E[X³] = 0 ⟹ Cov(X, Y) = 0 - 0 = 0 (Uncorrelated!).</text>
      <text x="60" y="445" fill="#f43f5e" font-size="16">Yet Y is completely determined by X: P(Y=1|X=1) = 1 ≠ P(Y=1) = 2/3 (DEPENDENT!).</text>
      <text x="30" y="510" fill="#34d399" font-size="18" font-weight="700">THE SOLE EXCEPTION: JOINT GAUSSIAN DISTRIBUTION</text>
      <text x="30" y="550" fill="#cbd5e1" font-size="17">If X and Y are Jointly Gaussian, then Uncorrelated ⟺ Independent strictly!</text>
    </g>

    <g transform="translate(1220, 110)">
      <rect x="0" y="0" width="1120" height="730" rx="16" fill="#1e293b" fill-opacity="0.5" stroke="#38bdf8" stroke-width="1.5"/>
      <rect x="0" y="0" width="1120" height="55" rx="16" fill="#0284c7" fill-opacity="0.25"/>
      <text x="30" y="36" fill="#38bdf8" font-size="22" font-weight="700">TIER 2: UNCORRELATEDNESS (LINEAR INDEPENDENCE)</text>
      <text x="30" y="95" fill="#f8fafc" font-size="18">Definition: Cov(X, Y) = 0   ⟺   E[XY] = E[X] · E[Y]</text>
      <text x="30" y="140" fill="#cbd5e1" font-size="17">• Meaning: Complete absence of LINEAR trend between X and Y.</text>
      <text x="30" y="180" fill="#cbd5e1" font-size="17">• Pearson correlation coefficient r = 0.</text>
      <text x="30" y="220" fill="#cbd5e1" font-size="17">• Regression lines are mutually perpendicular (θ = 90°).</text>
      <text x="30" y="280" fill="#fbbf24" font-size="18" font-weight="700">Variance Additivity:</text>
      <text x="60" y="320" fill="#f8fafc" font-size="18">Var(X + Y) = Var(X) + Var(Y)</text>
      <text x="60" y="355" fill="#f8fafc" font-size="18">Var(X - Y) = Var(X) + Var(Y)</text>
      <text x="30" y="420" fill="#c084fc" font-size="18" font-weight="700">Symmetric Density Principle:</text>
      <text x="30" y="460" fill="#cbd5e1" font-size="17">If the joint PDF f_{XY}(x, y) has odd symmetry in x (f(-x, y) = f(x, y))</text>
      <text x="30" y="495" fill="#cbd5e1" font-size="17">over a symmetric domain ⟹ E[XY] = 0 and E[X] = 0 ⟹ Uncorrelated!</text>
      <text x="30" y="560" fill="#f43f5e" font-size="17" font-weight="700">EXAM TRAP: Circular disk x² + y² ≤ 1 has Cov = 0, but is NOT independent!</text>
    </g>

    <g transform="translate(2390, 110)">
      <rect x="0" y="0" width="1150" height="730" rx="16" fill="#1e293b" fill-opacity="0.5" stroke="#fbbf24" stroke-width="1.5"/>
      <rect x="0" y="0" width="1150" height="55" rx="16" fill="#d97706" fill-opacity="0.25"/>
      <text x="30" y="36" fill="#fbbf24" font-size="22" font-weight="700">TIER 3: ORTHOGONALITY (GEOMETRIC INNER PRODUCT)</text>
      <text x="30" y="95" fill="#f8fafc" font-size="18">Definition: E[XY] = R_{XY} = 0   (Inner product vanishes)</text>
      <text x="30" y="140" fill="#cbd5e1" font-size="17">• Covariance under Orthogonality:</text>
      <text x="60" y="175" fill="#38bdf8" font-size="18">Cov(X, Y) = E[XY] - μ_X μ_Y = 0 - μ_X μ_Y = -μ_X μ_Y</text>
      <text x="30" y="230" fill="#34d399" font-size="18" font-weight="700">THE GOLDEN ZERO-MEAN BRIDGE THEOREM:</text>
      <text x="30" y="270" fill="#f8fafc" font-size="18">If EITHER μ_X = 0 OR μ_Y = 0 (at least one variable is zero-mean):</text>
      <text x="60" y="315" fill="#34d399" font-size="22" font-weight="700">Orthogonal ⟺ Uncorrelated   (IDENTICALLY EQUIVALENT!)</text>
      <text x="30" y="375" fill="#cbd5e1" font-size="17">Proof: Cov(X, Y) = E[XY] - (0)(μ_Y) = E[XY]. Hence Cov = 0 ⟺ E[XY] = 0.</text>
      <text x="30" y="440" fill="#fbbf24" font-size="18" font-weight="700">Summary Decision Matrix:</text>
      <text x="60" y="480" fill="#cbd5e1" font-size="16">• If both μ_X ≠ 0 and μ_Y ≠ 0: Orthogonal ≠ Uncorrelated.</text>
      <text x="60" y="515" fill="#cbd5e1" font-size="16">• Independent with μ_X ≠ 0, μ_Y ≠ 0: Uncorrelated, but NOT Orthogonal (E[XY] = μ_X μ_Y ≠ 0).</text>
      <text x="60" y="550" fill="#cbd5e1" font-size="16">• Independent with μ_X = 0: Both Uncorrelated AND Orthogonal!</text>
      <text x="30" y="630" fill="#f43f5e" font-size="17" font-weight="700">Exam Diagnostic: Check means first! If zero-mean, Cov = Correlation.</text>
    </g>
  </g>
</svg>