<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350" width="2400" height="1350" style="background:#0d1117; font-family:'Inter', system-ui, sans-serif;">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262d" stroke-width="1" stroke-opacity="0.6"/>
    </pattern>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.98"/>
    </linearGradient>
  </defs>

  <rect width="2400" height="1350" fill="#0d1117"/>
  <rect width="2400" height="1350" fill="url(#grid)"/>

  <!-- Header -->
  <rect x="80" y="50" width="2240" height="110" rx="16" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="120" y="105" fill="#38bdf8" font-size="34" font-weight="700" letter-spacing="1.5">SIGNALS &amp; SYSTEMS • CHAPTER 07 • FIGURE 7.1</text>
  <text x="120" y="142" fill="#8b949e" font-size="20">DTFT Foundations: Analysis/Synthesis Engine, Continuous Frequency Ω, 2π-Periodicity &amp; Unit-Circle Evaluation</text>
  <rect x="2020" y="75" width="260" height="58" rx="10" fill="#21262d" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="2150" y="112" fill="#fbbf24" font-size="20" font-weight="600" text-anchor="middle">PREPFUSION TITANS</text>

  <!-- Panel 1: Analysis & Synthesis Engine -->
  <rect x="80" y="190" width="700" height="1090" rx="18" fill="url(#panelGrad)" stroke="#30363d" stroke-width="2"/>
  <rect x="80" y="190" width="700" height="60" rx="18" fill="#21262d"/>
  <text x="430" y="230" fill="#38bdf8" font-size="22" font-weight="700" text-anchor="middle">1. ANALYSIS &amp; SYNTHESIS EQUATIONS</text>

  <g transform="translate(110, 270)">
    <text x="0" y="30" fill="#e6edf3" font-size="18" font-weight="600">Discrete-Time Fourier Transform (Analysis):</text>
    <rect x="0" y="45" width="640" height="80" rx="10" fill="#0d1117" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="320" y="95" fill="#38bdf8" font-size="24" font-weight="700" text-anchor="middle">X(eʲᶿ) = ∑ₙ₌₋∞⁺∞ x[n] e⁻ʲᶿⁿ</text>

    <text x="0" y="165" fill="#8b949e" font-size="15">Discrete-Time Domain (n ∈ ℤ) ⟶ Continuous Frequency (Ω ∈ ℝ)</text>

    <!-- Inverse DTFT -->
    <text x="0" y="215" fill="#e6edf3" font-size="18" font-weight="600">Inverse DTFT / Synthesis Equation:</text>
    <rect x="0" y="230" width="640" height="80" rx="10" fill="#0d1117" stroke="#34d399" stroke-width="1.5"/>
    <text x="320" y="280" fill="#34d399" font-size="24" font-weight="700" text-anchor="middle">x[n] = (1 / 2π) ∫_⟨2π⟩ X(eʲᶿ) eʲᶿⁿ dΩ</text>

    <text x="0" y="345" fill="#8b949e" font-size="15">Integrated over ANY continuous interval of length 2π (e.g., [-π, π] or [0, 2π])</text>

    <!-- Convergence Box -->
    <rect x="0" y="380" width="640" height="230" rx="12" fill="#161b22" stroke="#f87171" stroke-width="1.5"/>
    <text x="25" y="415" fill="#f87171" font-size="19" font-weight="700">Dirichlet / Absolute Summability Condition</text>
    <text x="25" y="445" fill="#e6edf3" font-size="15">DTFT converges uniformly to a continuous function X(eʲᶿ) if:</text>
    <rect x="25" y="460" width="590" height="55" rx="8" fill="#0d1117" stroke="#f87171" stroke-width="1"/>
    <text x="320" y="495" fill="#f87171" font-size="20" font-weight="700" text-anchor="middle">∑ₙ₌₋∞⁺∞ |x[n]| &lt; ∞  (L¹ Absolute Summability)</text>
    <text x="25" y="545" fill="#8b949e" font-size="14">• If ∑|x[n]|² &lt; ∞ (finite energy), DTFT converges in mean-square sense.</text>
    <text x="25" y="575" fill="#fbbf24" font-size="14" font-weight="600">• If x[n] not summable (e.g. u[n], 1, cos Ω₀n), impulses δ(Ω) appear!</text>

    <!-- Z-Transform Connection -->
    <rect x="0" y="635" width="640" height="190" rx="12" fill="#161b22" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="25" y="670" fill="#a78bfa" font-size="19" font-weight="700">Connection to Bilateral Z-Transform</text>
    <text x="25" y="705" fill="#e6edf3" font-size="16">Set z = r eʲᶿ with r = |z| = 1 (The Unit Circle):</text>
    <rect x="25" y="720" width="590" height="50" rx="8" fill="#0d1117" stroke="#a78bfa" stroke-width="1"/>
    <text x="320" y="753" fill="#a78bfa" font-size="22" font-weight="700" text-anchor="middle">X(eʲᶿ) = X(z)|_{z = eʲᶿ}</text>
    <text x="25" y="798" fill="#fbbf24" font-size="14" font-weight="600">CRITICAL: DTFT exists algebraically iff ROC of X(z) includes |z| = 1!</text>

    <!-- Fundamental Interval Highlight -->
    <rect x="0" y="850" width="640" height="160" rx="12" fill="#0d1117" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="25" y="885" fill="#38bdf8" font-size="18" font-weight="700">The Continuous Frequency Variable Ω</text>
    <text x="25" y="915" fill="#e6edf3" font-size="14">• Digital radian frequency: Ω = ω T_s = 2π (f / f_s) [radians/sample]</text>
    <text x="25" y="945" fill="#e6edf3" font-size="14">• Low Frequencies: Ω = 0, ±2π, ±4π ... (near DC)</text>
    <text x="25" y="975" fill="#e6edf3" font-size="14">• High Frequencies: Ω = ±π, ±3π ... (half sampling rate / Nyquist)</text>
  </g>

  <!-- Panel 2: Spectrum Periodicity & Symmetry Visualizer -->
  <rect x="810" y="190" width="770" height="1090" rx="18" fill="url(#panelGrad)" stroke="#30363d" stroke-width="2"/>
  <rect x="810" y="190" width="770" height="60" rx="18" fill="#21262d"/>
  <text x="1195" y="230" fill="#38bdf8" font-size="22" font-weight="700" text-anchor="middle">2. INHERENT 2π-PERIODICITY OF DTFT SPECTRUM</text>

  <g transform="translate(840, 270)">
    <rect x="0" y="15" width="710" height="110" rx="12" fill="#161b22" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="25" y="48" fill="#38bdf8" font-size="19" font-weight="700">Mathematical Proof of 2π-Periodicity:</text>
    <text x="25" y="80" fill="#e6edf3" font-size="16">X(eʲ⁽ᶿ⁺²ᵏᵖⁱ⁾) = ∑ x[n] e⁻ʲ(Ω + 2kπ)n = ∑ x[n] e⁻ʲᶿⁿ · (e⁻ʲ²ᵖⁱ)ᵏⁿ</text>
    <text x="25" y="110" fill="#34d399" font-size="17" font-weight="700">Since e⁻ʲ²ᵖⁱⁿ = 1 for all integer n ⟹ X(eʲ⁽ᶿ⁺²ᵖⁱ⁾) ≡ X(eʲᶿ)</text>

    <!-- Spectrum Curve Graphic -->
    <g transform="translate(20, 160)">
      <rect x="0" y="0" width="670" height="340" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
      <text x="335" y="30" fill="#e6edf3" font-size="16" font-weight="600" text-anchor="middle">Periodic DTFT Magnitude Spectrum |X(eʲᶿ)|</text>
      
      <!-- Axis lines -->
      <line x1="40" y1="280" x2="630" y2="280" stroke="#8b949e" stroke-width="2"/>
      <line x1="335" y1="50" x2="335" y2="295" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4"/>
      
      <!-- Ticks -->
      <text x="335" y="310" fill="#e6edf3" font-size="14" text-anchor="middle">0 (DC)</text>
      <text x="460" y="310" fill="#38bdf8" font-size="14" text-anchor="middle">+π</text>
      <text x="585" y="310" fill="#8b949e" font-size="14" text-anchor="middle">+2π</text>
      <text x="210" y="310" fill="#38bdf8" font-size="14" text-anchor="middle">-π</text>
      <text x="85" y="310" fill="#8b949e" font-size="14" text-anchor="middle">-2π</text>
      
      <!-- Highlight Baseband [-π, π] -->
      <rect x="210" y="55" width="250" height="225" fill="#38bdf8" fill-opacity="0.08" stroke="#38bdf8" stroke-dasharray="4"/>
      <text x="335" y="75" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle">PRIMARY BASEBAND [-π, π]</text>

      <!-- Spectrum Curves (Repeated lobes) -->
      <!-- Center lobe -->
      <path d="M 210 280 C 240 280, 270 120, 335 120 C 400 120, 430 280, 460 280" fill="none" stroke="#38bdf8" stroke-width="3.5"/>
      <!-- Right lobe -->
      <path d="M 460 280 C 490 280, 520 120, 585 120 C 610 120, 625 240, 630 280" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-dasharray="2"/>
      <!-- Left lobe -->
      <path d="M 40 280 C 45 240, 60 120, 85 120 C 150 120, 180 280, 210 280" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-dasharray="2"/>
    </g>

    <!-- Key Insights Box -->
    <rect x="0" y="530" width="710" height="230" rx="12" fill="#161b22" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="25" y="565" fill="#fbbf24" font-size="19" font-weight="700">CTFT vs DTFT Grand Distinction</text>
    
    <g transform="translate(25, 585)">
      <rect x="0" y="0" width="320" height="150" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
      <text x="160" y="30" fill="#60a5fa" font-size="16" font-weight="700" text-anchor="middle">CTFT: x(t) ⟷ X(jω)</text>
      <text x="15" y="60" fill="#8b949e" font-size="13">• Continuous Time: t ∈ ℝ</text>
      <text x="15" y="85" fill="#8b949e" font-size="13">• Continuous Freq: ω ∈ ℝ</text>
      <text x="15" y="110" fill="#f87171" font-size="13" font-weight="600">• Spectrum is APERIODIC!</text>
      <text x="15" y="135" fill="#8b949e" font-size="13">• Limits: ω ⟶ ±∞</text>

      <rect x="340" y="0" width="320" height="150" rx="8" fill="#0d1117" stroke="#38bdf8" stroke-width="1"/>
      <text x="500" y="30" fill="#38bdf8" font-size="16" font-weight="700" text-anchor="middle">DTFT: x[n] ⟷ X(eʲᶿ)</text>
      <text x="355" y="60" fill="#8b949e" font-size="13">• Discrete Time: n ∈ ℤ</text>
      <text x="355" y="85" fill="#8b949e" font-size="13">• Continuous Freq: Ω ∈ [-π, π]</text>
      <text x="355" y="110" fill="#34d399" font-size="13" font-weight="700">• Spectrum is 2π-PERIODIC!</text>
      <text x="355" y="135" fill="#fbbf24" font-size="13">• Discreteness in Time ⟹ Periodicity in Freq!</text>
    </g>

    <!-- Important Symmetry Card -->
    <rect x="0" y="780" width="710" height="230" rx="12" fill="#0d1117" stroke="#34d399" stroke-width="1.5"/>
    <text x="25" y="815" fill="#34d399" font-size="18" font-weight="700">Fundamental Baseband Range Selection</text>
    <text x="25" y="845" fill="#e6edf3" font-size="15">Both intervals capture all spectral information without redundancy:</text>
    <text x="25" y="880" fill="#38bdf8" font-size="15" font-weight="600">1. Symmetric Interval: Ω ∈ [-π, +π] (Recommended for filter design &amp; symmetry)</text>
    <text x="25" y="910" fill="#8b949e" font-size="14">   - DC is at center (Ω = 0); ±π are the folding Nyquist frequencies.</text>
    <text x="25" y="945" fill="#a78bfa" font-size="15" font-weight="600">2. Standard DSP Interval: Ω ∈ [0, 2π] (Direct match with DFT sampling index)</text>
    <text x="25" y="975" fill="#8b949e" font-size="14">   - Used when mapping k = 0, 1, ..., N-1 in Discrete Fourier Transform.</text>
  </g>

  <!-- Panel 3: Unit Circle Evaluation & Diagnostic Traps -->
  <rect x="1610" y="190" width="710" height="1090" rx="18" fill="url(#panelGrad)" stroke="#30363d" stroke-width="2"/>
  <rect x="1610" y="190" width="710" height="60" rx="18" fill="#21262d"/>
  <text x="1965" y="230" fill="#38bdf8" font-size="22" font-weight="700" text-anchor="middle">3. UNIT CIRCLE GEOMETRY &amp; GATE TRAPS</text>

  <g transform="translate(1640, 270)">
    <!-- Unit Circle Diagram -->
    <g transform="translate(30, 20)">
      <rect x="0" y="0" width="590" height="340" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
      <text x="295" y="30" fill="#e6edf3" font-size="16" font-weight="600" text-anchor="middle">Complex z-Plane: Unit Circle Contour |z| = 1</text>
      
      <!-- Coordinate Axes -->
      <line x1="50" y1="180" x2="540" y2="180" stroke="#8b949e" stroke-width="1.5"/>
      <line x1="295" y1="50" x2="295" y2="310" stroke="#8b949e" stroke-width="1.5"/>
      <text x="525" y="170" fill="#8b949e" font-size="13">Re{z}</text>
      <text x="305" y="70" fill="#8b949e" font-size="13">Im{z}</text>

      <!-- Unit Circle -->
      <circle cx="295" cy="180" r="105" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
      <circle cx="400" cy="180" r="4" fill="#34d399"/>
      <text x="415" y="175" fill="#34d399" font-size="13" font-weight="700">Ω = 0 (z = 1)</text>

      <circle cx="190" cy="180" r="4" fill="#f87171"/>
      <text x="120" y="175" fill="#f87171" font-size="13" font-weight="700">Ω = ±π (z = -1)</text>

      <circle cx="295" cy="75" r="4" fill="#fbbf24"/>
      <text x="305" y="95" fill="#fbbf24" font-size="13" font-weight="700">Ω = π/2 (z = j)</text>

      <circle cx="295" cy="285" r="4" fill="#fbbf24"/>
      <text x="305" y="275" fill="#fbbf24" font-size="13" font-weight="700">Ω = -π/2 (z = -j)</text>

      <!-- Direction Arrow -->
      <path d="M 370 105 A 105 105 0 0 0 320 80" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="375" y="130" fill="#38bdf8" font-size="14" font-weight="600">+Ω counter-clockwise</text>
    </g>

    <!-- 4 Lethal Exam Traps -->
    <rect x="0" y="380" width="650" height="630" rx="12" fill="#161b22" stroke="#f87171" stroke-width="1.5"/>
    <text x="25" y="415" fill="#f87171" font-size="19" font-weight="700">4 Lethal GATE Diagnostic Traps</text>

    <!-- Trap 1 -->
    <g transform="translate(25, 435)">
      <rect x="0" y="0" width="600" height="95" rx="8" fill="#0d1117" stroke="#f87171" stroke-width="1"/>
      <text x="15" y="25" fill="#f87171" font-size="15" font-weight="700">TRAP 1: Evaluating X(z) on Unit Circle When ROC Excludes It</text>
      <text x="15" y="50" fill="#e6edf3" font-size="13">For x[n] = 2ⁿ u[n], X(z) = 1/(1 - 2z⁻¹) with ROC |z| &gt; 2.</text>
      <text x="15" y="75" fill="#fbbf24" font-size="13" font-weight="600">SAFEGUARD: Setting z = eʲᶿ gives 1/(1 - 2e⁻ʲᶿ), which is FALSE! DTFT does NOT exist.</text>
    </g>

    <!-- Trap 2 -->
    <g transform="translate(25, 545)">
      <rect x="0" y="0" width="600" height="95" rx="8" fill="#0d1117" stroke="#f87171" stroke-width="1"/>
      <text x="15" y="25" fill="#f87171" font-size="15" font-weight="700">TRAP 2: Forgetting the 1/2π Normalization Factor in IDFT</text>
      <text x="15" y="50" fill="#e6edf3" font-size="13">IDTFT requires dividing the frequency integral by 2π.</text>
      <text x="15" y="75" fill="#34d399" font-size="13" font-weight="600">SAFEGUARD: Check x[0] = (1/2π) ∫₋ₚᵢ⁺ᵖⁱ X(eʲᶿ) dΩ. Must match time sequence at n=0!</text>
    </g>

    <!-- Trap 3 -->
    <g transform="translate(25, 655)">
      <rect x="0" y="0" width="600" height="95" rx="8" fill="#0d1117" stroke="#f87171" stroke-width="1"/>
      <text x="15" y="25" fill="#f87171" font-size="15" font-weight="700">TRAP 3: Unit Step u[n] DTFT Impulses</text>
      <text x="15" y="50" fill="#e6edf3" font-size="13">u[n] has pole at z = 1 (on unit circle). DTFT is NOT merely 1/(1 - e⁻ʲᶿ)!</text>
      <text x="15" y="75" fill="#fbbf24" font-size="13" font-weight="600">SAFEGUARD: u[n] ⟷ 1/(1 - e⁻ʲᶿ) + ∑ₖ π δ(Ω - 2πk). The π δ(Ω) captures the 0.5 DC offset!</text>
    </g>

    <!-- Trap 4 -->
    <g transform="translate(25, 765)">
      <rect x="0" y="0" width="600" height="95" rx="8" fill="#0d1117" stroke="#f87171" stroke-width="1"/>
      <text x="15" y="25" fill="#f87171" font-size="15" font-weight="700">TRAP 4: Continuous ω vs Discrete Radian Frequency Ω Confusion</text>
      <text x="15" y="50" fill="#e6edf3" font-size="13">Ω is normalized frequency (radians/sample), periodic with 2π.</text>
      <text x="15" y="75" fill="#38bdf8" font-size="13" font-weight="600">SAFEGUARD: Ω = ω T_s = 2π f / f_s. Highest unique frequency is always Ω = π (Nyquist).</text>
    </g>
  </g>
</svg>