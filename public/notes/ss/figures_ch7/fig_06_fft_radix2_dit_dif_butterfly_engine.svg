<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350" width="2400" height="1350" style="background:#0d1117; font-family:'Inter', system-ui, sans-serif;">
  <defs>
    <pattern id="grid6" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262d" stroke-width="1" stroke-opacity="0.6"/>
    </pattern>
    <linearGradient id="panelGrad6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22" font-opacity="0.95"/>
      <stop offset="100%" stop-color="#0d1117" font-opacity="0.98"/>
    </linearGradient>
  </defs>

  <rect width="2400" height="1350" fill="#0d1117"/>
  <rect width="2400" height="1350" fill="url(#grid6)"/>

  <!-- Header -->
  <rect x="80" y="50" width="2240" height="110" rx="16" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="120" y="105" fill="#38bdf8" font-size="34" font-weight="700" letter-spacing="1.5">SIGNALS &amp; SYSTEMS • CHAPTER 07 • FIGURE 7.6</text>
  <text x="120" y="142" fill="#8b949e" font-size="20">Fast Fourier Transform (FFT): Computational Speedup, Radix-2 DIT vs DIF Butterflies &amp; Bit Reversal</text>
  <rect x="2020" y="75" width="260" height="58" rx="10" fill="#21262d" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="2150" y="112" fill="#fbbf24" font-size="20" font-weight="600" text-anchor="middle">PREPFUSION TITANS</text>

  <!-- Panel 1: Computational Complexity & Speedup -->
  <rect x="80" y="190" width="700" height="1090" rx="18" fill="url(#panelGrad6)" stroke="#30363d" stroke-width="2"/>
  <rect x="80" y="190" width="700" height="60" rx="18" fill="#21262d"/>
  <text x="430" y="230" fill="#38bdf8" font-size="22" font-weight="700" text-anchor="middle">1. COMPUTATIONAL SPEEDUP ARITHMETIC</text>

  <g transform="translate(110, 270)">
    <!-- Direct DFT Complexity -->
    <rect x="0" y="10" width="640" height="180" rx="12" fill="#161b22" stroke="#f87171" stroke-width="1.5"/>
    <text x="25" y="45" fill="#f87171" font-size="19" font-weight="700">Direct N-Point DFT Complexity</text>
    <text x="25" y="75" fill="#e6edf3" font-size="15">Matrix-vector product X = F_N · x requires:</text>
    <rect x="25" y="90" width="590" height="50" rx="8" fill="#0d1117" stroke="#f87171" stroke-width="1"/>
    <text x="320" y="123" fill="#f87171" font-size="20" font-weight="700" text-anchor="middle">Complex Multiplications: N²   |   Complex Additions: N(N - 1)</text>
    <text x="25" y="165" fill="#8b949e" font-size="13">For N = 1024: ~1,048,576 complex multiplications!</text>

    <!-- Radix-2 FFT Complexity -->
    <rect x="0" y="205" width="640" height="210" rx="12" fill="#161b22" stroke="#34d399" stroke-width="1.5"/>
    <text x="25" y="240" fill="#34d399" font-size="19" font-weight="700">Radix-2 Cooley-Tukey FFT Complexity</text>
    <text x="25" y="270" fill="#e6edf3" font-size="15">Recursive divide-and-conquer into M = log₂ N stages:</text>
    <rect x="25" y="285" width="590" height="60" rx="8" fill="#0d1117" stroke="#34d399" stroke-width="1.5"/>
    <text x="320" y="322" fill="#34d399" font-size="20" font-weight="700" text-anchor="middle">Complex Mults: (N / 2) log₂ N   |   Complex Adds: N log₂ N</text>
    <text x="25" y="370" fill="#fbbf24" font-size="15" font-weight="600">• Number of Stages: M = log₂ N</text>
    <text x="25" y="395" fill="#38bdf8" font-size="15" font-weight="600">• Butterflies per stage: N / 2</text>

    <!-- Speedup Table -->
    <g transform="translate(0, 435)">
      <rect x="0" y="0" width="640" height="300" rx="12" fill="#0d1117" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="25" y="35" fill="#38bdf8" font-size="17" font-weight="700">GATE Complexity Comparison Table</text>
      
      <rect x="15" y="55" width="610" height="230" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="30" y="85" fill="#38bdf8" font-size="13" font-weight="700">N       Direct DFT Mults (N²)    Radix-2 FFT Mults (N/2 log₂N)    SPEEDUP FACTOR</text>
      <line x1="30" y1="95" x2="600" y2="95" stroke="#30363d" stroke-width="1"/>
      <text x="30" y="125" fill="#e6edf3" font-size="13">4       16                       4                                4.0× </text>
      <text x="30" y="155" fill="#e6edf3" font-size="13">8       64                       12                               5.33×</text>
      <text x="30" y="185" fill="#e6edf3" font-size="13">64      4,096                    192                              21.33×</text>
      <text x="30" y="215" fill="#e6edf3" font-size="13">256     65,536                   1,024                            64.0×</text>
      <text x="30" y="245" fill="#34d399" font-size="13" font-weight="700">1024    1,048,576                5,120                            204.8× SPEEDUP!</text>
      <text x="30" y="270" fill="#fbbf24" font-size="12" font-weight="600">Speedup Ratio = N² / (0.5 N log₂ N) = 2N / log₂ N</text>
    </g>

    <!-- Real Mults/Adds Conversion Rule -->
    <rect x="0" y="755" width="640" height="235" rx="12" fill="#161b22" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="25" y="790" fill="#fbbf24" font-size="18" font-weight="700">GATE Trap: Complex vs Real Operations</text>
    <text x="25" y="820" fill="#e6edf3" font-size="14">Each complex multiplication (a + jb)(c + jd) = (ac - bd) + j(ad + bc) requires:</text>
    <text x="25" y="850" fill="#34d399" font-size="15" font-weight="700">• 4 Real Multiplications and 2 Real Additions</text>
    <text x="25" y="880" fill="#e6edf3" font-size="14">Each complex addition (a + jb) + (c + jd) requires:</text>
    <text x="25" y="910" fill="#38bdf8" font-size="15" font-weight="700">• 2 Real Additions</text>
    <text x="25" y="945" fill="#f87171" font-size="14" font-weight="700">CRITICAL: If question asks for REAL multiplications, multiply by 4!</text>
    <text x="25" y="970" fill="#8b949e" font-size="12">Total Real Mults in Radix-2 FFT = 4 × (N/2 log₂ N) = 2N log₂ N</text>
  </g>

  <!-- Panel 2: Radix-2 DIT vs DIF Butterfly Engine -->
  <rect x="810" y="190" width="780" height="1090" rx="18" fill="url(#panelGrad6)" stroke="#30363d" stroke-width="2"/>
  <rect x="810" y="190" width="780" height="60" rx="18" fill="#21262d"/>
  <text x="1200" y="230" fill="#38bdf8" font-size="22" font-weight="700" text-anchor="middle">2. DIT vs DIF BUTTERFLY ARCHITECTURES</text>

  <g transform="translate(840, 270)">
    <!-- Butterfly 1: Decimation in Time (DIT) -->
    <rect x="0" y="10" width="720" height="340" rx="12" fill="#161b22" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="25" y="45" fill="#38bdf8" font-size="19" font-weight="700">Decimation-in-Time (DIT) 2-Point Butterfly</text>
    <text x="25" y="75" fill="#e6edf3" font-size="14">Twiddle factor multiplication occurs BEFORE cross-addition:</text>

    <!-- DIT Butterfly Schematic -->
    <g transform="translate(30, 95)">
      <rect x="0" y="0" width="660" height="160" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
      
      <!-- Input Labels -->
      <text x="20" y="45" fill="#e6edf3" font-size="15" font-weight="700">Input A</text>
      <text x="20" y="125" fill="#e6edf3" font-size="15" font-weight="700">Input B</text>

      <!-- Lines -->
      <line x1="80" y1="40" x2="520" y2="40" stroke="#38bdf8" stroke-width="2.5"/>
      <line x1="80" y1="120" x2="250" y2="120" stroke="#fbbf24" stroke-width="2.5"/>
      
      <!-- Twiddle block on branch B -->
      <rect x="250" y="100" width="70" height="40" rx="6" fill="#21262d" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="285" y="125" fill="#fbbf24" font-size="14" font-weight="700" text-anchor="middle">× W_N^r</text>

      <!-- Diagonal cross lines -->
      <line x1="320" y1="120" x2="480" y2="40" stroke="#38bdf8" stroke-width="2"/>
      <line x1="200" y1="40" x2="480" y2="120" stroke="#38bdf8" stroke-width="2"/>
      <line x1="320" y1="120" x2="520" y2="120" stroke="#fbbf24" stroke-width="2.5"/>

      <!-- -1 multiplier on lower branch -->
      <text x="440" y="140" fill="#f87171" font-size="16" font-weight="700">-1</text>

      <!-- Outputs -->
      <text x="540" y="45" fill="#34d399" font-size="16" font-weight="700">A' = A + W_N^r · B</text>
      <text x="540" y="125" fill="#f87171" font-size="16" font-weight="700">B' = A - W_N^r · B</text>
    </g>

    <text x="25" y="285" fill="#34d399" font-size="14" font-weight="700">• DIT Sequence Order: Input in BIT-REVERSED order ⟶ Output in NATURAL order</text>
    <text x="25" y="315" fill="#8b949e" font-size="13">• Decimation operates on time sequence indices: x[2n] (evens) and x[2n+1] (odds)</text>

    <!-- Butterfly 2: Decimation in Frequency (DIF) -->
    <rect x="0" y="370" width="720" height="340" rx="12" fill="#161b22" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="25" y="405" fill="#a78bfa" font-size="19" font-weight="700">Decimation-in-Frequency (DIF) 2-Point Butterfly</text>
    <text x="25" y="435" fill="#e6edf3" font-size="14">Twiddle factor multiplication occurs AFTER subtraction on lower output:</text>

    <!-- DIF Butterfly Schematic -->
    <g transform="translate(30, 455)">
      <rect x="0" y="0" width="660" height="160" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
      
      <!-- Input Labels -->
      <text x="20" y="45" fill="#e6edf3" font-size="15" font-weight="700">Input A</text>
      <text x="20" y="125" fill="#e6edf3" font-size="15" font-weight="700">Input B</text>

      <!-- Lines -->
      <line x1="80" y1="40" x2="520" y2="40" stroke="#a78bfa" stroke-width="2.5"/>
      <line x1="80" y1="120" x2="330" y2="120" stroke="#a78bfa" stroke-width="2.5"/>
      
      <!-- Diagonal cross lines -->
      <line x1="200" y1="120" x2="350" y2="40" stroke="#a78bfa" stroke-width="2"/>
      <line x1="160" y1="40" x2="330" y2="120" stroke="#a78bfa" stroke-width="2"/>
      
      <!-- -1 multiplier on cross -->
      <text x="280" y="140" fill="#f87171" font-size="16" font-weight="700">-1</text>

      <!-- Twiddle block on lower output branch AFTER subtraction -->
      <rect x="360" y="100" width="70" height="40" rx="6" fill="#21262d" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="395" y="125" fill="#fbbf24" font-size="14" font-weight="700" text-anchor="middle">× W_N^r</text>
      <line x1="430" y1="120" x2="520" y2="120" stroke="#a78bfa" stroke-width="2.5"/>

      <!-- Outputs -->
      <text x="540" y="45" fill="#34d399" font-size="16" font-weight="700">A' = A + B</text>
      <text x="540" y="125" fill="#fbbf24" font-size="16" font-weight="700">B' = (A - B) · W_N^r</text>
    </g>

    <text x="25" y="645" fill="#a78bfa" font-size="14" font-weight="700">• DIF Sequence Order: Input in NATURAL order ⟶ Output in BIT-REVERSED order</text>
    <text x="25" y="675" fill="#8b949e" font-size="13">• Decimation operates on frequency output bins: X[2k] (evens) and X[2k+1] (odds)</text>

    <!-- Grand DIT vs DIF Comparison Box -->
    <rect x="0" y="730" width="720" height="260" rx="12" fill="#0d1117" stroke="#34d399" stroke-width="1.5"/>
    <text x="25" y="765" fill="#34d399" font-size="18" font-weight="700">DIT vs DIF Duality Summary</text>
    
    <g transform="translate(25, 785)">
      <text x="0" y="25" fill="#38bdf8" font-size="14" font-weight="700">PARAMETER               DIT-FFT                      DIF-FFT</text>
      <line x1="0" y1="35" x2="670" y2="35" stroke="#30363d" stroke-width="1"/>
      <text x="0" y="60" fill="#e6edf3" font-size="13">Input Order             Bit-Reversed                 Natural (Sequential)</text>
      <text x="0" y="90" fill="#e6edf3" font-size="13">Output Order            Natural (Sequential)         Bit-Reversed</text>
      <text x="0" y="120" fill="#e6edf3" font-size="13">Twiddle Operation       Multiplied BEFORE cross-add  Multiplied AFTER cross-sub</text>
      <text x="0" y="150" fill="#e6edf3" font-size="13">Decimation Domain       Time domain sequence x[n]    Frequency spectrum X[k]</text>
      <text x="0" y="180" fill="#34d399" font-size="13" font-weight="700">Computational Cost      IDENTICAL: (N/2) log₂ N mults and N log₂ N adds</text>
    </g>
  </g>

  <!-- Panel 3: Bit-Reversal Indexing & Flowgraph Stages -->
  <rect x="1620" y="190" width="700" height="1090" rx="18" fill="url(#panelGrad6)" stroke="#30363d" stroke-width="2"/>
  <rect x="1620" y="190" width="700" height="60" rx="18" fill="#21262d"/>
  <text x="1970" y="230" fill="#38bdf8" font-size="22" font-weight="700" text-anchor="middle">3. BIT REVERSAL &amp; FLOWGRAPH</text>

  <g transform="translate(1650, 270)">
    <!-- Bit Reversal Table for N=8 -->
    <rect x="0" y="10" width="640" height="420" rx="12" fill="#161b22" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="25" y="45" fill="#38bdf8" font-size="19" font-weight="700">N = 8 Bit-Reversal Indexing Engine</text>
    <text x="25" y="75" fill="#e6edf3" font-size="14">Reverse 3-bit binary representation: (b₂ b₁ b₀) ⟶ (b₀ b₁ b₂):</text>

    <g transform="translate(25, 95)">
      <rect x="0" y="0" width="590" height="260" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
      <text x="20" y="30" fill="#38bdf8" font-size="13" font-weight="700">NATURAL INDEX    BINARY    REVERSED BINARY    BIT-REVERSED INDEX</text>
      <line x1="20" y1="40" x2="570" y2="40" stroke="#30363d" stroke-width="1"/>
      
      <text x="20" y="65" fill="#e6edf3" font-size="13">0                000       000                0  (x[0])</text>
      <text x="20" y="90" fill="#fbbf24" font-size="13" font-weight="600">1                001       100                4  (x[4])</text>
      <text x="20" y="115" fill="#e6edf3" font-size="13">2                010       010                2  (x[2])</text>
      <text x="20" y="140" fill="#fbbf24" font-size="13" font-weight="600">3                011       110                6  (x[6])</text>
      <text x="20" y="165" fill="#34d399" font-size="13" font-weight="600">4                100       001                1  (x[1])</text>
      <text x="20" y="190" fill="#e6edf3" font-size="13">5                101       101                5  (x[5])</text>
      <text x="20" y="215" fill="#34d399" font-size="13" font-weight="600">6                110       011                3  (x[3])</text>
      <text x="20" y="240" fill="#e6edf3" font-size="13">7                111       111                7  (x[7])</text>
    </g>

    <text x="25" y="385" fill="#34d399" font-size="15" font-weight="700">DIT Input Sequence: x[0], x[4], x[2], x[6], x[1], x[5], x[3], x[7]</text>
    <text x="25" y="412" fill="#8b949e" font-size="13">Indices 0, 2, 5, 7 stay unchanged; pairs (1,4) and (3,6) swap!</text>

    <!-- Multi-Stage Flowgraph Geometry -->
    <rect x="0" y="450" width="640" height="260" rx="12" fill="#161b22" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="25" y="485" fill="#fbbf24" font-size="18" font-weight="700">N = 8 FFT Multi-Stage Architecture</text>
    
    <g transform="translate(25, 505)">
      <rect x="0" y="0" width="590" height="185" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
      <text x="15" y="30" fill="#38bdf8" font-size="14" font-weight="700">STAGE 1: 4 two-point DFTs (Dual span = 1 sample)</text>
      <text x="15" y="55" fill="#8b949e" font-size="13">• Twiddle factor used: W₈⁰ = 1 only</text>

      <text x="15" y="90" fill="#34d399" font-size="14" font-weight="700">STAGE 2: 2 four-point DFTs (Dual span = 2 samples)</text>
      <text x="15" y="115" fill="#8b949e" font-size="13">• Twiddle factors used: W₈⁰ = 1, W₈² = -j</text>

      <text x="15" y="150" fill="#fbbf24" font-size="14" font-weight="700">STAGE 3: 1 eight-point DFT (Dual span = 4 samples)</text>
      <text x="15" y="172" fill="#8b949e" font-size="13">• Twiddle factors used: W₈⁰, W₈¹, W₈², W₈³</text>
    </g>

    <!-- In-Place Memory Property -->
    <rect x="0" y="730" width="640" height="260" rx="12" fill="#0d1117" stroke="#34d399" stroke-width="1.5"/>
    <text x="25" y="765" fill="#34d399" font-size="18" font-weight="700">In-Place Computation Memory Optimization</text>
    <text x="25" y="798" fill="#e6edf3" font-size="14">• Outputs of each butterfly A' and B' depend ONLY on A and B.</text>
    <text x="25" y="828" fill="#e6edf3" font-size="14">• A' can overwrite memory location of A; B' overwrites location of B.</text>
    <text x="25" y="858" fill="#34d399" font-size="14" font-weight="700">• Memory Required: EXACTLY N words (No auxiliary arrays needed!)</text>
    <text x="25" y="890" fill="#fbbf24" font-size="13" font-weight="600">GATE MCQ Trap: "Does FFT require 2N or N memory locations?"</text>
    <text x="25" y="915" fill="#38bdf8" font-size="13" font-weight="700">Answer: In-place FFT requires exactly N complex memory locations!</text>
  </g>
</svg>