<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350" width="2400" height="1350" style="background:#0d1117; font-family:'Inter', system-ui, sans-serif;">
  <defs>
    <pattern id="grid4" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262d" stroke-width="1" stroke-opacity="0.6"/>
    </pattern>
    <linearGradient id="panelGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.98"/>
    </linearGradient>
  </defs>

  <rect width="2400" height="1350" fill="#0d1117"/>
  <rect width="2400" height="1350" fill="url(#grid4)"/>

  <!-- Header -->
  <rect x="80" y="50" width="2240" height="110" rx="16" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="120" y="105" fill="#38bdf8" font-size="34" font-weight="700" letter-spacing="1.5">SIGNALS &amp; SYSTEMS • CHAPTER 07 • FIGURE 7.4</text>
  <text x="120" y="142" fill="#8b949e" font-size="20">Discrete-Time Fourier Series (DTFS): N-Harmonic Orthogonality, Analysis/Synthesis &amp; Power Theorem</text>
  <rect x="2020" y="75" width="260" height="58" rx="10" fill="#21262d" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="2150" y="112" fill="#fbbf24" font-size="20" font-weight="600" text-anchor="middle">PREPFUSION TITANS</text>

  <!-- Panel 1: Periodic Foundations & Orthogonality -->
  <rect x="80" y="190" width="720" height="1090" rx="18" fill="url(#panelGrad4)" stroke="#30363d" stroke-width="2"/>
  <rect x="80" y="190" width="720" height="60" rx="18" fill="#21262d"/>
  <text x="440" y="230" fill="#38bdf8" font-size="22" font-weight="700" text-anchor="middle">1. PERIODICITY &amp; ORTHOGONALITY</text>

  <g transform="translate(110, 270)">
    <rect x="0" y="10" width="660" height="150" rx="12" fill="#161b22" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="25" y="45" fill="#38bdf8" font-size="19" font-weight="700">Periodic Sequence Definition</text>
    <text x="25" y="75" fill="#e6edf3" font-size="15">A discrete-time signal x[n] is periodic if there exists integer N &gt; 0 such that:</text>
    <rect x="25" y="90" width="610" height="50" rx="8" fill="#0d1117" stroke="#38bdf8" stroke-width="1"/>
    <text x="330" y="122" fill="#38bdf8" font-size="22" font-weight="700" text-anchor="middle">x[n + N] = x[n]   for all n ∈ ℤ</text>

    <!-- Fundamental Frequency -->
    <rect x="0" y="175" width="660" height="140" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
    <text x="25" y="210" fill="#fbbf24" font-size="18" font-weight="700">Fundamental Discrete Frequency Ω₀</text>
    <text x="25" y="245" fill="#fbbf24" font-size="24" font-weight="700">Ω₀ = 2π / N   [radians/sample]</text>
    <text x="25" y="280" fill="#8b949e" font-size="14">Harmonic frequencies are multiples: Ω_k = k Ω₀ = k (2π / N)</text>

    <!-- Orthogonality of Discrete Exponentials -->
    <rect x="0" y="330" width="660" height="230" rx="12" fill="#161b22" stroke="#34d399" stroke-width="1.5"/>
    <text x="25" y="365" fill="#34d399" font-size="19" font-weight="700">Orthogonality of Harmonic Basis Vectors</text>
    <text x="25" y="395" fill="#e6edf3" font-size="15">Sum of complex exponentials over any consecutive interval of length N:</text>
    <rect x="25" y="410" width="610" height="65" rx="8" fill="#0d1117" stroke="#34d399" stroke-width="1.5"/>
    <text x="330" y="450" fill="#34d399" font-size="22" font-weight="700" text-anchor="middle">∑ₙ₌₀ᴺ⁻¹ eʲ(ᵏ ⁻ ᵐ)(²ᵖⁱ/ᴺ)ⁿ = N if (k - m) = rN, else 0</text>
    <text x="25" y="500" fill="#8b949e" font-size="14">• Over N consecutive points, distinct harmonic carriers are strictly orthogonal!</text>
    <text x="25" y="530" fill="#fbbf24" font-size="14" font-weight="600">• Unlike continuous CTFS (∞ harmonics), DTFS has ONLY N DISTINCT HARMONICS!</text>

    <!-- Finite Harmonic Count Proof -->
    <rect x="0" y="575" width="660" height="230" rx="12" fill="#0d1117" stroke="#f87171" stroke-width="1.5"/>
    <text x="25" y="610" fill="#f87171" font-size="18" font-weight="700">Why Are There Only N Distinct Harmonics?</text>
    <text x="25" y="640" fill="#e6edf3" font-size="15">Consider the harmonic carrier for index (k + N):</text>
    <text x="25" y="675" fill="#38bdf8" font-size="17" font-weight="600">ϕ_(k+N)[n] = eʲ(ᵏ⁺ᴺ)(²ᵖⁱ/ᴺ)ⁿ = eʲᵏ(²ᵖⁱ/ᴺ)ⁿ · eʲ(²ᵖⁱ)ⁿ</text>
    <text x="25" y="710" fill="#34d399" font-size="17" font-weight="700">Since eʲ²ᵖⁱⁿ ≡ 1 for all integer n ⟹ ϕ_(k+N)[n] ≡ ϕ_k[n] !</text>
    <text x="25" y="745" fill="#8b949e" font-size="14">Harmonic k=N is identical to k=0 (DC); k=N+1 is identical to k=1.</text>
    <text x="25" y="775" fill="#f87171" font-size="14" font-weight="700">DTFS spectrum repeats every N coefficients: a_(k+N) = a_k !</text>

    <!-- Fundamental Period Check -->
    <rect x="0" y="820" width="660" height="160" rx="12" fill="#161b22" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="25" y="855" fill="#a78bfa" font-size="18" font-weight="700">Finding Period N of Discrete Sinusoid cos(Ω₀n)</text>
    <text x="25" y="890" fill="#e6edf3" font-size="15">Periodic iff (Ω₀ / 2π) is a RATIONAL number = m / N (in lowest terms):</text>
    <text x="25" y="925" fill="#a78bfa" font-size="20" font-weight="700">Fundamental Period N = m · (2π / Ω₀)  (m is smallest integer making N int)</text>
    <text x="25" y="955" fill="#f87171" font-size="13" font-weight="600">CRITICAL: cos(2n) is NOT periodic in discrete time (2/2π is irrational)!</text>
  </g>

  <!-- Panel 2: DTFS Analysis & Synthesis Engine -->
  <rect x="830" y="190" width="740" height="1090" rx="18" fill="url(#panelGrad4)" stroke="#30363d" stroke-width="2"/>
  <rect x="830" y="190" width="740" height="60" rx="18" fill="#21262d"/>
  <text x="1200" y="230" fill="#38bdf8" font-size="22" font-weight="700" text-anchor="middle">2. DTFS ANALYSIS &amp; SYNTHESIS EQUATIONS</text>

  <g transform="translate(860, 270)">
    <!-- Synthesis Equation -->
    <rect x="0" y="10" width="680" height="160" rx="12" fill="#161b22" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="25" y="45" fill="#38bdf8" font-size="19" font-weight="700">Synthesis Equation (Reconstruction)</text>
    <text x="25" y="75" fill="#e6edf3" font-size="15">Expresses periodic signal as finite sum of N complex exponentials:</text>
    <rect x="25" y="90" width="630" height="60" rx="8" fill="#0d1117" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="340" y="130" fill="#38bdf8" font-size="24" font-weight="700" text-anchor="middle">x[n] = ∑_{k = ⟨N⟩} a_k eʲᵏ(²ᵖⁱ/ᴺ)ⁿ</text>

    <!-- Analysis Equation -->
    <rect x="0" y="185" width="680" height="160" rx="12" fill="#161b22" stroke="#34d399" stroke-width="1.5"/>
    <text x="25" y="220" fill="#34d399" font-size="19" font-weight="700">Analysis Equation (Spectral Coefficients)</text>
    <text x="25" y="250" fill="#e6edf3" font-size="15">Calculates harmonic coefficients a_k over any consecutive N samples:</text>
    <rect x="25" y="265" width="630" height="60" rx="8" fill="#0d1117" stroke="#34d399" stroke-width="1.5"/>
    <text x="340" y="305" fill="#34d399" font-size="24" font-weight="700" text-anchor="middle">a_k = (1 / N) ∑_{n = ⟨N⟩} x[n] e⁻ʲᵏ(²ᵖⁱ/ᴺ)ⁿ</text>

    <!-- Periodic Spectrum Diagram -->
    <g transform="translate(20, 365)">
      <rect x="0" y="0" width="640" height="280" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
      <text x="320" y="28" fill="#e6edf3" font-size="15" font-weight="600" text-anchor="middle">Inherent Periodicity of DTFS Coefficients a_k</text>
      <line x1="30" y1="210" x2="610" y2="210" stroke="#8b949e" stroke-width="1.5"/>
      
      <!-- Stems for k = 0 to N-1 -->
      <line x1="80" y1="210" x2="80" y2="120" stroke="#38bdf8" stroke-width="3"/>
      <circle cx="80" cy="120" r="5" fill="#38bdf8"/>
      <text x="80" y="235" fill="#38bdf8" font-size="12" text-anchor="middle">a₀</text>

      <line x1="130" y1="210" x2="130" y2="80" stroke="#38bdf8" stroke-width="3"/>
      <circle cx="130" cy="80" r="5" fill="#38bdf8"/>
      <text x="130" y="235" fill="#38bdf8" font-size="12" text-anchor="middle">a₁</text>

      <line x1="180" y1="210" x2="180" y2="140" stroke="#38bdf8" stroke-width="3"/>
      <circle cx="180" cy="140" r="5" fill="#38bdf8"/>
      <text x="180" y="235" fill="#38bdf8" font-size="12" text-anchor="middle">a₂</text>

      <line x1="230" y1="210" x2="230" y2="170" stroke="#38bdf8" stroke-width="3"/>
      <circle cx="230" cy="170" r="5" fill="#38bdf8"/>
      <text x="230" y="235" fill="#38bdf8" font-size="12" text-anchor="middle">a_(N-1)</text>

      <!-- Repeat for next period -->
      <line x1="350" y1="210" x2="350" y2="120" stroke="#60a5fa" stroke-width="2.5" stroke-dasharray="2"/>
      <circle cx="350" cy="120" r="5" fill="#60a5fa"/>
      <text x="350" y="235" fill="#60a5fa" font-size="12" text-anchor="middle">a_N = a₀</text>

      <line x1="400" y1="210" x2="400" y2="80" stroke="#60a5fa" stroke-width="2.5" stroke-dasharray="2"/>
      <circle cx="400" cy="80" r="5" fill="#60a5fa"/>
      <text x="400" y="235" fill="#60a5fa" font-size="12" text-anchor="middle">a_(N+1) = a₁</text>

      <!-- Highlight fundamental block -->
      <rect x="55" y="50" width="200" height="150" fill="#38bdf8" fill-opacity="0.08" stroke="#38bdf8" stroke-dasharray="3"/>
      <text x="155" y="70" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle">N UNIQUE COEFFICIENTS</text>
    </g>

    <!-- Parseval's Power Relation -->
    <rect x="0" y="660" width="680" height="170" rx="12" fill="#161b22" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="25" y="695" fill="#fbbf24" font-size="19" font-weight="700">Parseval's Average Power Relation for DTFS</text>
    <text x="25" y="725" fill="#e6edf3" font-size="15">Average power computed in time equals sum of squared harmonic powers:</text>
    <rect x="25" y="740" width="630" height="55" rx="8" fill="#0d1117" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="340" y="777" fill="#fbbf24" font-size="22" font-weight="700" text-anchor="middle">P_avg = (1 / N) ∑_{n = 0}^{N - 1} |x[n]|² = ∑_{k = 0}^{N - 1} |a_k|²</text>

    <!-- Comparison Table Row -->
    <rect x="0" y="845" width="680" height="145" rx="10" fill="#0d1117" stroke="#38bdf8" stroke-width="1"/>
    <text x="25" y="875" fill="#38bdf8" font-size="16" font-weight="700">CTFS vs DTFS Core Duality</text>
    <text x="25" y="905" fill="#e6edf3" font-size="14">• CTFS: Continuous periodic signal x(t) ⟷ INFINITE harmonics c_k (k = -∞ to +∞)</text>
    <text x="25" y="930" fill="#34d399" font-size="14" font-weight="700">• DTFS: Discrete periodic sequence x[n] ⟷ EXACTLY N harmonics a_k (k = 0 to N-1)</text>
    <text x="25" y="955" fill="#8b949e" font-size="13">Zero truncation error in DTFS! It is an EXACT finite linear combination.</text>
  </g>

  <!-- Panel 3: DTFS Operational Properties & Diagnostic Traps -->
  <rect x="1600" y="190" width="720" height="1090" rx="18" fill="url(#panelGrad4)" stroke="#30363d" stroke-width="2"/>
  <rect x="1600" y="190" width="720" height="60" rx="18" fill="#21262d"/>
  <text x="1960" y="230" fill="#38bdf8" font-size="22" font-weight="700" text-anchor="middle">3. OPERATIONAL PROPERTIES &amp; TRAPS</text>

  <g transform="translate(1630, 270)">
    <!-- Property Cards -->
    <rect x="0" y="10" width="660" height="85" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
    <text x="20" y="40" fill="#38bdf8" font-size="16" font-weight="700">Time Shifting</text>
    <text x="20" y="70" fill="#e6edf3" font-size="17">x[n - n₀] ⟷ a_k · e⁻ʲᵏ(²ᵖⁱ/ᴺ)ⁿ⁰</text>

    <rect x="0" y="105" width="660" height="85" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
    <text x="20" y="135" fill="#38bdf8" font-size="16" font-weight="700">Frequency Shifting (Modulation)</text>
    <text x="20" y="165" fill="#e6edf3" font-size="17">eʲᵐ(²ᵖⁱ/ᴺ)ⁿ x[n] ⟷ a_(k - m)</text>

    <rect x="0" y="200" width="660" height="85" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
    <text x="20" y="230" fill="#38bdf8" font-size="16" font-weight="700">Time Reversal &amp; Conjugation</text>
    <text x="20" y="260" fill="#e6edf3" font-size="17">x[-n] ⟷ a_(-k) = a_(N - k),    x*[n] ⟷ a_*(-k) = a_*(N - k)</text>

    <rect x="0" y="295" width="660" height="95" rx="10" fill="#0d1117" stroke="#34d399" stroke-width="1.5"/>
    <text x="20" y="325" fill="#34d399" font-size="16" font-weight="700">Periodic Convolution</text>
    <text x="20" y="355" fill="#34d399" font-size="18" font-weight="700">∑_{m = ⟨N⟩} x₁[m] x₂[n - m] ⟷ N · a_k · b_k</text>
    <text x="20" y="378" fill="#fbbf24" font-size="12" font-weight="600">WARNING: Factor of N appears in periodic convolution!</text>

    <!-- Periodic Signal Filtering -->
    <rect x="0" y="400" width="660" height="150" rx="12" fill="#161b22" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="20" y="435" fill="#a78bfa" font-size="18" font-weight="700">Response of Discrete LTI System to Periodic Input</text>
    <text x="20" y="465" fill="#e6edf3" font-size="15">If x[n] with DTFS coefficients a_k enters LTI system with frequency response H(eʲᶿ):</text>
    <text x="20" y="495" fill="#a78bfa" font-size="18" font-weight="700">y[n] = ∑_{k = 0}^{N - 1} [a_k · H(eʲᵏ(²ᵖⁱ/ᴺ))] eʲᵏ(²ᵖⁱ/ᴺ)ⁿ</text>
    <text x="20" y="525" fill="#34d399" font-size="14" font-weight="600">Output DTFS coefficients: b_k = a_k · H(eʲ k 2π/N)</text>

    <!-- 3 Deadly Traps -->
    <rect x="0" y="565" width="660" height="425" rx="12" fill="#161b22" stroke="#f87171" stroke-width="1.5"/>
    <text x="20" y="600" fill="#f87171" font-size="19" font-weight="700">3 Deadly GATE DTFS Traps</text>

    <g transform="translate(20, 620)">
      <rect x="0" y="0" width="620" height="95" rx="8" fill="#0d1117" stroke="#f87171" stroke-width="1"/>
      <text x="15" y="25" fill="#f87171" font-size="15" font-weight="700">TRAP 1: Forgetting Index Modulo-N Wrapping</text>
      <text x="15" y="50" fill="#e6edf3" font-size="13">Inverting x[-n] leads to a_(-k). Many students leave index negative.</text>
      <text x="15" y="75" fill="#34d399" font-size="13" font-weight="600">SAFEGUARD: a_(-k) ≡ a_(N - k). E.g. for N=8, a_(-2) = a_6!</text>

      <rect x="0" y="105" width="620" height="95" rx="8" fill="#0d1117" stroke="#f87171" stroke-width="1"/>
      <text x="15" y="25" fill="#f87171" font-size="15" font-weight="700">TRAP 2: Using Continuous Formulas for Discrete Period</text>
      <text x="15" y="50" fill="#e6edf3" font-size="13">Assuming cos(0.2 π n) has period 2π/0.2π = 10, but cos(0.3 π n) period is NOT 2/0.3 = 6.67!</text>
      <text x="15" y="75" fill="#fbbf24" font-size="13" font-weight="600">SAFEGUARD: N must be INTEGER! Ω₀/2π = 0.3/2 = 3/20 ⟹ N = 20 samples!</text>

      <rect x="0" y="210" width="620" height="95" rx="8" fill="#0d1117" stroke="#f87171" stroke-width="1"/>
      <text x="15" y="25" fill="#f87171" font-size="15" font-weight="700">TRAP 3: Dividing by 2π Instead of N</text>
      <text x="15" y="50" fill="#e6edf3" font-size="13">Mixing up DTFT synthesis (1/2π integral) with DTFS analysis (1/N sum).</text>
      <text x="15" y="75" fill="#38bdf8" font-size="13" font-weight="600">SAFEGUARD: DTFS uses discrete sums divided by period N: a_k = (1/N) ∑ x[n] W_N^{kn}!</text>
    </g>
  </g>
</svg>