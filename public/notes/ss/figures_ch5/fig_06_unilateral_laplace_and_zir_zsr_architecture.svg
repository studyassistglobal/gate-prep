
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350" width="2400" height="1350" style="background:#0d1117; font-family:'Inter', system-ui, sans-serif;">
  <defs>
    <pattern id="grid6" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262d" stroke-width="1" stroke-opacity="0.6"/>
    </pattern>
    <linearGradient id="panelGrad6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.98"/>
    </linearGradient>
  </defs>

  <rect width="2400" height="1350" fill="#0d1117"/>
  <rect width="2400" height="1350" fill="url(#grid6)"/>

  <!-- Title Header -->
  <rect x="80" y="50" width="2240" height="110" rx="16" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="120" y="105" fill="#38bdf8" font-size="34" font-weight="700" letter-spacing="1.5">SIGNALS &amp; SYSTEMS • CHAPTER 05 • FIGURE 5.6</text>
  <text x="120" y="142" fill="#8b949e" font-size="20">Unilateral Laplace Transform (ULT) Architecture: Lower Limit 0⁻, Initial Condition Injection &amp; ZIR / ZSR Decomposition</text>
  <rect x="2020" y="75" width="260" height="58" rx="10" fill="#21262d" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="2150" y="112" fill="#fbbf24" font-size="20" font-weight="600" text-anchor="middle">PREPFUSION TITANS</text>

  <!-- Panel 1: The 0^- Boundary & Differentiation Engine -->
  <g transform="translate(80, 190)">
    <rect width="1080" height="1090" rx="16" fill="url(#panelGrad6)" stroke="#38bdf8" stroke-width="2"/>
    <rect width="1080" height="60" rx="16" fill="#21262d"/>
    <text x="540" y="38" fill="#38bdf8" font-size="22" font-weight="700" text-anchor="middle">1. THE UNILATERAL DEFINITION &amp; INITIAL CONDITION INJECTION</text>

    <!-- Definition block -->
    <g transform="translate(40, 90)">
      <text x="0" y="0" fill="#e6edf3" font-size="18" font-weight="600">Definition of Unilateral (One-Sided) Laplace Transform:</text>
      <rect x="0" y="20" width="1000" height="85" rx="10" fill="#0d1117" stroke="#38bdf8" stroke-width="2"/>
      <text x="500" y="72" fill="#38bdf8" font-size="26" font-weight="800" text-anchor="middle">X_u(s) = L_u{ x(t) } = ∫_{0⁻}^{∞} x(t) e^{-st} dt</text>

      <!-- Why 0^- callout -->
      <rect x="0" y="130" width="1000" height="120" rx="10" fill="#161b22" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="25" y="165" fill="#fbbf24" font-size="18" font-weight="700">WHY 0⁻ IS MANDATORY (THE GATE DIRAC IMPULSE TRAP):</text>
      <text x="25" y="195" fill="#e6edf3" font-size="15">Setting lower limit to 0⁺ would miss Dirac impulses at t = 0: ∫_{0⁺}^∞ δ(t)dt = 0 (INCORRECT!).</text>
      <text x="25" y="225" fill="#34d399" font-size="15" font-weight="600">With 0⁻: ∫_{0⁻}^∞ δ(t)dt = 1, ensuring L_u{δ(t)} = 1 and correctly capturing boundary initial switching energy!</text>

      <!-- Differentiation Rules -->
      <text x="0" y="285" fill="#34d399" font-size="20" font-weight="700">Unilateral Differentiation Theorems (Injecting Initial Conditions):</text>

      <!-- 1st derivative -->
      <rect x="0" y="310" width="1000" height="100" rx="10" fill="#0d1117" stroke="#34d399" stroke-width="1.5"/>
      <text x="30" y="350" fill="#fbbf24" font-size="18" font-weight="700">First Derivative:</text>
      <text x="30" y="385" fill="#34d399" font-size="22" font-weight="800">L_u{ dx(t)/dt } = s X_u(s) - x(0⁻)</text>
      <text x="650" y="365" fill="#8b949e" font-size="14">Initial capacitor voltage /</text>
      <text x="650" y="388" fill="#8b949e" font-size="14">initial displacement: x(0⁻)</text>

      <!-- 2nd derivative -->
      <rect x="0" y="430" width="1000" height="110" rx="10" fill="#0d1117" stroke="#34d399" stroke-width="1.5"/>
      <text x="30" y="470" fill="#fbbf24" font-size="18" font-weight="700">Second Derivative:</text>
      <text x="30" y="510" fill="#34d399" font-size="22" font-weight="800">L_u{ d²x(t)/dt² } = s² X_u(s) - s x(0⁻) - x'(0⁻)</text>
      <text x="650" y="485" fill="#8b949e" font-size="14">x'(0⁻) is initial derivative /</text>
      <text x="650" y="508" fill="#8b949e" font-size="14">initial inductor voltage rate</text>

      <!-- nth derivative general -->
      <rect x="0" y="560" width="1000" height="105" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
      <text x="30" y="600" fill="#fbbf24" font-size="18" font-weight="700">General n-th Derivative Master Formula:</text>
      <text x="30" y="640" fill="#38bdf8" font-size="21" font-weight="800">L_u{ dⁿx/dtⁿ } = sⁿ X_u(s) - ∑_{k=1}^{n} s^{n-k} x^{(k-1)}(0⁻)</text>

      <!-- Integration rule -->
      <rect x="0" y="685" width="1000" height="95" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <text x="30" y="725" fill="#fbbf24" font-size="18" font-weight="700">Unilateral Integration Theorem:</text>
      <text x="30" y="760" fill="#e6edf3" font-size="20" font-weight="700">L_u{ ∫_{0⁻}^{t} x(τ) dτ } = X_u(s) / s</text>
      <text x="600" y="745" fill="#8b949e" font-size="14">Zero accumulated history at t = 0⁻</text>
    </g>
  </g>

  <!-- Panel 2: Total Response = ZIR + ZSR Decomposition -->
  <g transform="translate(1200, 190)">
    <rect width="1120" height="1090" rx="16" fill="url(#panelGrad6)" stroke="#fbbf24" stroke-width="2"/>
    <rect width="1120" height="60" rx="16" fill="#21262d"/>
    <text x="560" y="38" fill="#fbbf24" font-size="22" font-weight="700" text-anchor="middle">2. TOTAL RESPONSE = ZIR + ZSR DECOMPOSITION ENGINE</text>

    <g transform="translate(40, 90)">
      <text x="0" y="0" fill="#e6edf3" font-size="18" font-weight="600">Consider an n-th Order Linear Differential Equation with Initial Conditions:</text>
      
      <rect x="0" y="20" width="1040" height="70" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
      <text x="520" y="62" fill="#e6edf3" font-size="19" font-weight="700" text-anchor="middle">a_n y^{(n)}(t) + ... + a₀ y(t) = b_m x^{(m)}(t) + ... + b₀ x(t)</text>

      <text x="0" y="125" fill="#fbbf24" font-size="18" font-weight="700">Taking Unilateral Laplace Transform on Both Sides:</text>
      <rect x="0" y="145" width="1040" height="90" rx="10" fill="#161b22" stroke="#fbbf24" stroke-width="2"/>
      <text x="520" y="185" fill="#e6edf3" font-size="18" text-anchor="middle">A(s) Y(s) - C(s) = B(s) X(s)</text>
      <text x="520" y="215" fill="#fbbf24" font-size="19" font-weight="800" text-anchor="middle">⇒ Y(s) = [ C(s) / A(s) ] + [ B(s) / A(s) ] · X(s)</text>

      <!-- The Grand Decomposition Diagram -->
      <g transform="translate(20, 260)">
        <rect width="1000" height="340" rx="14" fill="#0d1117" stroke="#38bdf8" stroke-width="2"/>
        
        <!-- Total Response Box -->
        <rect x="360" y="20" width="280" height="60" rx="10" fill="#21262d" stroke="#38bdf8" stroke-width="2"/>
        <text x="500" y="58" fill="#38bdf8" font-size="22" font-weight="800" text-anchor="middle">TOTAL RESPONSE: Y(s)</text>

        <!-- Downward Fork -->
        <line x1="440" y1="80" x2="220" y2="130" stroke="#38bdf8" stroke-width="2.5"/>
        <line x1="560" y1="80" x2="780" y2="130" stroke="#38bdf8" stroke-width="2.5"/>

        <!-- ZIR Box (Left) -->
        <rect x="40" y="130" width="420" height="180" rx="12" fill="#161b22" stroke="#34d399" stroke-width="2"/>
        <text x="250" y="165" fill="#34d399" font-size="20" font-weight="800" text-anchor="middle">ZERO-INPUT RESPONSE (ZIR)</text>
        <text x="250" y="195" fill="#34d399" font-size="22" font-weight="800" text-anchor="middle">Y_{ZIR}(s) = C(s) / A(s)</text>
        <line x1="60" y1="215" x2="440" y2="215" stroke="#30363d" stroke-width="1"/>
        <text x="250" y="240" fill="#e6edf3" font-size="14" text-anchor="middle">• Driven SOLELY by initial conditions C(s)</text>
        <text x="250" y="265" fill="#e6edf3" font-size="14" text-anchor="middle">• Input is set to zero: x(t) = 0</text>
        <text x="250" y="290" fill="#fbbf24" font-size="14" font-weight="600" text-anchor="middle">• Natural / Free Response Modes of system</text>

        <!-- ZSR Box (Right) -->
        <rect x="540" y="130" width="420" height="180" rx="12" fill="#161b22" stroke="#60a5fa" stroke-width="2"/>
        <text x="750" y="165" fill="#60a5fa" font-size="20" font-weight="800" text-anchor="middle">ZERO-STATE RESPONSE (ZSR)</text>
        <text x="750" y="195" fill="#60a5fa" font-size="22" font-weight="800" text-anchor="middle">Y_{ZSR}(s) = H(s) · X(s)</text>
        <line x1="560" y1="215" x2="940" y2="215" stroke="#30363d" stroke-width="1"/>
        <text x="750" y="240" fill="#e6edf3" font-size="14" text-anchor="middle">• Driven SOLELY by external input X(s)</text>
        <text x="750" y="265" fill="#e6edf3" font-size="14" text-anchor="middle">• Initial state is relaxed: y(0⁻) = 0, y'(0⁻) = 0</text>
        <text x="750" y="290" fill="#fbbf24" font-size="14" font-weight="600" text-anchor="middle">• Forced Response + Zero-state natural modes</text>
      </g>

      <!-- Transient vs Steady-State Note -->
      <rect x="0" y="630" width="1040" height="150" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <text x="30" y="665" fill="#fbbf24" font-size="18" font-weight="700">ALTERNATIVE DECOMPOSITION: TRANSIENT VS. STEADY-STATE</text>
      <text x="30" y="695" fill="#e6edf3" font-size="15">Total response can ALSO be partitioned into Transient (modes decaying to 0) + Steady-State (as t → ∞):</text>
      <text x="30" y="725" fill="#38bdf8" font-size="16" font-weight="600">y(t) = y_{tr}(t) + y_{ss}(t)</text>
      <text x="30" y="755" fill="#8b949e" font-size="14">Note: ZIR is NOT identical to Transient, and ZSR is NOT identical to Steady-State!</text>
    </g>
  </g>
</svg>
