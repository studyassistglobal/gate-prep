
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350" width="2400" height="1350" style="background:#0d1117; font-family:'Inter', system-ui, sans-serif;">
  <defs>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262d" stroke-width="1" stroke-opacity="0.6"/>
    </pattern>
    <linearGradient id="panelGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.98"/>
    </linearGradient>
  </defs>

  <rect width="2400" height="1350" fill="#0d1117"/>
  <rect width="2400" height="1350" fill="url(#grid2)"/>

  <!-- Title Header Block -->
  <rect x="80" y="50" width="2240" height="110" rx="16" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="120" y="105" fill="#38bdf8" font-size="34" font-weight="700" letter-spacing="1.5">SIGNALS &amp; SYSTEMS • CHAPTER 06 • FIGURE 6.2</text>
  <text x="120" y="142" fill="#8b949e" font-size="20">Region of Convergence (ROC) Anatomy: Concentric Annuli, Boundary Poles, and the 8 Invariant Topological Laws</text>
  <rect x="2020" y="75" width="260" height="58" rx="10" fill="#21262d" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="2150" y="112" fill="#fbbf24" font-size="20" font-weight="600" text-anchor="middle">PREPFUSION TITANS</text>

  <!-- Left: 4 Visual ROC Topologies -->
  <rect x="80" y="190" width="1080" height="1090" rx="18" fill="url(#panelGrad2)" stroke="#30363d" stroke-width="2"/>
  <rect x="80" y="190" width="1080" height="60" rx="18" fill="#21262d"/>
  <text x="620" y="230" fill="#38bdf8" font-size="22" font-weight="700" text-anchor="middle">THE 4 CANONICAL ROC TOPOLOGIES IN THE z-PLANE</text>

  <g transform="translate(110, 270)">
    <!-- Top-Left: Right-Sided (Causal) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="500" height="470" rx="12" fill="#0d1117" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="250" y="35" fill="#38bdf8" font-size="18" font-weight="700" text-anchor="middle">A. RIGHT-SIDED / CAUSAL SEQUENCE</text>
      <text x="250" y="60" fill="#8b949e" font-size="14" text-anchor="middle">x[n] = aⁿ u[n] ⟶ ROC: |z| &gt; |a|</text>
      
      <!-- Coordinate graphic -->
      <g transform="translate(250, 250)">
        <!-- Outer shaded ROC (exterior of |a|) -->
        <rect x="-220" y="-170" width="440" height="340" fill="#38bdf8" fill-opacity="0.15"/>
        <circle cx="0" cy="0" r="75" fill="#0d1117"/> <!-- punch out hole -->
        <!-- axes -->
        <line x1="0" y1="-165" x2="0" y2="165" stroke="#30363d" stroke-width="1.5"/>
        <line x1="-215" y1="0" x2="215" y2="0" stroke="#30363d" stroke-width="1.5"/>
        <!-- Unit circle -->
        <circle cx="0" cy="0" r="120" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4,4"/>
        <text x="85" y="-90" fill="#8b949e" font-size="12">Unit Circle (|z|=1)</text>
        <!-- Pole circle |z| = |a| -->
        <circle cx="0" cy="0" r="75" fill="none" stroke="#f87171" stroke-width="2.5" stroke-dasharray="6,4"/>
        <!-- Pole 'X' at z = a -->
        <line x1="68" y1="-7" x2="82" y2="7" stroke="#f87171" stroke-width="3"/>
        <line x1="82" y1="-7" x2="68" y2="7" stroke="#f87171" stroke-width="3"/>
        <text x="90" y="5" fill="#f87171" font-size="14" font-weight="700">p = a</text>
        <circle cx="0" cy="0" r="4" fill="#fbbf24"/> <!-- Zero at origin -->
        <circle cx="0" cy="0" r="7" fill="none" stroke="#fbbf24" stroke-width="2"/>
        <text x="12" y="15" fill="#fbbf24" font-size="12">z = 0</text>
        <text x="130" y="70" fill="#38bdf8" font-size="16" font-weight="700">ROC: |z| &gt; |a|</text>
      </g>
      <text x="250" y="445" fill="#34d399" font-size="14" font-weight="600" text-anchor="middle">Exterior of circle containing outermost pole. Extends to z = ∞!</text>
    </g>

    <!-- Top-Right: Left-Sided (Anti-Causal) -->
    <g transform="translate(520, 0)">
      <rect x="0" y="0" width="500" height="470" rx="12" fill="#0d1117" stroke="#f87171" stroke-width="1.5"/>
      <text x="250" y="35" fill="#f87171" font-size="18" font-weight="700" text-anchor="middle">B. LEFT-SIDED / ANTI-CAUSAL SEQUENCE</text>
      <text x="250" y="60" fill="#8b949e" font-size="14" text-anchor="middle">x[n] = -aⁿ u[-n-1] ⟶ ROC: |z| &lt; |a|</text>
      
      <!-- Coordinate graphic -->
      <g transform="translate(250, 250)">
        <!-- Inside shaded ROC (interior of |a|) -->
        <circle cx="0" cy="0" r="105" fill="#f87171" fill-opacity="0.18"/>
        <!-- axes -->
        <line x1="0" y1="-165" x2="0" y2="165" stroke="#30363d" stroke-width="1.5"/>
        <line x1="-215" y1="0" x2="215" y2="0" stroke="#30363d" stroke-width="1.5"/>
        <!-- Unit circle -->
        <circle cx="0" cy="0" r="135" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4,4"/>
        <text x="95" y="-105" fill="#8b949e" font-size="12">Unit Circle (|z|=1)</text>
        <!-- Pole circle |z| = |a| -->
        <circle cx="0" cy="0" r="105" fill="none" stroke="#f87171" stroke-width="2.5" stroke-dasharray="6,4"/>
        <!-- Pole 'X' at z = a -->
        <line x1="97" y1="-7" x2="113" y2="7" stroke="#f87171" stroke-width="3"/>
        <line x1="113" y1="-7" x2="97" y2="7" stroke="#f87171" stroke-width="3"/>
        <text x="120" y="5" fill="#f87171" font-size="14" font-weight="700">p = a</text>
        <!-- Origin zero -->
        <circle cx="0" cy="0" r="6" fill="none" stroke="#fbbf24" stroke-width="2"/>
        <text x="0" y="30" fill="#f87171" font-size="16" font-weight="700" text-anchor="middle">ROC: |z| &lt; |a|</text>
      </g>
      <text x="250" y="445" fill="#f87171" font-size="14" font-weight="600" text-anchor="middle">Interior of circle containing innermost pole. Extends to z = 0!</text>
    </g>

    <!-- Bottom-Left: Two-Sided (Annular Ring) -->
    <g transform="translate(0, 500)">
      <rect x="0" y="0" width="500" height="480" rx="12" fill="#0d1117" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="250" y="35" fill="#fbbf24" font-size="18" font-weight="700" text-anchor="middle">C. TWO-SIDED SEQUENCE (ANNULAR RING)</text>
      <text x="250" y="60" fill="#8b949e" font-size="14" text-anchor="middle">x[n] = aⁿ u[n] + bⁿ u[-n-1] (|a| &lt; |b|) ⟶ |a| &lt; |z| &lt; |b|</text>
      
      <!-- Coordinate graphic -->
      <g transform="translate(250, 255)">
        <!-- Annular ring shaded -->
        <circle cx="0" cy="0" r="120" fill="#fbbf24" fill-opacity="0.2"/>
        <circle cx="0" cy="0" r="60" fill="#0d1117"/> <!-- inner cutout -->
        <!-- axes -->
        <line x1="0" y1="-165" x2="0" y2="165" stroke="#30363d" stroke-width="1.5"/>
        <line x1="-215" y1="0" x2="215" y2="0" stroke="#30363d" stroke-width="1.5"/>
        <!-- Inner pole circle |a| -->
        <circle cx="0" cy="0" r="60" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6,4"/>
        <!-- Outer pole circle |b| -->
        <circle cx="0" cy="0" r="120" fill="none" stroke="#f87171" stroke-width="2.5" stroke-dasharray="6,4"/>
        <!-- Inner pole -->
        <line x1="53" y1="-7" x2="67" y2="7" stroke="#38bdf8" stroke-width="3"/>
        <line x1="67" y1="-7" x2="53" y2="7" stroke="#38bdf8" stroke-width="3"/>
        <text x="40" y="-15" fill="#38bdf8" font-size="13" font-weight="700">|a|</text>
        <!-- Outer pole -->
        <line x1="113" y1="-7" x2="127" y2="7" stroke="#f87171" stroke-width="3"/>
        <line x1="127" y1="-7" x2="113" y2="7" stroke="#f87171" stroke-width="3"/>
        <text x="135" y="5" fill="#f87171" font-size="13" font-weight="700">|b|</text>
        <text x="0" y="90" fill="#fbbf24" font-size="16" font-weight="700" text-anchor="middle">ROC: |a| &lt; |z| &lt; |b|</text>
      </g>
      <text x="250" y="455" fill="#fbbf24" font-size="14" font-weight="600" text-anchor="middle">Annular ring bounded by poles. If |a| &gt; |b|, ROC is EMPTY (No Transform)!</text>
    </g>

    <!-- Bottom-Right: Finite Duration -->
    <g transform="translate(520, 500)">
      <rect x="0" y="0" width="500" height="480" rx="12" fill="#0d1117" stroke="#34d399" stroke-width="1.5"/>
      <text x="250" y="35" fill="#34d399" font-size="18" font-weight="700" text-anchor="middle">D. FINITE-DURATION SEQUENCE</text>
      <text x="250" y="60" fill="#8b949e" font-size="14" text-anchor="middle">x[n] non-zero only for N₁ ≤ n ≤ N₂</text>
      
      <!-- Coordinate graphic -->
      <g transform="translate(250, 255)">
        <!-- Entire plane shaded -->
        <rect x="-215" y="-165" width="430" height="330" fill="#34d399" fill-opacity="0.15"/>
        <!-- axes -->
        <line x1="0" y1="-165" x2="0" y2="165" stroke="#30363d" stroke-width="1.5"/>
        <line x1="-215" y1="0" x2="215" y2="0" stroke="#30363d" stroke-width="1.5"/>
        <!-- Unit circle -->
        <circle cx="0" cy="0" r="100" fill="none" stroke="#38bdf8" stroke-width="2"/>
        <text x="70" y="-75" fill="#38bdf8" font-size="12">Unit Circle ⊆ ROC</text>
        <!-- Origin dot -->
        <circle cx="0" cy="0" r="6" fill="#f87171"/>
        <text x="15" y="20" fill="#f87171" font-size="12" font-weight="700">z = 0 (?)</text>
        <text x="0" y="130" fill="#34d399" font-size="16" font-weight="700" text-anchor="middle">ROC: ENTIRE z-PLANE</text>
      </g>
      <text x="250" y="445" fill="#e6edf3" font-size="13" text-anchor="middle">• Causal (N₁ ≥ 0): Entire plane except z = 0</text>
      <text x="250" y="465" fill="#e6edf3" font-size="13" text-anchor="middle">• Anti-causal (N₂ ≤ 0): Entire plane except z = ∞</text>
    </g>
  </g>

  <!-- Right: The 8 Invariant Laws of ROC Matrix -->
  <rect x="1190" y="190" width="1130" height="1090" rx="18" fill="url(#panelGrad2)" stroke="#30363d" stroke-width="2"/>
  <rect x="1190" y="190" width="1130" height="60" rx="18" fill="#21262d"/>
  <text x="1755" y="230" fill="#fbbf24" font-size="22" font-weight="700" text-anchor="middle">THE 8 INVARIANT TOPOLOGICAL LAWS OF Z-TRANSFORM ROC</text>

  <g transform="translate(1220, 270)">
    <!-- Law 1 -->
    <rect x="0" y="0" width="1070" height="100" rx="10" fill="#0d1117" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="25" y="32" fill="#38bdf8" font-size="17" font-weight="700">LAW 1: ROC IS A RING OR DISK CENTERED AT THE ORIGIN</text>
    <text x="25" y="60" fill="#e6edf3" font-size="15">The ROC consists of an annular ring in the z-plane centered at z = 0:  <tspan fill="#38bdf8" font-weight="700">r_min &lt; |z| &lt; r_max</tspan>.</text>
    <text x="25" y="85" fill="#8b949e" font-size="14">Because convergence depends only on magnitude r = |z| (i.e. ∑|x[n]|r⁻ⁿ &lt; ∞), never on phase angle Ω.</text>

    <!-- Law 2 -->
    <rect x="0" y="115" width="1070" height="100" rx="10" fill="#0d1117" stroke="#f87171" stroke-width="1.5"/>
    <text x="25" y="147" fill="#f87171" font-size="17" font-weight="700">LAW 2: THE ROC CAN NEVER CONTAIN ANY POLES</text>
    <text x="25" y="175" fill="#e6edf3" font-size="15">A pole is a singularity where X(z) ⟶ ∞. By absolute definition, the Laurent/power series diverges at a pole.</text>
    <text x="25" y="200" fill="#f87171" font-size="14" font-weight="600">Poles act as impenetrable boundary walls defining the outer and inner circular rims of the ROC!</text>

    <!-- Law 3 -->
    <rect x="0" y="230" width="1070" height="110" rx="10" fill="#0d1117" stroke="#34d399" stroke-width="1.5"/>
    <text x="25" y="262" fill="#34d399" font-size="17" font-weight="700">LAW 3: FINITE-DURATION SEQUENCES CONVERGE EVERYWHERE</text>
    <text x="25" y="290" fill="#e6edf3" font-size="15">If x[n] has finite length N₁ ≤ n ≤ N₂, ROC is the <tspan fill="#34d399" font-weight="700">ENTIRE z-PLANE</tspan>, except possibly z = 0 and/or z = ∞:</text>
    <text x="25" y="315" fill="#8b949e" font-size="14">• If N₂ &gt; 0 (contains positive n powers like z⁻¹): ROC excludes z = 0.  • If N₁ &lt; 0 (contains z⁺¹): excludes z = ∞.</text>

    <!-- Law 4 -->
    <rect x="0" y="355" width="1070" height="100" rx="10" fill="#0d1117" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="25" y="387" fill="#38bdf8" font-size="17" font-weight="700">LAW 4: RIGHT-SIDED SEQUENCES EXTEND OUTWARD TO INFINITY</text>
    <text x="25" y="415" fill="#e6edf3" font-size="15">If x[n] is right-sided (x[n] = 0 for n &lt; N₁), ROC extends outward from the outermost pole to z = ∞:</text>
    <text x="25" y="440" fill="#38bdf8" font-size="14" font-weight="700">ROC: |z| &gt; r_max = max_k |p_k|. If causal (N₁ ≥ 0), ROC includes the point z = ∞.</text>

    <!-- Law 5 -->
    <rect x="0" y="470" width="1070" height="100" rx="10" fill="#0d1117" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="25" y="502" fill="#fbbf24" font-size="17" font-weight="700">LAW 5: LEFT-SIDED SEQUENCES EXTEND INWARD TO THE ORIGIN</text>
    <text x="25" y="530" fill="#e6edf3" font-size="15">If x[n] is left-sided (x[n] = 0 for n &gt; N₂), ROC extends inward from the innermost pole to z = 0:</text>
    <text x="25" y="555" fill="#fbbf24" font-size="14" font-weight="700">ROC: |z| &lt; r_min = min_k |p_k|. If strictly anti-causal (N₂ ≤ 0), ROC includes the point z = 0.</text>

    <!-- Law 6 -->
    <rect x="0" y="585" width="1070" height="100" rx="10" fill="#0d1117" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="25" y="617" fill="#a78bfa" font-size="17" font-weight="700">LAW 6: TWO-SIDED SEQUENCES FORM A BOUNDED OPEN RING</text>
    <text x="25" y="645" fill="#e6edf3" font-size="15">If x[n] is infinite in both directions, ROC is an open annular ring: <tspan fill="#a78bfa" font-weight="700">|p_right| &lt; |z| &lt; |p_left|</tspan>.</text>
    <text x="25" y="670" fill="#f87171" font-size="14" font-weight="600">CRITICAL: If |p_right| ≥ |p_left|, the rings do not overlap ⟶ ROC is EMPTY ⟶ Z-Transform DOES NOT EXIST!</text>

    <!-- Law 7 -->
    <rect x="0" y="700" width="1070" height="100" rx="10" fill="#0d1117" stroke="#34d399" stroke-width="1.5"/>
    <text x="25" y="732" fill="#34d399" font-size="17" font-weight="700">LAW 7: LTI SYSTEM CAUSALITY ⟺ OUTWARD ROC (EXTERIOR TO ALL POLES)</text>
    <text x="25" y="760" fill="#e6edf3" font-size="15">An LTI system is causal iff h[n] is causal ⟺ ROC of H(z) is exterior to outermost pole, including z = ∞.</text>
    <text x="25" y="785" fill="#34d399" font-size="14" font-weight="600">For rational H(z), numerator polynomial degree in z cannot exceed denominator degree (proper transfer function).</text>

    <!-- Law 8 -->
    <rect x="0" y="815" width="1070" height="145" rx="10" fill="#0d1117" stroke="#38bdf8" stroke-width="2"/>
    <text x="25" y="847" fill="#38bdf8" font-size="17" font-weight="700">LAW 8: LTI SYSTEM BIBO STABILITY ⟺ ROC ENCLOSES THE UNIT CIRCLE</text>
    <text x="25" y="875" fill="#e6edf3" font-size="15">An LTI system is bounded-input bounded-output (BIBO) stable (∑|h[n]| &lt; ∞) iff <tspan fill="#38bdf8" font-weight="700">ROC INCLUDES |z| = 1</tspan>.</text>
    <text x="25" y="905" fill="#fbbf24" font-size="15" font-weight="700">THE SUPREME GATE UNIFIED THEOREM: CAUSAL + STABLE LTI SYSTEM</text>
    <text x="25" y="935" fill="#34d399" font-size="15" font-weight="700">ALL poles of H(z) must lie strictly INSIDE the Unit Circle: |p_k| &lt; 1 for all k = 1, 2, ..., N!</text>
  </g>
</svg>
