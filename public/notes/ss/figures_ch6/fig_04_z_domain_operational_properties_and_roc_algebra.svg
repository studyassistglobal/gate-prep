
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350" width="2400" height="1350" style="background:#0d1117; font-family:'Inter', system-ui, sans-serif;">
  <defs>
    <pattern id="grid4" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262d" stroke-width="1" stroke-opacity="0.6"/>
    </pattern>
    <linearGradient id="panelGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.98"/>
    </linearGradient>
  </defs>

  <rect width="2400" height="1350" fill="#0d1117"/>
  <rect width="2400" height="1350" fill="url(#grid4)"/>

  <!-- Title Header Block -->
  <rect x="80" y="50" width="2240" height="110" rx="16" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="120" y="105" fill="#38bdf8" font-size="34" font-weight="700" letter-spacing="1.5">SIGNALS &amp; SYSTEMS • CHAPTER 06 • FIGURE 6.4</text>
  <text x="120" y="142" fill="#8b949e" font-size="20">Operational Properties Matrix &amp; Exact Algebraic Transformation of ROCs in the Complex z-Domain</text>
  <rect x="2020" y="75" width="260" height="58" rx="10" fill="#21262d" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="2150" y="112" fill="#fbbf24" font-size="20" font-weight="600" text-anchor="middle">PREPFUSION TITANS</text>

  <!-- Master Table of 8 Operations -->
  <rect x="80" y="190" width="2240" height="1090" rx="18" fill="url(#panelGrad4)" stroke="#30363d" stroke-width="2"/>
  
  <!-- Table Header -->
  <rect x="80" y="190" width="2240" height="65" rx="18" fill="#21262d"/>
  <text x="120" y="232" fill="#8b949e" font-size="16" font-weight="700">PROPERTY NAME</text>
  <text x="450" y="232" fill="#38bdf8" font-size="16" font-weight="700">TIME-DOMAIN SEQUENCE x[n]</text>
  <text x="1050" y="232" fill="#fbbf24" font-size="16" font-weight="700">Z-DOMAIN TRANSFORM X(z)</text>
  <text x="1600" y="232" fill="#34d399" font-size="16" font-weight="700">EXACT ROC BEHAVIOR &amp; BOUNDS</text>

  <!-- Property Rows -->
  <g transform="translate(100, 270)">
    <!-- Row 1: Linearity -->
    <rect x="0" y="0" width="2200" height="105" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="20" y="45" fill="#38bdf8" font-size="18" font-weight="700">1. Linearity</text>
    <text x="20" y="75" fill="#8b949e" font-size="13">Superposition Principle</text>
    <text x="350" y="55" fill="#e6edf3" font-size="18">a₁ x₁[n] + a₂ x₂[n]</text>
    <text x="950" y="55" fill="#fbbf24" font-size="18" font-weight="700">a₁ X₁(z) + a₂ X₂(z)</text>
    <text x="1500" y="45" fill="#34d399" font-size="16" font-weight="700">ROC ⊇ R₁ ∩ R₂</text>
    <text x="1500" y="75" fill="#f87171" font-size="13" font-weight="600">TRAP: ROC can EXPAND if pole-zero cancellation eliminates boundary pole!</text>

    <!-- Row 2: Time Shifting -->
    <rect x="0" y="120" width="2200" height="105" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="20" y="165" fill="#38bdf8" font-size="18" font-weight="700">2. Time Shifting</text>
    <text x="20" y="195" fill="#8b949e" font-size="13">Delay or Advance</text>
    <text x="350" y="175" fill="#e6edf3" font-size="18">x[n - n₀]</text>
    <text x="950" y="175" fill="#fbbf24" font-size="18" font-weight="700">z⁻ⁿ⁰ X(z)</text>
    <text x="1500" y="165" fill="#34d399" font-size="16" font-weight="700">ROC = R_x (Except possibly z=0 or z=∞)</text>
    <text x="1500" y="195" fill="#8b949e" font-size="13">If n₀ &gt; 0 (delay), may add pole at z=0. If n₀ &lt; 0 (advance), may add pole at z=∞.</text>

    <!-- Row 3: Frequency Scaling / Modulation -->
    <rect x="0" y="240" width="2200" height="105" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="20" y="285" fill="#38bdf8" font-size="18" font-weight="700">3. Scaling in z-Domain</text>
    <text x="20" y="315" fill="#8b949e" font-size="13">Exponential Weighting</text>
    <text x="350" y="295" fill="#e6edf3" font-size="18">z₀ⁿ x[n]</text>
    <text x="950" y="295" fill="#fbbf24" font-size="18" font-weight="700">X(z / z₀)</text>
    <text x="1500" y="285" fill="#34d399" font-size="16" font-weight="700">ROC = |z₀| · R_x</text>
    <text x="1500" y="315" fill="#8b949e" font-size="13">If r₁ &lt; |z| &lt; r₂, new ROC is |z₀|r₁ &lt; |z| &lt; |z₀|r₂. Angle rotated by ∠z₀.</text>

    <!-- Row 4: Time Reversal -->
    <rect x="0" y="360" width="2200" height="105" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="20" y="405" fill="#38bdf8" font-size="18" font-weight="700">4. Time Reversal</text>
    <text x="20" y="435" fill="#8b949e" font-size="13">Circle Inversion</text>
    <text x="350" y="415" fill="#e6edf3" font-size="18">x[-n]</text>
    <text x="950" y="415" fill="#fbbf24" font-size="18" font-weight="700">X(z⁻¹) = X(1 / z)</text>
    <text x="1500" y="405" fill="#34d399" font-size="16" font-weight="700">ROC = 1 / R_x = { z : 1/z ∈ R_x }</text>
    <text x="1500" y="435" fill="#fbbf24" font-size="13" font-weight="600">If r₁ &lt; |z| &lt; r₂, inverted ROC is (1/r₂) &lt; |z| &lt; (1/r₁). Right-sided becomes left-sided!</text>

    <!-- Row 5: Differentiation in z (Multiplication by n) -->
    <rect x="0" y="480" width="2200" height="105" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="20" y="525" fill="#38bdf8" font-size="18" font-weight="700">5. Differentiation in z</text>
    <text x="20" y="555" fill="#8b949e" font-size="13">Multiplication by n</text>
    <text x="350" y="535" fill="#e6edf3" font-size="18">n · x[n]</text>
    <text x="950" y="535" fill="#fbbf24" font-size="18" font-weight="700">-z · [ dX(z) / dz ]</text>
    <text x="1500" y="525" fill="#34d399" font-size="16" font-weight="700">ROC = R_x (ROC IS PRESERVED!)</text>
    <text x="1500" y="555" fill="#8b949e" font-size="13">Increases pole multiplicity by 1 at existing poles. May alter convergence at z=0 or ∞.</text>

    <!-- Row 6: Time Expansion (Upsampling) -->
    <rect x="0" y="600" width="2200" height="105" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="20" y="645" fill="#38bdf8" font-size="18" font-weight="700">6. Time Expansion</text>
    <text x="20" y="675" fill="#8b949e" font-size="13">k-fold Upsampling</text>
    <text x="350" y="655" fill="#e6edf3" font-size="18">x_{(k)}[n]  (zeros between samples)</text>
    <text x="950" y="655" fill="#fbbf24" font-size="18" font-weight="700">X(zᵏ)</text>
    <text x="1500" y="645" fill="#34d399" font-size="16" font-weight="700">ROC = R_x^{1/k}</text>
    <text x="1500" y="675" fill="#8b949e" font-size="13">Radical expansion: r₁^{1/k} &lt; |z| &lt; r₂^{1/k}. Every pole p_i spawns k symmetric poles!</text>

    <!-- Row 7: Convolution in Time -->
    <rect x="0" y="720" width="2200" height="105" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="20" y="765" fill="#38bdf8" font-size="18" font-weight="700">7. Convolution in Time</text>
    <text x="20" y="795" fill="#8b949e" font-size="13">LTI System Response</text>
    <text x="350" y="775" fill="#e6edf3" font-size="18">x₁[n] * x₂[n]</text>
    <text x="950" y="775" fill="#fbbf24" font-size="18" font-weight="700">X₁(z) · X₂(z)</text>
    <text x="1500" y="765" fill="#34d399" font-size="16" font-weight="700">ROC ⊇ R₁ ∩ R₂</text>
    <text x="1500" y="795" fill="#fbbf24" font-size="13" font-weight="600">CRITICAL: If zero of X₁(z) cancels pole of X₂(z), ROC expands beyond intersection!</text>

    <!-- Row 8: Accumulation (Running Sum) -->
    <rect x="0" y="840" width="2200" height="130" rx="10" fill="#0d1117" stroke="#34d399" stroke-width="1.5"/>
    <text x="20" y="885" fill="#34d399" font-size="18" font-weight="700">8. Accumulation / Sum</text>
    <text x="20" y="915" fill="#8b949e" font-size="13">Running Sum (DT Integral)</text>
    <text x="350" y="895" fill="#e6edf3" font-size="18">∑_{k=-∞}^{n} x[k] = x[n] * u[n]</text>
    <text x="950" y="895" fill="#34d399" font-size="18" font-weight="700">[ 1 / (1 - z⁻¹) ] · X(z) = [ z / (z - 1) ] · X(z)</text>
    <text x="1500" y="885" fill="#34d399" font-size="16" font-weight="700">ROC ⊇ R_x ∩ { |z| &gt; 1 }</text>
    <text x="1500" y="915" fill="#fbbf24" font-size="13" font-weight="600">First Difference Inversion: x[n] - x[n-1] ⟷ (1 - z⁻¹) X(z) with ROC ⊇ R_x ∩ {z ≠ 0}.</text>
    <text x="1500" y="945" fill="#e6edf3" font-size="13">Parseval's Relation: ∑_{n=-∞}^{∞} |x[n]|² = (1/2πj) ∮_C X(z) X*(1/z*) z⁻¹ dz.</text>
  </g>
</svg>
