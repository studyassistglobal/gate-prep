
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350" width="2400" height="1350" style="background:#0d1117; font-family:'Inter', system-ui, sans-serif;">
  <defs>
    <pattern id="grid5" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262d" stroke-width="1" stroke-opacity="0.6"/>
    </pattern>
    <linearGradient id="panelGrad5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.98"/>
    </linearGradient>
  </defs>

  <rect width="2400" height="1350" fill="#0d1117"/>
  <rect width="2400" height="1350" fill="url(#grid5)"/>

  <!-- Title Header Block -->
  <rect x="80" y="50" width="2240" height="110" rx="16" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="120" y="105" fill="#38bdf8" font-size="34" font-weight="700" letter-spacing="1.5">SIGNALS &amp; SYSTEMS • CHAPTER 06 • FIGURE 6.5</text>
  <text x="120" y="142" fill="#8b949e" font-size="20">Discrete-Time LTI Causality &amp; BIBO Stability Decision Engine: The 4-Quadrant Pole-Zero Diagnostic Framework</text>
  <rect x="2020" y="75" width="260" height="58" rx="10" fill="#21262d" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="2150" y="112" fill="#fbbf24" font-size="20" font-weight="600" text-anchor="middle">PREPFUSION TITANS</text>

  <!-- Left: Theoretical Decision Matrix -->
  <rect x="80" y="190" width="760" height="1090" rx="18" fill="url(#panelGrad5)" stroke="#30363d" stroke-width="2"/>
  <rect x="80" y="190" width="760" height="60" rx="18" fill="#21262d"/>
  <text x="460" y="230" fill="#38bdf8" font-size="22" font-weight="700" text-anchor="middle">1. THE TWO INDEPENDENT AXIOMS</text>

  <g transform="translate(110, 270)">
    <!-- Axiom 1: Causality -->
    <rect x="0" y="0" width="700" height="230" rx="12" fill="#0d1117" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="25" y="35" fill="#38bdf8" font-size="20" font-weight="700">AXIOM 1: LTI CAUSALITY CONDITION</text>
    <text x="25" y="65" fill="#e6edf3" font-size="15">An LTI system is causal iff its impulse response satisfies:</text>
    <text x="350" y="105" fill="#38bdf8" font-size="22" font-weight="700" text-anchor="middle">h[n] = 0   for all n &lt; 0</text>
    <text x="25" y="140" fill="#fbbf24" font-size="15" font-weight="700">In the Complex z-Domain, Causality implies:</text>
    <text x="45" y="170" fill="#e6edf3" font-size="15">1. ROC is the <tspan fill="#38bdf8" font-weight="700">EXTERIOR OF A CIRCLE</tspan>: |z| &gt; max_k |p_k|.</text>
    <text x="45" y="198" fill="#e6edf3" font-size="15">2. ROC contains the point at infinity: <tspan fill="#38bdf8" font-weight="700">z = ∞ ∈ ROC</tspan>.</text>
    <text x="45" y="222" fill="#8b949e" font-size="13">3. For rational H(z), deg(Numerator) ≤ deg(Denominator) in z (Proper).</text>

    <!-- Axiom 2: Stability -->
    <rect x="0" y="255" width="700" height="230" rx="12" fill="#0d1117" stroke="#34d399" stroke-width="1.5"/>
    <text x="25" y="290" fill="#34d399" font-size="20" font-weight="700">AXIOM 2: LTI BIBO STABILITY CONDITION</text>
    <text x="25" y="320" fill="#e6edf3" font-size="15">An LTI system is bounded-input bounded-output stable iff:</text>
    <text x="350" y="360" fill="#34d399" font-size="22" font-weight="700" text-anchor="middle">∑_{n=-∞}^{∞} |h[n]| &lt; ∞  (Absolute Summability)</text>
    <text x="25" y="395" fill="#fbbf24" font-size="15" font-weight="700">In the Complex z-Domain, Stability implies:</text>
    <text x="45" y="425" fill="#34d399" font-size="16" font-weight="700">The ROC of H(z) MUST CONTAIN THE UNIT CIRCLE |z| = 1 !</text>
    <text x="45" y="455" fill="#e6edf3" font-size="14">Because H(eʲᶿ) = DTFT{h[n]} exists and is bounded everywhere.</text>
    <text x="45" y="478" fill="#8b949e" font-size="13">Stability has NO requirement that ROC must be right-sided or left-sided!</text>

    <!-- Synthesis: Causal AND Stable -->
    <rect x="0" y="510" width="700" height="200" rx="12" fill="#161b22" stroke="#fbbf24" stroke-width="2"/>
    <text x="25" y="545" fill="#fbbf24" font-size="19" font-weight="800">THE SUPREME GATE THEOREM: CAUSAL + STABLE</text>
    <text x="25" y="575" fill="#e6edf3" font-size="15">Combining Axiom 1 (ROC: |z| &gt; |p_max|) and Axiom 2 (|z|=1 ⊆ ROC):</text>
    <rect x="25" y="595" width="650" height="65" rx="8" fill="#0d1117" stroke="#34d399" stroke-width="2"/>
    <text x="350" y="637" fill="#34d399" font-size="22" font-weight="800" text-anchor="middle">ALL POLES OF H(z) MUST LIE STRICTLY INSIDE UNIT CIRCLE: |p_k| &lt; 1</text>
    <text x="25" y="685" fill="#f87171" font-size="14" font-weight="600">If even ONE pole lies on or outside |z|=1, a causal system CANNOT be BIBO stable!</text>

    <!-- Minimum-Phase Systems -->
    <rect x="0" y="730" width="700" height="240" rx="12" fill="#0d1117" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="25" y="765" fill="#a78bfa" font-size="19" font-weight="700">MINIMUM-PHASE DISCRETE SYSTEMS</text>
    <text x="25" y="795" fill="#e6edf3" font-size="15">Inverse System: H_i(z) = 1 / H(z). Zeros of H(z) become poles of H_i(z)!</text>
    <text x="25" y="828" fill="#fbbf24" font-size="15" font-weight="600">Definition: A causal, stable LTI system is MINIMUM-PHASE iff:</text>
    <text x="45" y="860" fill="#34d399" font-size="16" font-weight="700">• ALL POLES of H(z) lie strictly INSIDE the Unit Circle (|p_k| &lt; 1)</text>
    <text x="45" y="890" fill="#38bdf8" font-size="16" font-weight="700">• ALL ZEROS of H(z) lie strictly INSIDE the Unit Circle (|z_m| &lt; 1)</text>
    <text x="25" y="925" fill="#e6edf3" font-size="14">Significance: H(z) and its inverse 1/H(z) are BOTH causal and BIBO stable!</text>
    <text x="25" y="950" fill="#a78bfa" font-size="13">Has minimum group delay and minimum phase lag among all filters with same |H(eʲᶿ)|.</text>
  </g>

  <!-- Right: 4-Quadrant System Visual Classification Matrix -->
  <rect x="870" y="190" width="1450" height="1090" rx="18" fill="url(#panelGrad5)" stroke="#30363d" stroke-width="2"/>
  <rect x="870" y="190" width="1450" height="60" rx="18" fill="#21262d"/>
  <text x="1595" y="230" fill="#38bdf8" font-size="22" font-weight="700" text-anchor="middle">2. THE 4-QUADRANT LTI SYSTEM CLASSIFICATION MATRIX</text>

  <g transform="translate(900, 270)">
    <!-- Q1: Causal & Stable -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="680" height="470" rx="12" fill="#0d1117" stroke="#34d399" stroke-width="2"/>
      <rect x="0" y="0" width="680" height="40" rx="12" fill="#064e3b"/>
      <text x="340" y="27" fill="#34d399" font-size="17" font-weight="700" text-anchor="middle">QUADRANT 1: CAUSAL &amp; STABLE (THE IDEAL LTI SYSTEM)</text>

      <g transform="translate(20, 60)">
        <text x="0" y="20" fill="#e6edf3" font-size="15">• Condition: Poles strictly inside unit circle (|p| &lt; 1), ROC: |z| &gt; |p_max|.</text>
        <text x="0" y="45" fill="#34d399" font-size="15" font-weight="600">• Impulse Response: h[n] = (0.5)ⁿ u[n] ⟶ Decays to 0 as n ⟶ ∞.</text>

        <!-- Pole-zero graphic -->
        <g transform="translate(180, 190)">
          <!-- Exterior shaded ROC containing unit circle -->
          <rect x="-160" y="-120" width="320" height="240" fill="#34d399" fill-opacity="0.15"/>
          <circle cx="0" cy="0" r="45" fill="#0d1117"/> <!-- punchout inside |p| -->
          <line x1="0" y1="-120" x2="0" y2="120" stroke="#30363d" stroke-width="1.5"/>
          <line x1="-160" y1="0" x2="160" y2="0" stroke="#30363d" stroke-width="1.5"/>
          <!-- Unit Circle -->
          <circle cx="0" cy="0" r="90" fill="none" stroke="#38bdf8" stroke-width="2"/>
          <text x="65" y="-65" fill="#38bdf8" font-size="12">|z|=1</text>
          <!-- Pole circle -->
          <circle cx="0" cy="0" r="45" fill="none" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4,4"/>
          <!-- Pole at z = 0.5 -->
          <line x1="40" y1="-5" x2="50" y2="5" stroke="#f87171" stroke-width="3"/>
          <line x1="50" y1="-5" x2="40" y2="5" stroke="#f87171" stroke-width="3"/>
          <text x="55" y="5" fill="#f87171" font-size="13" font-weight="700">p = 0.5</text>
        </g>
        <text x="340" y="385" fill="#34d399" font-size="15" font-weight="700" text-anchor="middle">ROC includes |z| = 1 AND extends to z = ∞. BIBO Stable!</text>
      </g>
    </g>

    <!-- Q2: Non-Causal & Stable -->
    <g transform="translate(710, 0)">
      <rect x="0" y="0" width="680" height="470" rx="12" fill="#0d1117" stroke="#fbbf24" stroke-width="1.5"/>
      <rect x="0" y="0" width="680" height="40" rx="12" fill="#78350f"/>
      <text x="340" y="27" fill="#fbbf24" font-size="17" font-weight="700" text-anchor="middle">QUADRANT 2: NON-CAUSAL BUT STABLE</text>

      <g transform="translate(20, 60)">
        <text x="0" y="20" fill="#e6edf3" font-size="15">• Condition: ROC is annular ring or interior containing |z| = 1.</text>
        <text x="0" y="45" fill="#fbbf24" font-size="15" font-weight="600">• Impulse Response: h[n] = -(2)ⁿ u[-n-1] ⟶ Pole at z = 2, ROC: |z| &lt; 2.</text>

        <!-- Pole-zero graphic -->
        <g transform="translate(180, 190)">
          <!-- Interior shaded ROC containing unit circle -->
          <circle cx="0" cy="0" r="115" fill="#fbbf24" fill-opacity="0.18"/>
          <line x1="0" y1="-120" x2="0" y2="120" stroke="#30363d" stroke-width="1.5"/>
          <line x1="-160" y1="0" x2="160" y2="0" stroke="#30363d" stroke-width="1.5"/>
          <!-- Unit Circle inside ROC -->
          <circle cx="0" cy="0" r="60" fill="none" stroke="#38bdf8" stroke-width="2"/>
          <text x="45" y="-45" fill="#38bdf8" font-size="12">|z|=1</text>
          <!-- Pole circle at r = 2 -->
          <circle cx="0" cy="0" r="115" fill="none" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4,4"/>
          <!-- Pole at z = 2 -->
          <line x1="110" y1="-5" x2="120" y2="5" stroke="#f87171" stroke-width="3"/>
          <line x1="120" y1="-5" x2="110" y2="5" stroke="#f87171" stroke-width="3"/>
          <text x="125" y="5" fill="#f87171" font-size="13" font-weight="700">p = 2</text>
        </g>
        <text x="340" y="385" fill="#fbbf24" font-size="15" font-weight="700" text-anchor="middle">STABLE because |z|=1 ⊆ ROC, but NON-CAUSAL (left-sided)!</text>
      </g>
    </g>

    <!-- Q3: Causal & Unstable -->
    <g transform="translate(0, 500)">
      <rect x="0" y="0" width="680" height="470" rx="12" fill="#0d1117" stroke="#f87171" stroke-width="1.5"/>
      <rect x="0" y="0" width="680" height="40" rx="12" fill="#7f1d1d"/>
      <text x="340" y="27" fill="#f87171" font-size="17" font-weight="700" text-anchor="middle">QUADRANT 3: CAUSAL BUT UNSTABLE</text>

      <g transform="translate(20, 60)">
        <text x="0" y="20" fill="#e6edf3" font-size="15">• Condition: Pole outside unit circle (|p| &gt; 1), Causal ROC: |z| &gt; |p|.</text>
        <text x="0" y="45" fill="#f87171" font-size="15" font-weight="600">• Impulse Response: h[n] = (2)ⁿ u[n] ⟶ Explodes exponentially to ∞.</text>

        <!-- Pole-zero graphic -->
        <g transform="translate(180, 190)">
          <!-- Shaded ROC outside |p|=2, does NOT contain unit circle -->
          <rect x="-160" y="-120" width="320" height="240" fill="#f87171" fill-opacity="0.15"/>
          <circle cx="0" cy="0" r="105" fill="#0d1117"/>
          <line x1="0" y1="-120" x2="0" y2="120" stroke="#30363d" stroke-width="1.5"/>
          <line x1="-160" y1="0" x2="160" y2="0" stroke="#30363d" stroke-width="1.5"/>
          <!-- Unit Circle EXCLUDED -->
          <circle cx="0" cy="0" r="50" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4,4"/>
          <text x="35" y="-35" fill="#8b949e" font-size="12">|z|=1</text>
          <!-- Pole circle -->
          <circle cx="0" cy="0" r="105" fill="none" stroke="#f87171" stroke-width="2" stroke-dasharray="4,4"/>
          <!-- Pole at z = 2 -->
          <line x1="100" y1="-5" x2="110" y2="5" stroke="#f87171" stroke-width="3"/>
          <line x1="110" y1="-5" x2="100" y2="5" stroke="#f87171" stroke-width="3"/>
          <text x="115" y="5" fill="#f87171" font-size="13" font-weight="700">p = 2</text>
        </g>
        <text x="340" y="385" fill="#f87171" font-size="15" font-weight="700" text-anchor="middle">Causal (ROC extends to ∞), but UNSTABLE (|z|=1 not in ROC)!</text>
      </g>
    </g>

    <!-- Q4: Non-Causal & Unstable -->
    <g transform="translate(710, 500)">
      <rect x="0" y="0" width="680" height="470" rx="12" fill="#0d1117" stroke="#6b7280" stroke-width="1.5"/>
      <rect x="0" y="0" width="680" height="40" rx="12" fill="#1f2937"/>
      <text x="340" y="27" fill="#e6edf3" font-size="17" font-weight="700" text-anchor="middle">QUADRANT 4: NON-CAUSAL &amp; UNSTABLE</text>

      <g transform="translate(20, 60)">
        <text x="0" y="20" fill="#e6edf3" font-size="15">• Condition: ROC does not contain unit circle AND does not include z = ∞.</text>
        <text x="0" y="45" fill="#e6edf3" font-size="15">• Impulse Response: h[n] = -(0.5)ⁿ u[-n-1] ⟶ Pole at 0.5, ROC: |z| &lt; 0.5.</text>

        <!-- Pole-zero graphic -->
        <g transform="translate(180, 190)">
          <!-- Shaded ROC inside |p|=0.5, does NOT contain unit circle -->
          <circle cx="0" cy="0" r="45" fill="#6b7280" fill-opacity="0.25"/>
          <line x1="0" y1="-120" x2="0" y2="120" stroke="#30363d" stroke-width="1.5"/>
          <line x1="-160" y1="0" x2="160" y2="0" stroke="#30363d" stroke-width="1.5"/>
          <!-- Unit Circle EXCLUDED outside -->
          <circle cx="0" cy="0" r="100" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4,4"/>
          <text x="75" y="-75" fill="#8b949e" font-size="12">|z|=1</text>
          <!-- Pole circle -->
          <circle cx="0" cy="0" r="45" fill="none" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4,4"/>
          <!-- Pole at z = 0.5 -->
          <line x1="40" y1="-5" x2="50" y2="5" stroke="#f87171" stroke-width="3"/>
          <line x1="50" y1="-5" x2="40" y2="5" stroke="#f87171" stroke-width="3"/>
          <text x="55" y="5" fill="#f87171" font-size="13" font-weight="700">p = 0.5</text>
        </g>
        <text x="340" y="385" fill="#f87171" font-size="15" font-weight="700" text-anchor="middle">Left-sided sequence of growing anti-causal values: Completely Unusable!</text>
      </g>
    </g>
  </g>
</svg>
