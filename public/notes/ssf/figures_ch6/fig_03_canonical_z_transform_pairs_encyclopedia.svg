
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350" width="2400" height="1350" style="background:#0d1117; font-family:'Inter', system-ui, sans-serif;">
  <defs>
    <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262d" stroke-width="1" stroke-opacity="0.6"/>
    </pattern>
    <linearGradient id="panelGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.98"/>
    </linearGradient>
  </defs>

  <rect width="2400" height="1350" fill="#0d1117"/>
  <rect width="2400" height="1350" fill="url(#grid3)"/>

  <!-- Title Header Block -->
  <rect x="80" y="50" width="2240" height="110" rx="16" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="120" y="105" fill="#38bdf8" font-size="34" font-weight="700" letter-spacing="1.5">SIGNALS &amp; SYSTEMS • CHAPTER 06 • FIGURE 6.3</text>
  <text x="120" y="142" fill="#8b949e" font-size="20">Encyclopedia of Canonical Z-Transform Pairs: Time Sequences, Rational Closed Forms, and Pole-Zero Geometries</text>
  <rect x="2020" y="75" width="260" height="58" rx="10" fill="#21262d" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="2150" y="112" fill="#fbbf24" font-size="20" font-weight="600" text-anchor="middle">PREPFUSION TITANS</text>

  <!-- 6 Feature Panels in a 2x3 Grid -->
  
  <!-- Panel 1: Impulses & Shifts -->
  <g transform="translate(80, 190)">
    <rect x="0" y="0" width="720" height="520" rx="14" fill="url(#panelGrad3)" stroke="#30363d" stroke-width="1.5"/>
    <rect x="0" y="0" width="720" height="50" rx="14" fill="#21262d"/>
    <text x="360" y="33" fill="#38bdf8" font-size="19" font-weight="700" text-anchor="middle">1. DISCRETE IMPULSES &amp; SHIFTS</text>

    <g transform="translate(30, 70)">
      <rect x="0" y="0" width="660" height="95" rx="8" fill="#0d1117" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="20" y="35" fill="#38bdf8" font-size="20" font-weight="700">x[n] = δ[n]   ⟷   X(z) = 1</text>
      <text x="20" y="65" fill="#34d399" font-size="15" font-weight="600">ROC: Entire z-plane (all z)</text>
      <text x="20" y="85" fill="#8b949e" font-size="13">No poles, no zeros in finite plane. All frequency components equal magnitude.</text>

      <rect x="0" y="115" width="660" height="105" rx="8" fill="#0d1117" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="20" y="150" fill="#fbbf24" font-size="20" font-weight="700">x[n] = δ[n - n₀]   ⟷   X(z) = z⁻ⁿ⁰ = 1 / zⁿ⁰</text>
      <text x="20" y="180" fill="#34d399" font-size="15" font-weight="600">ROC: Entire z-plane except z = 0 (for n₀ &gt; 0)</text>
      <text x="20" y="205" fill="#8b949e" font-size="13">Pole of order n₀ at z = 0. If n₀ &lt; 0 (advance δ[n+n₀]), pole is at z = ∞!</text>

      <rect x="0" y="240" width="660" height="185" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <text x="20" y="270" fill="#e6edf3" font-size="16" font-weight="700">Geometric Insight: Finite-Length Sequence Basis</text>
      <text x="20" y="300" fill="#8b949e" font-size="14">Every finite sequence x[n] = {x₀, x₁, ..., x_N} is a linear combo of shifted impulses:</text>
      <text x="20" y="335" fill="#38bdf8" font-size="18" font-weight="700">X(z) = x[0] + x[1]z⁻¹ + x[2]z⁻² + ... + x[N]z⁻ᴺ</text>
      <text x="20" y="370" fill="#fbbf24" font-size="14" font-weight="600">ROC: Always 0 &lt; |z| ≤ ∞ (converges everywhere except origin z=0).</text>
      <text x="20" y="400" fill="#34d399" font-size="14">If anti-causal: X(z) = x[-M]zᴹ + ... ⟶ ROC is |z| &lt; ∞ (excludes ∞).</text>
    </g>
  </g>

  <!-- Panel 2: Unit Steps & Sided Twins -->
  <g transform="translate(840, 190)">
    <rect x="0" y="0" width="720" height="520" rx="14" fill="url(#panelGrad3)" stroke="#30363d" stroke-width="1.5"/>
    <rect x="0" y="0" width="720" height="50" rx="14" fill="#21262d"/>
    <text x="360" y="33" fill="#38bdf8" font-size="19" font-weight="700" text-anchor="middle">2. UNIT STEP &amp; SIDED TWINS</text>

    <g transform="translate(30, 70)">
      <!-- Right-sided u[n] -->
      <rect x="0" y="0" width="660" height="120" rx="8" fill="#0d1117" stroke="#34d399" stroke-width="1.5"/>
      <text x="20" y="35" fill="#34d399" font-size="20" font-weight="700">x[n] = u[n]   ⟷   X(z) = 1 / (1 - z⁻¹) = z / (z - 1)</text>
      <text x="20" y="65" fill="#34d399" font-size="16" font-weight="700">ROC: |z| &gt; 1  (Right-sided: exterior of unit circle)</text>
      <text x="20" y="90" fill="#e6edf3" font-size="14">Pole at z = +1, Zero at z = 0. Unit circle is on boundary of ROC!</text>
      <text x="20" y="110" fill="#f87171" font-size="13" font-weight="600">Note: DTFT of u[n] contains π δ(Ω) impulse because pole lies on |z|=1.</text>

      <!-- Left-sided -u[-n-1] -->
      <rect x="0" y="135" width="660" height="120" rx="8" fill="#0d1117" stroke="#f87171" stroke-width="1.5"/>
      <text x="20" y="170" fill="#f87171" font-size="20" font-weight="700">x[n] = -u[-n-1]   ⟷   X(z) = 1 / (1 - z⁻¹) = z / (z - 1)</text>
      <text x="20" y="200" fill="#f87171" font-size="16" font-weight="700">ROC: |z| &lt; 1  (Left-sided: interior of unit circle)</text>
      <text x="20" y="225" fill="#e6edf3" font-size="14">EXACT SAME algebraic rational expression X(z) as u[n]!</text>
      <text x="20" y="245" fill="#fbbf24" font-size="13" font-weight="700">WITHOUT SPECIFYING ROC, THE INVERSE Z-TRANSFORM IS NON-UNIQUE!</text>

      <!-- Two-sided Signum -->
      <rect x="0" y="270" width="660" height="155" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <text x="20" y="300" fill="#fbbf24" font-size="17" font-weight="700">Discrete Signum Function: sgn[n] = u[n] - u[-n-1]</text>
      <text x="20" y="330" fill="#e6edf3" font-size="15">sgn[n] = 2 u[n] - δ[n] - 1  (two-sided sequence)</text>
      <text x="20" y="365" fill="#38bdf8" font-size="18" font-weight="700">X(z) = (1 + z⁻¹) / (1 - z⁻¹) = (z + 1) / (z - 1)</text>
      <text x="20" y="395" fill="#f87171" font-size="14" font-weight="600">ROC: Empty if treated as u[n] + u[-n], evaluated via generalized Fourier.</text>
    </g>
  </g>

  <!-- Panel 3: Real Exponentials aⁿ u[n] -->
  <g transform="translate(1600, 190)">
    <rect x="0" y="0" width="720" height="520" rx="14" fill="url(#panelGrad3)" stroke="#30363d" stroke-width="1.5"/>
    <rect x="0" y="0" width="720" height="50" rx="14" fill="#21262d"/>
    <text x="360" y="33" fill="#38bdf8" font-size="19" font-weight="700" text-anchor="middle">3. REAL EXPONENTIALS aⁿ u[n] &amp; -aⁿ u[-n-1]</text>

    <g transform="translate(30, 70)">
      <!-- Right-sided a^n u[n] -->
      <rect x="0" y="0" width="660" height="120" rx="8" fill="#0d1117" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="20" y="35" fill="#38bdf8" font-size="20" font-weight="700">x[n] = aⁿ u[n]   ⟷   X(z) = 1 / (1 - a z⁻¹) = z / (z - a)</text>
      <text x="20" y="65" fill="#38bdf8" font-size="16" font-weight="700">ROC: |z| &gt; |a|</text>
      <text x="20" y="90" fill="#e6edf3" font-size="14">Pole at z = a, Zero at z = 0. Causal sequence.</text>
      <text x="20" y="110" fill="#34d399" font-size="13" font-weight="600">STABLE iff |a| &lt; 1 (ROC |z|&gt;|a| contains unit circle |z|=1).</text>

      <!-- Left-sided -a^n u[-n-1] -->
      <rect x="0" y="135" width="660" height="120" rx="8" fill="#0d1117" stroke="#f87171" stroke-width="1.5"/>
      <text x="20" y="170" fill="#f87171" font-size="20" font-weight="700">x[n] = -aⁿ u[-n-1]   ⟷   X(z) = 1 / (1 - a z⁻¹) = z / (z - a)</text>
      <text x="20" y="200" fill="#f87171" font-size="16" font-weight="700">ROC: |z| &lt; |a|</text>
      <text x="20" y="225" fill="#e6edf3" font-size="14">Pole at z = a, Zero at z = 0. Anti-causal sequence.</text>
      <text x="20" y="245" fill="#34d399" font-size="13" font-weight="600">STABLE iff |a| &gt; 1 (ROC |z|&lt;|a| contains unit circle |z|=1).</text>

      <!-- Two-sided a^|n| -->
      <rect x="0" y="270" width="660" height="155" rx="8" fill="#161b22" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="20" y="300" fill="#fbbf24" font-size="17" font-weight="700">Two-Sided Symmetrical Exponential: x[n] = a^{|n|} (|a| &lt; 1)</text>
      <text x="20" y="325" fill="#8b949e" font-size="14">Decomposition: x[n] = aⁿ u[n] + a⁻ⁿ u[-n-1]</text>
      <text x="20" y="360" fill="#fbbf24" font-size="18" font-weight="700">X(z) = (1 - a²) / [(1 - a z⁻¹)(1 - a z)]</text>
      <text x="20" y="390" fill="#34d399" font-size="15" font-weight="700">ROC: |a| &lt; |z| &lt; 1/|a|  (Concentric Annular Ring!)</text>
      <text x="20" y="415" fill="#34d399" font-size="13">Always contains unit circle |z|=1 since |a| &lt; 1 &lt; 1/|a| ⟶ Always Stable!</text>
    </g>
  </g>

  <!-- Panel 4: Ramp-Weighted Exponentials n aⁿ u[n] -->
  <g transform="translate(80, 740)">
    <rect x="0" y="0" width="720" height="540" rx="14" fill="url(#panelGrad3)" stroke="#30363d" stroke-width="1.5"/>
    <rect x="0" y="0" width="720" height="50" rx="14" fill="#21262d"/>
    <text x="360" y="33" fill="#38bdf8" font-size="19" font-weight="700" text-anchor="middle">4. RAMP-WEIGHTED EXPONENTIALS nᵏ aⁿ u[n]</text>

    <g transform="translate(30, 70)">
      <!-- n a^n u[n] -->
      <rect x="0" y="0" width="660" height="120" rx="8" fill="#0d1117" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="20" y="35" fill="#38bdf8" font-size="19" font-weight="700">x[n] = n aⁿ u[n]   ⟷   X(z) = a z⁻¹ / (1 - a z⁻¹)² = a z / (z - a)²</text>
      <text x="20" y="65" fill="#38bdf8" font-size="16" font-weight="700">ROC: |z| &gt; |a|</text>
      <text x="20" y="90" fill="#e6edf3" font-size="14">Double pole at z = a, Single zero at z = 0.</text>
      <text x="20" y="110" fill="#fbbf24" font-size="13">Derived via z-domain differentiation: n x[n] ⟷ -z dX(z)/dz.</text>

      <!-- -n a^n u[-n-1] -->
      <rect x="0" y="135" width="660" height="110" rx="8" fill="#0d1117" stroke="#f87171" stroke-width="1.5"/>
      <text x="20" y="165" fill="#f87171" font-size="19" font-weight="700">x[n] = -n aⁿ u[-n-1]   ⟷   X(z) = a z / (z - a)²</text>
      <text x="20" y="195" fill="#f87171" font-size="16" font-weight="700">ROC: |z| &lt; |a|</text>
      <text x="20" y="225" fill="#8b949e" font-size="14">Left-sided version with identical rational expression, interior ROC.</text>

      <!-- (n+1) a^n u[n] -->
      <rect x="0" y="260" width="660" height="125" rx="8" fill="#0d1117" stroke="#34d399" stroke-width="1.5"/>
      <text x="20" y="290" fill="#34d399" font-size="19" font-weight="700">x[n] = (n + 1) aⁿ u[n]   ⟷   X(z) = 1 / (1 - a z⁻¹)² = z² / (z - a)²</text>
      <text x="20" y="320" fill="#34d399" font-size="16" font-weight="700">ROC: |z| &gt; |a|</text>
      <text x="20" y="348" fill="#e6edf3" font-size="14">Double pole at z = a, Double zero at z = 0.</text>
      <text x="20" y="370" fill="#fbbf24" font-size="13" font-weight="600">Standard form for convolution of two identical exponentials: aⁿ u[n] * aⁿ u[n].</text>

      <!-- Unit ramp n u[n] -->
      <rect x="0" y="400" width="660" height="60" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="20" y="435" fill="#e6edf3" font-size="16">Unit Ramp (a = 1): <tspan fill="#38bdf8" font-weight="700">n u[n] ⟷ z / (z - 1)²</tspan>,  ROC: |z| &gt; 1</text>
    </g>
  </g>

  <!-- Panel 5: Discrete Sinusoids -->
  <g transform="translate(840, 740)">
    <rect x="0" y="0" width="720" height="540" rx="14" fill="url(#panelGrad3)" stroke="#30363d" stroke-width="1.5"/>
    <rect x="0" y="0" width="720" height="50" rx="14" fill="#21262d"/>
    <text x="360" y="33" fill="#38bdf8" font-size="19" font-weight="700" text-anchor="middle">5. DISCRETE COSINE &amp; SINE SEQUENCES</text>

    <g transform="translate(30, 70)">
      <!-- cos(Omega_0 n) u[n] -->
      <rect x="0" y="0" width="660" height="135" rx="8" fill="#0d1117" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="20" y="35" fill="#38bdf8" font-size="19" font-weight="700">x[n] = cos(Ω₀ n) u[n]</text>
      <text x="20" y="70" fill="#38bdf8" font-size="19" font-weight="700">X(z) = [1 - cos(Ω₀)z⁻¹] / [1 - 2cos(Ω₀)z⁻¹ + z⁻²]</text>
      <text x="20" y="100" fill="#38bdf8" font-size="16" font-weight="700">ROC: |z| &gt; 1</text>
      <text x="20" y="123" fill="#8b949e" font-size="13">Complex conjugate poles on unit circle at z = e^{±j Ω₀}. Zero at z = cos(Ω₀).</text>

      <!-- sin(Omega_0 n) u[n] -->
      <rect x="0" y="150" width="660" height="135" rx="8" fill="#0d1117" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="20" y="185" fill="#fbbf24" font-size="19" font-weight="700">x[n] = sin(Ω₀ n) u[n]</text>
      <text x="20" y="220" fill="#fbbf24" font-size="19" font-weight="700">X(z) = [sin(Ω₀)z⁻¹] / [1 - 2cos(Ω₀)z⁻¹ + z⁻²]</text>
      <text x="20" y="250" fill="#fbbf24" font-size="16" font-weight="700">ROC: |z| &gt; 1</text>
      <text x="20" y="273" fill="#8b949e" font-size="13">Complex conjugate poles on unit circle at z = e^{±j Ω₀}. Zero at origin z = 0.</text>

      <!-- Important Special Cases -->
      <rect x="0" y="300" width="660" height="160" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <text x="20" y="330" fill="#34d399" font-size="16" font-weight="700">GATE High-Frequency Landmark Cases:</text>
      <text x="20" y="360" fill="#e6edf3" font-size="14">1. Ω₀ = π/2: <tspan fill="#38bdf8" font-weight="700">cos(πn/2)u[n] ⟷ 1 / (1 + z⁻²) = z² / (z² + 1)</tspan> (Poles at ±j)</text>
      <text x="20" y="390" fill="#e6edf3" font-size="14">2. Ω₀ = π/2: <tspan fill="#fbbf24" font-weight="700">sin(πn/2)u[n] ⟷ z⁻¹ / (1 + z⁻²) = z / (z² + 1)</tspan> (Poles at ±j)</text>
      <text x="20" y="420" fill="#e6edf3" font-size="14">3. Ω₀ = π: <tspan fill="#f87171" font-weight="700">cos(πn)u[n] = (-1)ⁿ u[n] ⟷ 1 / (1 + z⁻¹) = z / (z + 1)</tspan> (Pole at -1)</text>
      <text x="20" y="445" fill="#34d399" font-size="13" font-weight="600">All cases have ROC |z| &gt; 1. Bounded oscillations, marginally stable.</text>
    </g>
  </g>

  <!-- Panel 6: Damped Sinusoids -->
  <g transform="translate(1600, 740)">
    <rect x="0" y="0" width="720" height="540" rx="14" fill="url(#panelGrad3)" stroke="#30363d" stroke-width="1.5"/>
    <rect x="0" y="0" width="720" height="50" rx="14" fill="#21262d"/>
    <text x="360" y="33" fill="#38bdf8" font-size="19" font-weight="700" text-anchor="middle">6. DAMPED DISCRETE SINUSOIDS rⁿ cos/sin</text>

    <g transform="translate(30, 70)">
      <!-- r^n cos(Omega_0 n) u[n] -->
      <rect x="0" y="0" width="660" height="135" rx="8" fill="#0d1117" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="20" y="35" fill="#38bdf8" font-size="19" font-weight="700">x[n] = rⁿ cos(Ω₀ n) u[n]</text>
      <text x="20" y="70" fill="#38bdf8" font-size="19" font-weight="700">X(z) = [1 - r cos(Ω₀)z⁻¹] / [1 - 2r cos(Ω₀)z⁻¹ + r² z⁻²]</text>
      <text x="20" y="100" fill="#38bdf8" font-size="16" font-weight="700">ROC: |z| &gt; r</text>
      <text x="20" y="123" fill="#8b949e" font-size="13">Poles at z = r e^{±j Ω₀} (magnitude radius r, angles ±Ω₀).</text>

      <!-- r^n sin(Omega_0 n) u[n] -->
      <rect x="0" y="150" width="660" height="135" rx="8" fill="#0d1117" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="20" y="185" fill="#fbbf24" font-size="19" font-weight="700">x[n] = rⁿ sin(Ω₀ n) u[n]</text>
      <text x="20" y="220" fill="#fbbf24" font-size="19" font-weight="700">X(z) = [r sin(Ω₀)z⁻¹] / [1 - 2r cos(Ω₀)z⁻¹ + r² z⁻²]</text>
      <text x="20" y="250" fill="#fbbf24" font-size="16" font-weight="700">ROC: |z| &gt; r</text>
      <text x="20" y="273" fill="#8b949e" font-size="13">Poles at z = r e^{±j Ω₀}. Zero at origin z = 0.</text>

      <!-- Stability Criterion for Damped Sinusoids -->
      <rect x="0" y="300" width="660" height="160" rx="8" fill="#0d1117" stroke="#34d399" stroke-width="2"/>
      <text x="20" y="330" fill="#34d399" font-size="17" font-weight="700">STABILITY CRITERION (GATE ESSENTIAL):</text>
      <text x="20" y="360" fill="#e6edf3" font-size="15">• <tspan fill="#34d399" font-weight="700">r &lt; 1</tspan>: Poles lie INSIDE unit circle ⟶ Decay to 0 ⟶ <tspan fill="#34d399" font-weight="700">STABLE</tspan></text>
      <text x="20" y="390" fill="#e6edf3" font-size="15">• <tspan fill="#fbbf24" font-weight="700">r = 1</tspan>: Poles ON unit circle ⟶ Undamped oscillations ⟶ <tspan fill="#fbbf24" font-weight="700">MARGINALLY STABLE</tspan></text>
      <text x="20" y="420" fill="#e6edf3" font-size="15">• <tspan fill="#f87171" font-weight="700">r &gt; 1</tspan>: Poles OUTSIDE unit circle ⟶ Explodes to ∞ ⟶ <tspan fill="#f87171" font-weight="700">UNSTABLE</tspan></text>
      <text x="20" y="445" fill="#38bdf8" font-size="13" font-weight="600">Euler Relation Bridge: rⁿ cos(Ω₀ n) = (1/2)[ (r e^{jΩ₀})ⁿ + (r e^{-jΩ₀})ⁿ ] u[n].</text>
    </g>
  </g>
</svg>
