<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GATE Prep — free chapter-wise study notes for GATE 2027 (ECE): Digital Electronics and more, with solved examples and exam strategy." />
    <title>GATE Prep — GATE 2027 Notes</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Geist:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script>
      // Apply saved theme before first paint to avoid a flash. Default: dark.
      (function () {
        var t = 'dark';
        try { t = window.localStorage.getItem('df-theme') || 'dark'; } catch (e) {}
        document.documentElement.classList.add(t === 'light' ? 'light' : 'dark');
      })();

      window.addEventListener('error', function (e) {
        console.error('Global client error:', e);
        var root = document.getElementById('root');
        if (root && root.innerHTML.trim() === '') {
          var box = document.createElement('div');
          box.style = 'padding:24px;margin:24px;background:#1e293b;border:1px solid #ef4444;border-radius:8px;color:#f8fafc;font-family:sans-serif;';
          box.innerHTML = '<h3 style="color:#ef4444;margin-top:0">Application Error</h3><p>' + (e.message || e.error || e) + '</p><button onclick="location.reload()" style="padding:8px 16px;background:#3b82f6;color:#fff;border:none;border-radius:4px;cursor:pointer">Reload Page</button>';
          root.appendChild(box);
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
